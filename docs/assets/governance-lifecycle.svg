validation</text><path d="M590 110 H610" stroke="#64748b" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/><rect x="616" y="62" width="166" height="96" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="616" y="62" width="5" height="96" rx="2.5" fill="#7c3aed"/><text x="634" y="100" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#0f172a">Approval</text><text x="634" y="127" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#475569">Contract + pipeline</text><path d="M788 110 H808" stroke="#64748b" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/><rect x="814" y="62" width="166" height="96" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="814" y="62" width="5" height="96" rx="2.5" fill="#2563eb"/><text x="832" y="100" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#0f172a">Deployment</text><text x="832" y="127" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#475569">Engineering action</text><text x="25" y="216" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#334155">Governance defines and approves. Engineering validates and separately deploys the approved notebook.</text><rect x="22" y="246" width="956" height="48" rx="12" fill="#fff7ed" stroke="#fbbf24" stroke-width="1.5"/><text x="40" y="276" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#92400e">Governed execution remains gated pending signed-in Fabric acceptance.</text></svg>