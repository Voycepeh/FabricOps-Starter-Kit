<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Governance intent meets Engineering observations</title>
  <desc id="desc">Engineering records observed catalogue, profile, lineage and guardrail results. Governance authors agreements, enrichment and guardrails. A Data Contract freezes the governed definition used by Production.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7a8793"/></marker><style>.title{font:600 28px Arial,sans-serif;fill:#24313d}.kicker{font:700 11px 'Courier New',monospace;letter-spacing:1.5px;fill:#0f8f83}.node{fill:#fff;stroke:#aeb9c2;stroke-width:1.5}.focal{fill:#e8f6f3;stroke:#0f8f83;stroke-width:2}.store{fill:#f6f8f9;stroke:#c7d0d7;stroke-width:1.5}.name{font:600 18px Arial,sans-serif;fill:#24313d}.sub{font:12px 'Courier New',monospace;fill:#687580}.label{font:600 13px Arial,sans-serif;fill:#52606c}.line{fill:none;stroke:#7a8793;stroke-width:1.7;marker-end:url(#arrow)}.zone{fill:#24313d;fill-opacity:.018;stroke:#24313d;stroke-opacity:.12;stroke-width:1}.zoneLabel{font:700 10px 'Courier New',monospace;letter-spacing:1.2px;fill:#7a8793}.note{font:italic 15px Georgia,serif;fill:#52606c}</style></defs>
  <rect width="1200" height="560" fill="#fff"/><text x="55" y="52" class="kicker">SHARED METADATA MODEL</text><text x="55" y="86" class="title">Governance intent meets Engineering observations</text><text x="55" y="113" class="note">Observed facts and authored expectations stay distinct until a Data Contract freezes the governed definition.</text>
  <rect x="55" y="155" width="360" height="300" rx="8" class="zone"/><rect x="76" y="149" width="174" height="20" fill="#fff"/><text x="86" y="163" class="zoneLabel">ENGINEERING OBSERVES</text><rect x="88" y="195" width="294" height="218" rx="7" class="store"/><text x="111" y="226" class="name">What happened</text><text x="111" y="260" class="sub">METADATA_DATA_CATALOGUE</text><text x="111" y="287" class="sub">METADATA_DATA_PROFILED</text><text x="111" y="314" class="sub">METADATA_DATA_PROFILED_FREQUENCY</text><text x="111" y="341" class="sub">METADATA_DATA_LINEAGE</text><text x="111" y="368" class="sub">METADATA_GUARDRAIL_RESULTS</text><text x="111" y="396" class="label">Profiles describe observed table snapshots.</text>
  <rect x="785" y="155" width="360" height="300" rx="8" class="zone"/><rect x="806" y="149" width="166" height="20" fill="#fff"/><text x="816" y="163" class="zoneLabel">GOVERNANCE AUTHORS</text><rect x="818" y="195" width="294" height="218" rx="7" class="focal"/><text x="841" y="226" class="name">What should be true</text><text x="841" y="266" class="sub">METADATA_DATA_AGREEMENT</text><text x="841" y="300" class="sub">METADATA_ENRICHMENT</text><text x="841" y="334" class="sub">METADATA_GUARDRAIL</text><text x="841" y="380" class="label">Stewards review and author governed intent.</text>
  <path d="M382 305 H475" class="line"/><path d="M818 305 H725" class="line"/><rect x="475" y="230" width="250" height="150" rx="7" class="focal"/><text x="600" y="268" text-anchor="middle" class="kicker">GOVERNED BRIDGE</text><text x="600" y="305" text-anchor="middle" class="name">Data Contract</text><text x="600" y="333" text-anchor="middle" class="sub">versioned + frozen per table</text><text x="600" y="355" text-anchor="middle" class="sub">selected active for Production</text><path d="M600 380 V443" class="line"/><rect x="470" y="443" width="260" height="76" rx="7" class="node"/><text x="600" y="475" text-anchor="middle" class="name">Engineering Production</text><text x="600" y="499" text-anchor="middle" class="sub">02_pipeline resolves active contract</text>
</svg>