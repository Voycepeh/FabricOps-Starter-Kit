<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">How FabricOps persists data and metadata across workspaces</title>
  <desc id="desc">Governance owns Development and Production metadata lakehouses. Engineering Development and Production write business data to configured Lakehouses or Warehouses and write workflow metadata to the matching Governance metadata lakehouse. Consumers read approved Production data.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7a8793"/></marker>
    <style>
      .title{font:600 28px Arial,sans-serif;fill:#24313d}.kicker{font:700 11px 'Courier New',monospace;letter-spacing:1.5px;fill:#0f8f83}.zone{fill:#24313d;fill-opacity:.018;stroke:#24313d;stroke-opacity:.12;stroke-width:1}.zoneLabel{font:700 10px 'Courier New',monospace;letter-spacing:1.1px;fill:#7a8793}.node{fill:#fff;stroke:#aeb9c2;stroke-width:1.5}.focal{fill:#e8f6f3;stroke:#0f8f83;stroke-width:2}.store{fill:#f6f8f9;stroke:#c7d0d7;stroke-width:1.5}.name{font:600 18px Arial,sans-serif;fill:#24313d}.sub{font:12px 'Courier New',monospace;fill:#687580}.small{font:12px Arial,sans-serif;fill:#687580}.line{fill:none;stroke:#7a8793;stroke-width:1.7;marker-end:url(#arrow)}.dash{fill:none;stroke:#9aa5ae;stroke-width:1.3;stroke-dasharray:5 4;marker-end:url(#arrow)}.note{font:italic 15px Georgia,serif;fill:#52606c}
    </style>
  </defs>
  <rect width="1200" height="590" fill="#fff"/>
  <text x="55" y="52" class="kicker">FABRIC WORKSPACE TOPOLOGY</text>
  <text x="55" y="86" class="title">Data products and metadata persist in different places</text>
  <text x="55" y="113" class="note">The workflow writes business data to Engineering stores and metadata to the matching Governance metadata lakehouse.</text>

  <rect x="50" y="155" width="292" height="355" rx="8" class="zone"/>
  <rect x="70" y="149" width="150" height="20" fill="#fff"/>
  <text x="80" y="163" class="zoneLabel">GOVERNANCE WORKSPACE</text>
  <rect x="82" y="198" width="228" height="126" rx="7" class="focal"/>
  <text x="196" y="231" text-anchor="middle" class="name">Development metadata</text>
  <text x="196" y="255" text-anchor="middle" class="sub">Governance Lakehouse</text>
  <text x="196" y="279" text-anchor="middle" class="small">Catalogue · Profiled · Frequency</text>
  <text x="196" y="298" text-anchor="middle" class="small">Lineage · Guardrails · Results</text>
  <rect x="82" y="354" width="228" height="126" rx="7" class="focal"/>
  <text x="196" y="387" text-anchor="middle" class="name">Production metadata</text>
  <text x="196" y="411" text-anchor="middle" class="sub">Governance Lakehouse</text>
  <text x="196" y="435" text-anchor="middle" class="small">Active contracts + Production</text>
  <text x="196" y="454" text-anchor="middle" class="small">observations and results</text>

  <rect x="405" y="155" width="300" height="355" rx="8" class="zone"/>
  <rect x="425" y="149" width="198" height="20" fill="#fff"/>
  <text x="435" y="163" class="zoneLabel">ENGINEERING DEVELOPMENT</text>
  <rect x="438" y="208" width="234" height="88" rx="7" class="node"/>
  <text x="555" y="240" text-anchor="middle" class="name">02_pipeline</text>
  <text x="555" y="264" text-anchor="middle" class="sub">develop · profile · validate</text>
  <rect x="438" y="348" width="234" height="105" rx="7" class="store"/>
  <text x="555" y="381" text-anchor="middle" class="name">Development data</text>
  <text x="555" y="407" text-anchor="middle" class="sub">Lakehouse / Warehouse</text>
  <text x="555" y="431" text-anchor="middle" class="small">source · unified · product</text>

  <rect x="770" y="155" width="300" height="355" rx="8" class="zone"/>
  <rect x="790" y="149" width="194" height="20" fill="#fff"/>
  <text x="800" y="163" class="zoneLabel">ENGINEERING PRODUCTION</text>
  <rect x="803" y="208" width="234" height="88" rx="7" class="node"/>
  <text x="920" y="240" text-anchor="middle" class="name">02_pipeline</text>
  <text x="920" y="264" text-anchor="middle" class="sub">active Data Contract</text>
  <rect x="803" y="348" width="234" height="105" rx="7" class="store"/>
  <text x="920" y="381" text-anchor="middle" class="name">Production data</text>
  <text x="920" y="407" text-anchor="middle" class="sub">Lakehouse / Warehouse</text>
  <text x="920" y="431" text-anchor="middle" class="small">trusted durable outputs</text>

  <rect x="1092" y="248" width="92" height="142" rx="8" class="zone"/>
  <text x="1138" y="269" text-anchor="middle" class="zoneLabel">CONSUMER</text>
  <rect x="1104" y="290" width="68" height="66" rx="7" class="node"/>
  <text x="1138" y="318" text-anchor="middle" class="name" font-size="14">99</text>
  <text x="1138" y="338" text-anchor="middle" class="sub">explore</text>

  <path d="M438 250 H338 Q326 250 326 262 V262 Q326 274 310 274" class="dash"/>
  <path d="M555 296 V348" class="line"/>
  <path d="M803 250 H738 Q726 250 726 330 V396 Q726 410 712 410 H310" class="dash"/>
  <path d="M920 296 V348" class="line"/>
  <path d="M1037 400 H1080 Q1092 400 1092 388 V356 Q1092 344 1104 344" class="line"/>

  <text x="347" y="236" class="sub">workflow metadata</text>
  <text x="689" y="392" text-anchor="end" class="sub">Production metadata</text>
  <text x="1052" y="386" class="sub">approved data</text>
</svg>