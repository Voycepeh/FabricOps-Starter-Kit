<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">FabricOps data model</title>
  <desc id="desc">Three-layer FabricOps data model showing workflow metadata in the metadata lakehouse, one governed physical engineering table, and table-specific engineering support assets connected by table_id.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6b7280"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e97820"/>
    </marker>
    <style>
      .title{font:600 28px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#173f3c}
      .eyebrow{font:600 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.5px;fill:#6b7280}
      .heading{font:600 16px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#173f3c}
      .body{font:400 13px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#4b5563}
      .mono{font:500 12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#374151}
      .accentText{font:600 12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#9a3f00}
      .small{font:500 10px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#6b7280;letter-spacing:.4px}
    </style>
  </defs>
  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="64" y="56" class="title">FabricOps data model</text>
  <text x="64" y="84" class="body">Metadata governs the workflow. Physical tables hold engineered data. Support tables enforce table-specific controls.</text>
  <rect x="64" y="124" width="1072" height="220" rx="8" fill="#f7fbfa" stroke="#9bcac5"/>
  <text x="88" y="152" class="eyebrow">METADATA LAKEHOUSE · METADATA SCHEMA</text>
  <rect x="88" y="176" width="304" height="132" rx="6" fill="#ffffff" stroke="#7fb8b1"/>
  <text x="108" y="204" class="heading">Governance workflow</text>
  <text x="108" y="232" class="mono">DATA_STEWARD · DATA_AGREEMENT</text>
  <text x="108" y="256" class="mono">ENRICHMENT · DATA_CONTRACT</text>
  <text x="108" y="284" class="body">Authored governance state and approved contract versions</text>
  <rect x="448" y="176" width="432" height="132" rx="6" fill="#ffffff" stroke="#7fb8b1"/>
  <text x="468" y="204" class="heading">Engineering metadata &amp; evidence</text>
  <text x="468" y="232" class="mono">DATA_CATALOGUE · DATA_PROFILED · LINEAGE</text>
  <text x="468" y="256" class="mono">SOURCE_OBSERVATION · GUARDRAIL · RESULTS</text>
  <text x="468" y="284" class="body">Technical identity, observations, lineage and run-level validation evidence</text>
  <rect x="936" y="188" width="168" height="84" rx="6" fill="#fff4e8" stroke="#e97820" stroke-width="1.2"/>
  <text x="1020" y="216" text-anchor="middle" class="eyebrow">SHARED IDENTITY</text>
  <text x="1020" y="246" text-anchor="middle" class="accentText">table_id</text>
  <path d="M1020 272 V380 H600" fill="none" stroke="#e97820" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <rect x="788" y="324" width="112" height="24" rx="2" fill="#ffffff"/>
  <text x="844" y="340" text-anchor="middle" class="small">LINK BY table_id</text>
  <rect x="352" y="380" width="496" height="116" rx="8" fill="#ffffff" stroke="#173f3c" stroke-width="1.2"/>
  <text x="376" y="408" class="eyebrow">CONFIGURED LAKEHOUSE OR WAREHOUSE · BUSINESS SCHEMA</text>
  <text x="376" y="440" class="heading">Governed physical engineering table</text>
  <text x="376" y="468" class="body">Created or written by the project-specific 02_pipeline and represented in FabricOps by one canonical table_id.</text>
  <path d="M600 496 V548" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="532" y="510" width="136" height="24" rx="2" fill="#ffffff"/>
  <text x="600" y="526" text-anchor="middle" class="small">1 GOVERNED TABLE</text>
  <rect x="160" y="548" width="880" height="124" rx="8" fill="#fafafa" stroke="#c9ced4"/>
  <text x="184" y="576" class="eyebrow">ENGINEERING SUPPORT SCHEMA · TABLE-SPECIFIC OPERATIONAL ASSETS</text>
  <rect x="184" y="596" width="232" height="52" rx="6" fill="#ffffff" stroke="#9aa2aa"/>
  <text x="300" y="618" text-anchor="middle" class="heading">PII token map</text>
  <text x="300" y="638" text-anchor="middle" class="small">reversible protected mapping</text>
  <rect x="484" y="596" width="232" height="52" rx="6" fill="#ffffff" stroke="#9aa2aa"/>
  <text x="600" y="618" text-anchor="middle" class="heading">DQ failure table</text>
  <text x="600" y="638" text-anchor="middle" class="small">failed records + rule evidence</text>
  <rect x="784" y="596" width="232" height="52" rx="6" fill="#ffffff" stroke="#9aa2aa"/>
  <text x="900" y="618" text-anchor="middle" class="heading">Row access config</text>
  <text x="900" y="638" text-anchor="middle" class="small">table-specific RLS assignments</text>
  <line x1="64" y1="696" x2="1136" y2="696" stroke="#e5e7eb"/>
  <text x="64" y="714" class="small">ARCHITECTURE CONTRACT · table_id bridges workflow metadata, the governed physical table, and support assets</text>
</svg>
