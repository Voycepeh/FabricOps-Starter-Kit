<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="How Data Contracts Affect ETL"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#536377"/></marker></defs><rect width="1200" height="620" fill="#fff"/><text x="50" y="71" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="700" fill="#172235" text-anchor="start">How Data Contracts Affect ETL</text><text x="50" y="107" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="500" fill="#536377" text-anchor="start">Contract checks apply at boundaries, not inside your PySpark transformation.</text><path d="M50 128 H1150" stroke="#D8E3EA" stroke-width="1.5"/><rect x="50" y="190" width="310" height="146" rx="10" fill="#EEF7FF" stroke="#1685D1" stroke-width="1.5"/><text x="70" y="230" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#172235" text-anchor="start">Read checks</text><text x="70" y="264" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#536377" text-anchor="start">Freshness · Schema · Grain</text><rect x="445" y="190" width="310" height="146" rx="10" fill="#ECF9F0" stroke="#16A66A" stroke-width="1.5"/><text x="465" y="230" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#172235" text-anchor="start">Transform</text><text x="465" y="264" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#536377" text-anchor="start">Project-owned PySpark</text><rect x="840" y="190" width="310" height="146" rx="10" fill="#EAFBFA" stroke="#06A9B4" stroke-width="1.5"/><text x="860" y="230" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#172235" text-anchor="start">Write checks</text><text x="860" y="264" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#536377" text-anchor="start">Schema · Sensitive Data</text><path d="M362 264 H435 V264" stroke="#536377" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><path d="M757 264 H830 V264" stroke="#536377" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><text x="66" y="325" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#536377" text-anchor="start">Data Quality where configured</text><text x="850" y="325" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="500" fill="#536377" text-anchor="start">Grain · Data Quality · Source Drift</text><rect x="68" y="394" width="321" height="32" rx="15" fill="#EAFBFA" stroke="#EAFBFA" stroke-width="1.5"/><text x="228.5" y="416" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#06A9B4" text-anchor="middle">Dry Run: preview, no publish</text><rect x="441" y="394" width="321" height="32" rx="15" fill="#EAFBFA" stroke="#EAFBFA" stroke-width="1.5"/><text x="601.5" y="416" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#06A9B4" text-anchor="middle">Ungoverned: no contract</text><rect x="817" y="394" width="321" height="32" rx="15" fill="#FFF7E6" stroke="#FFF7E6" stroke-width="1.5"/><text x="977.5" y="416" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#B76D11" text-anchor="middle">Governed: gated</text><rect x="52" y="452" width="1096" height="58" rx="10" fill="#EEF7FF" stroke="#EEF7FF" stroke-width="1.5"/><text x="76" y="487" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="600" fill="#172235" text-anchor="start">Governed execution is gated pending signed-in Microsoft Fabric acceptance.</text><rect x="52" y="526" width="1096" height="62" rx="10" fill="#EAFBFA" stroke="#EAFBFA" stroke-width="1.5"/><text x="76" y="564" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="600" fill="#172235" text-anchor="start">Contract activation and publication authority are independent of project transformation code.</text></svg>