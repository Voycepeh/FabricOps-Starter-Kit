<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="Source Drift: Previously Consumed Source Content"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#536377"/></marker></defs><rect width="1200" height="620" fill="#fff"/><text x="50" y="71" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="700" fill="#172235" text-anchor="start">Source Drift: Previously Consumed Source Content</text><text x="50" y="107" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="500" fill="#536377" text-anchor="start">Observe complete physical-source content, even outside an incremental read window.</text><path d="M50 128 H1150" stroke="#D8E3EA" stroke-width="1.5"/><rect x="50" y="176" width="300" height="172" rx="10" fill="#EEF7FF" stroke="#1685D1" stroke-width="1.5"/><text x="70" y="216" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#172235" text-anchor="start">Last accepted baseline</text><text x="70" y="250" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#536377" text-anchor="start">Source → target → workspace</text><rect x="450" y="176" width="300" height="172" rx="10" fill="#EAFBFA" stroke="#06A9B4" stroke-width="1.5"/><text x="470" y="216" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#172235" text-anchor="start">Current observation</text><text x="470" y="250" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#536377" text-anchor="start">Full physical source</text><rect x="850" y="176" width="300" height="172" rx="10" fill="#ECF9F0" stroke="#16A66A" stroke-width="1.5"/><text x="870" y="216" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#172235" text-anchor="start">Content comparison</text><text x="870" y="250" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#536377" text-anchor="start">Changed scope detected</text><rect x="74" y="293" width="252" height="32" rx="15" fill="#EAFBFA" stroke="#EAFBFA" stroke-width="1.5"/><text x="200" y="315" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#06A9B4" text-anchor="middle">Fingerprint: F1</text><rect x="474" y="293" width="252" height="32" rx="15" fill="#EAFBFA" stroke="#EAFBFA" stroke-width="1.5"/><text x="600" y="315" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#06A9B4" text-anchor="middle">Fingerprint: F2</text><rect x="874" y="293" width="250" height="32" rx="15" fill="#ECF9F0" stroke="#ECF9F0" stroke-width="1.5"/><text x="999" y="315" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#16A66A" text-anchor="middle">F1 ≠ F2</text><path d="M351 263 H440 V263" stroke="#536377" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><path d="M751 263 H840 V263" stroke="#536377" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="50" y="391" width="1100" height="109" rx="10" fill="#EEF7FF" stroke="#D8E3EA" stroke-width="1.5"/><text x="74" y="432" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#172235" text-anchor="start">Comparison basis</text><text x="74" y="466" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="500" fill="#536377" text-anchor="start">Partition presence · row count · change bounds · content fingerprint</text><text x="74" y="490" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#536377" text-anchor="start">Reports affected partitions, not individual changed business records.</text><rect x="52" y="526" width="1096" height="62" rx="10" fill="#EAFBFA" stroke="#EAFBFA" stroke-width="1.5"/><text x="76" y="564" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="600" fill="#172235" text-anchor="start">A new accepted baseline r