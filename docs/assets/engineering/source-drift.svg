<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 390" width="1120" height="390" role="img" aria-label="Source Drift: content observation"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#546477"/></marker></defs><rect width="1120" height="390" fill="#fff"/><text x="28" y="48" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#192434">Source Drift: content observation</text><path d="M28 66H1092" stroke="#CFDCE5" stroke-width="1.3"/><rect x="30" y="131" width="315" height="111" rx="7" fill="#F6FAFC" stroke="#CFDCE5" stroke-width="1.5"/><text x="46" y="170" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#192434">Observe full source</text><text x="46" y="203" font-family="Consolas,Menlo,monospace" font-size="15" font-weight="400" fill="#546477">observe_full_source()</text><rect x="403" y="131" width="315" height="111" rx="7" fill="#EAF7F3" stroke="#128779" stroke-width="1.5"/><text x="419" y="170" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#192434">Compare accepted state</text><text x="419" y="203" font-family="Consolas,Menlo,monospace" font-size="15" font-weight="400" fill="#546477">check_source_drift()</text><rect x="776" y="131" width="315" height="111" rx="7" fill="#F6FAFC" stroke="#CFDCE5" stroke-width="1.5"/><text x="792" y="170" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#192434">Changed partitions</text><text x="792" y="203" font-family="Consolas,Menlo,monospace" font-size="15" font-weight="400" fill="#546477">new / changed / removed</text><path d="M353 184H395" stroke="#546477" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M726 184H768" stroke="#546477" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="34" y="302" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#192434">Compares row count, change bounds and content fingerprints, not schema or statistics.</text><text x="34" y="337" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#546477">Accepted source-to-target baseline advances only after verified target publication.</text></svg>