<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="790" viewBox="0 0 1440 790" role="img" aria-labelledby="title desc">
<title id="title">Pipeline Source Drift observation</title>
<desc id="desc">Accepted history and current physical sources feed exact hash comparison. All source results are consolidated before the blocking decision. Successful Finalize and verified publications accept candidates.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#52627A"/></marker></defs>
<rect width="1440" height="790" fill="#FFFFFF"/>

<text x="68" y="94" font-family="Segoe UI,Arial,sans-serif" font-size="48" fill="#19243A" font-weight="700" text-anchor="start">Source Drift</text>
<rect x="68" y="123" width="175" height="6" rx="3" fill="#2563EB"/>
<text x="68" y="177" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#52627A" font-weight="400" text-anchor="start">Observe every previously read source. New rows alone are allowed.</text>
<path d="M452 330 H506 Q514 330 514 338 V353 Q514 361 522 361 H548" fill="none" stroke="#52627A" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M452 525 H506 Q514 525 514 517 V479 Q514 471 522 471 H548" fill="none" stroke="#52627A" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M934 416 H990" fill="none" stroke="#52627A" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="68" y="239" width="384" height="167" rx="18" fill="#FFFFFF" stroke="#DDE3F3" stroke-width="2"/>
<text x="94" y="281" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#19243A" font-weight="700" text-anchor="start">Accepted history</text>
<text x="94" y="323" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#19243A" font-weight="400" text-anchor="start">Identity + content hashes</text>
<text x="94" y="359" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#52627A" font-weight="400" text-anchor="start">Row multiplicity + manifest</text>
<rect x="68" y="443" width="384" height="167" rx="18" fill="#FFFFFF" stroke="#DDE3F3" stroke-width="2"/>
<text x="94" y="485" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#19243A" font-weight="700" text-anchor="start">Current source</text>
<text x="94" y="527" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#19243A" font-weight="400" text-anchor="start">Full source for any Read Mode</text>
<text x="94" y="563" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#52627A" font-weight="400" text-anchor="start">Validate keys; hash in Spark</text>
<rect x="548" y="291" width="386" height="250" rx="18" fill="#F6F8FF" stroke="#2563EB" stroke-width="2"/>
<text x="741" y="337" font-family="Segoe UI,Arial,sans-serif" font-size="27" fill="#19243A" font-weight="700" text-anchor="middle">Compare exact evidence</text>
<text x="741" y="384" font-family="Cascadia Code,Consolas,monospace" font-size="22" fill="#2563EB" font-weight="600" text-anchor="middle">observe_source_drift()</text>
<text x="741" y="432" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#19243A" font-weight="400" text-anchor="middle">Keyed rows or multisets</text>
<text x="741" y="477" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#52627A" font-weight="400" text-anchor="middle">Candidate; not yet accepted</text>
<rect x="990" y="239" width="382" height="371" rx="18" fill="#FFFFFF" stroke="#DDE3F3" stroke-width="2"/>
<text x="1016" y="281" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#19243A" font-weight="700" text-anchor="start">One pipeline decision</text>
<text x="1016" y="327" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#52627A" font-weight="400" text-anchor="start">All sources evaluated first</text>
<text x="1016" y="377" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#15803D" font-weight="600" text-anchor="start">Added: allowed</text>
<text x="1016" y="419" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#B91C1C" font-weight="600" text-anchor="start">Modified / missing: drift</text>
<text x="1016" y="461" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#19243A" font-weight="400" text-anchor="start">Uncertain identity: explicit</text>
<text x="1016" y="517" font-family="Cascadia Code,Consolas,monospace" font-size="22" fill="#19243A" font-weight="400" text-anchor="start">block=True  →  stop</text>
<text x="1016" y="563" font-family="Cascadia Code,Consolas,monospace" font-size="22" fill="#19243A" font-weight="400" text-anchor="start">block=False →  warn</text>
<rect x="68" y="654" width="1304" height="82" rx="18" fill="#F6F8FF" stroke="#DDE3F3" stroke-width="2"/>
<text x="94" y="689" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#19243A" font-weight="600" text-anchor="start">Successful Finalize + verified required publications → accept candidate</text>
<text x="94" y="720" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#52627A" font-weight="400" text-anchor="start">METADATA_PROCESSING_STATE retains hashes; Guardrail Results retain bounded diagnostics.</text>
</svg>
