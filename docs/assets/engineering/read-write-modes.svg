<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="790" viewBox="0 0 1440 790" role="img" aria-label="Read modes and write strategies"><defs><linearGradient id="accent"><stop offset="0%" stop-color="#2563EB"/><stop offset="55%" stop-color="#7C3AED"/><stop offset="100%" stop-color="#7C3AED"/></linearGradient><linearGradient id="bl" x2="0" y2="1"><stop offset="0%" stop-color="#E8F0FF"/><stop offset="100%" stop-color="#FAFBFF"/></linearGradient><linearGradient id="gr" x2="0" y2="1"><stop offset="0%" stop-color="#EEE6FF"/><stop offset="100%" stop-color="#FBFAFF"/></linearGradient><linearGradient id="aq" x2="0" y2="1"><stop offset="0%" stop-color="#EEE6FF"/><stop offset="100%" stop-color="#FBFAFF"/></linearGradient><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#19243A"/></marker></defs><rect width="1440" height="790" fill="#fff"/><text x="68" y="94" fill="#19243A" font-family="Segoe UI,Arial,sans-serif" font-size="48" font-weight="700" text-anchor="start">Read modes and write strategies</text><rect x="68" y="123" width="175" height="6" rx="3" fill="url(#accent)"/><text x="68" y="177" fill="#52627A" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" text-anchor="start">Read scope and target publication are independent.</text><text x="78" y="241" fill="#1D4ED8" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="start">READ</text><rect x="78" y="270" width="614" height="132" rx="14" fill="url(#bl)" stroke="#2563EB" stroke-width="2"/><g transform="translate(99 300) scale(1.09375)" fill="none" stroke="#2563EB" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"><ellipse cx="32" cy="12" rx="22" ry="9"/><path d="M10 12v15c0 5 10 9 22 9s22-4 22-9V12M10 27v15c0 5 10 9 22 9s22-4 22-9V27M10 42v11c0 5 10 9 22 9s22-4 22-9V42"/></g><text x="189" y="322" fill="#19243A" font-family="Cascadia Code,Consolas,monospace" font-size="24" font-weight="700" text-anchor="start">read_mode=&quot;full&quot;</text><text x="189" y="357" fill="#52627A" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start">Complete source</text><rect x="739" y="270" width="614" height="132" rx="14" fill="url(#aq)" stroke="#7C3AED" stroke-width="2"/><g transform="translate(758 298) scale(1.09375)" fill="none" stroke="#7C3AED" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"><circle cx="32" cy="32" r="25"/><path d="M32 15v18l14 9"/></g><text x="846" y="322" fill="#19243A" font-family="Cascadia Code,Consolas,monospace" font-size="24" font-weight="700" text-anchor="start">read_mode=&quot;incremental&quot;</text><text x="846" y="357" fill="#52627A" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start">Accepted watermark</text><text x="78" y="468" fill="#1D4ED8" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="start">WRITE</text><rect x="65" y="503" width="246" height="128" rx="13" fill="url(#bl)" stroke="#DDE3F3" stroke-width="2"/><text x="81" y="552" fill="#19243A" font-family="Cascadia Code,Consolas,monospace" font-size="21" font-weight="700" text-anchor="start">overwrite</text><text x="81" y="592" fill="#52627A" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Replace target</text><rect x="337" y="503" width="246" height="128" rx="13" fill="url(#bl)" stroke="#DDE3F3" stroke-width="2"/><text x="353" y="552" fill="#19243A" font-family="Cascadia Code,Consolas,monospace" font-size="21" font-weight="700" text-anchor="start">append_all</text><text x="353" y="592" fill="#52627A" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Append all rows</text><rect x="609" y="503" width="246" height="128" rx="13" fill="url(#gr)" stroke="#7C3AED" stroke-width="2"/><text x="625" y="552" fill="#19243A" font-family="Cascadia Code,Consolas,monospace" font-size="21" font-weight="700" text-anchor="start">append_new_only</text><text x="625" y="592" fill="#52627A" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Unseen row hashes</text><rect x="881" y="503" width="246" height="128" rx="13" fill="url(#bl)" stroke="#DDE3F3" stroke-width="2"/><text x="897" y="552" fill="#19243A" font-family="Cascadia Code,Consolas,monospace" font-size="21" font-weight="700" text-anchor="start">scd1</text><text x="897" y="592" fill="#52627A" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Update current keys</text><rect x="1153" y="503" width="246" height="128" rx="13" fill="url(#bl)" stroke="#DDE3F3" stroke-width="2"/><text x="1169" y="552" fill="#19243A" font-family="Cascadia Code,Consolas,monospace" font-size="21" font-weight="700" text-anchor="start">scd2</text><text x="1169" y="592" fill="#52627A" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Preserve history</text><rect x="65" y="679" width="1310" height="72" rx="18" fill="#F0EAFF" stroke="none" stroke-width="0"/><rect x="102" y="697" width="5" height="36" rx="2" fill="#7C3AED"/><text x="132" y="725" fill="#19243A" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="600" text-anchor="start">read_mode is selected per source; write_mode is selected per target.</text></svg>