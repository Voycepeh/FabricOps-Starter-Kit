<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="Read Modes and Write Strategies"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#536377"/></marker></defs><rect width="1200" height="620" fill="#fff"/><text x="50" y="71" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="700" fill="#172235" text-anchor="start">Read Modes and Write Strategies</text><text x="50" y="107" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="500" fill="#536377" text-anchor="start">Read scope and target publication strategy are independent choices.</text><path d="M50 128 H1150" stroke="#D8E3EA" stroke-width="1.5"/><text x="50" y="178" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#1685D1" text-anchor="start">READ MODE</text><rect x="50" y="197" width="520" height="95" rx="10" fill="#EEF7FF" stroke="#1685D1" stroke-width="1.5"/><text x="70" y="237" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#172235" text-anchor="start">Full</text><text x="70" y="271" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#536377" text-anchor="start">Process complete source</text><rect x="630" y="197" width="520" height="95" rx="10" fill="#EAFBFA" stroke="#06A9B4" stroke-width="1.5"/><text x="650" y="237" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#172235" text-anchor="start">Incremental</text><text x="650" y="271" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#536377" text-anchor="start">After accepted watermark</text><text x="50" y="350" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#1685D1" text-anchor="start">WRITE MODE</text><rect x="50" y="371" width="206" height="118" rx="10" fill="#EEF7FF" stroke="#D8E3EA" stroke-width="1.5"/><text x="62" y="410" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#172235" text-anchor="start">Overwrite</text><text x="62" y="446" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="500" fill="#536377" text-anchor="start">Replace target</text><rect x="274" y="371" width="206" height="118" rx="10" fill="#EEF7FF" stroke="#D8E3EA" stroke-width="1.5"/><text x="286" y="410" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#172235" text-anchor="start">Append All</text><text x="286" y="446" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="500" fill="#536377" text-anchor="start">Append every row</text><rect x="498" y="371" width="206" height="118" rx="10" fill="#ECF9F0" stroke="#16A66A" stroke-width="1.5"/><text x="510" y="410" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#172235" text-anchor="start">Append New Only</text><text x="510" y="446" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="500" fill="#536377" text-anchor="start">Only unseen hashes</text><rect x="722" y="371" width="206" height="118" rx="10" fill="#EEF7FF" stroke="#D8E3EA" stroke-width="1.5"/><text x="734" y="410" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#172235" text-anchor="start">SCD1</text><text x="734" y="446" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="500" fill="#536377" text-anchor="start">Update by key</text><rect x="946" y="371" width="206" height="118" rx="10" fill="#EEF7FF" stroke="#D8E3EA" stroke-width="1.5"/><text x="958" y="410" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#172235" text-anchor="start">SCD2</text><text x="958" y="446" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="500" fill="#536377" text-anchor="start">Version by key</text><rect x="52" y="526" width="1096" height="62" rx="10" fill="#EAFBFA" stroke="#EAFBFA" stroke-width="1.5"/><text x="76" y="564" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="600" fill="#172235" text-anchor="start">A changed row hash is appended as new content in Append New Only, never an update.</text></svg>