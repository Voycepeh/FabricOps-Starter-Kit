nce reviews</text><rect x="742" y="203" width="215" height="184" rx="10" fill="#ECF9F0" stroke="#16A66A" stroke-width="1.5"/><text x="762" y="243" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#172235" text-anchor="start">04 Deploy</text><text x="762" y="277" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#536377" text-anchor="start">Separate notebook</text><rect x="977" y="203" width="215" height="184" rx="10" fill="#EEF7FF" stroke="#1685D1" stroke-width="1.5"/><text x="997" y="243" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#172235" text-anchor="start">05 Rebind</text><text x="997" y="277" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#536377" text-anchor="start">Engineer sets schedule</text><path d="M260 295 H272 V295" stroke="#536377" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><path d="M495 295 H507 V295" stroke="#536377" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><path d="M730 295 H742 V295" stroke="#536377" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><path d="M965 295 H977 V295" stroke="#536377" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="54" y="428" width="1092" height="74" rx="10" fill="#EEF7FF" stroke="#D8E3EA" stroke-width="1.5"/><text x="79" y="460" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#172235" text-anchor="start">Stable logical Pipeline ID</text><text x="79" y="489" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="500" fill="#536377" text-anchor="start">Promoted versions receive distinct physical Notebook IDs; approvals ≠ deployments.</text><rect x="52" y="526" width="1096" height="62" rx="10" fill="#EAFBFA" stroke="#EAFBFA" stroke-width="1.5"/><text x="76" y="564" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="600" fill="#172235" text-anchor="start">Preview only · Governed admissi