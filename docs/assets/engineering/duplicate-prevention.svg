<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="Duplicate Prevention"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#536377"/></marker></defs><rect width="1200" height="620" fill="#fff"/><text x="50" y="71" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="700" fill="#172235" text-anchor="start">Duplicate Prevention</text><text x="50" y="107" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="500" fill="#536377" text-anchor="start">Two complementary protections against repeated target publication.</text><path d="M50 128 H1150" stroke="#D8E3EA" stroke-width="1.5"/><rect x="52" y="180" width="323" height="180" rx="10" fill="#EEF7FF" stroke="#1685D1" stroke-width="1.5"/><text x="72" y="220" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#172235" text-anchor="start">Incoming prepared rows</text><text x="72" y="254" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#536377" text-anchor="start">SHA256 row content hash</text><rect x="448" y="180" width="323" height="180" rx="10" fill="#EAFBFA" stroke="#06A9B4" stroke-width="1.5"/><text x="468" y="220" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#172235" text-anchor="start">Append New Only</text><text x="468" y="254" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#536377" text-anchor="start">Deduplicate then anti-join</text><rect x="844" y="180" width="303" height="180" rx="10" fill="#ECF9F0" stroke="#16A66A" stroke-width="1.5"/><text x="864" y="220" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#172235" text-anchor="start">Target table</text><text x="864" y="254" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#536377" text-anchor="start">Insert only unseen hashes</text><path d="M376 270 H438 V270" stroke="#536377" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><path d="M772 270 H834 V270" stroke="#536377" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="81" y="298" width="267" height="32" rx="15" fill="#EAFBFA" stroke="#EAFBFA" stroke-width="1.5"/><text x="214.5" y="320" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#06A9B4" text-anchor="middle">A · B · B · C</text><rect x="465" y="298" width="287" height="32" rx="15" fill="#EAFBFA" stroke="#EAFBFA" stroke-width="1.5"/><text x="608.5" y="320" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#06A9B4" text-anchor="middle">Compare target: A · B</text><rect x="870" y="298" width="254" height="32" rx="15" fill="#ECF9F0" stroke="#ECF9F0" stroke-width="1.5"/><text x="997" y="320" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#16A66A" text-anchor="middle">Only C is new</text><rect x="52" y="403" width="1095" height="93" rx="10" fill="#EEF7FF" stroke="#D8E3EA" stroke-width="1.5"/><text x="79" y="442" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#172235" text-anchor="start">Retry protection</text><text x="79" y="477" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="500" fill="#536377" text-anchor="start">Publication receipts verify an exact committed batch before accepting checkpoints.</text><rect x="52" y="526" width="1096" height="62" rx="10" fill="#EAFBFA" stroke="#EAFBFA" stroke-width="1.5"/><text x="76" y="564" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="600" fill="#172235" text-anchor="start">Append All intentionally preserves duplicates; a changed hash is additional content.</text></svg>