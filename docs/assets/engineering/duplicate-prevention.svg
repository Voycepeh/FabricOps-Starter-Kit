<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 390" width="1120" height="390" role="img" aria-label="Duplicate prevention"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#546477"/></marker></defs><rect width="1120" height="390" fill="#fff"/><text x="28" y="48" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#192434">Duplicate prevention</text><path d="M28 66H1092" stroke="#CFDCE5" stroke-width="1.3"/><rect x="30" y="123" width="313" height="112" rx="7" fill="#F6FAFC" stroke="#CFDCE5" stroke-width="1.5"/><text x="46" y="162" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#192434">Final business rows</text><text x="46" y="195" font-family="Consolas,Menlo,monospace" font-size="15" font-weight="400" fill="#546477">add_row_hash()</text><rect x="405" y="123" width="313" height="112" rx="7" fill="#EAF7F3" stroke="#128779" stroke-width="1.5"/><text x="421" y="162" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#192434">Exclude known hashes</text><text x="421" y="195" font-family="Consolas,Menlo,monospace" font-size="15" font-weight="400" fill="#546477">filter_unpublished_rows()</text><rect x="780" y="123" width="313" height="112" rx="7" fill="#F6FAFC" stroke="#CFDCE5" stroke-width="1.5"/><text x="796" y="162" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#192434">Append unseen rows</text><text x="796" y="195" font-family="Consolas,Menlo,monospace" font-size="15" font-weight="400" fill="#546477">write_mode=/append_new_only/</text><path d="M351 181H397" stroke="#546477" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M726 181H772" stroke="#546477" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="37" y="295" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#192434">Incoming duplicates are removed; target _row_hash values are anti-joined.</text><text x="37" y="330" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#546477">Retries use publication receipts and verified commits before advancing checkpoints.</text></svg>