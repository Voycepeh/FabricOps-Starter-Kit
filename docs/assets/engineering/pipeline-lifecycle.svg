<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="FabricOps Pipeline Lifecycle"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#536377"/></marker></defs><rect width="1200" height="620" fill="#fff"/><text x="50" y="71" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="700" fill="#172235" text-anchor="start">FabricOps Pipeline Lifecycle</text><text x="50" y="107" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="500" fill="#536377" text-anchor="start">Repeatable orchestration around project-owned PySpark.</text><path d="M50 128 H1150" stroke="#D8E3EA" stroke-width="1.5"/><rect x="42" y="206" width="203" height="205" rx="10" fill="#EEF7FF" stroke="#1685D1" stroke-width="1.5"/><text x="62" y="246" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#172235" text-anchor="start">01  Setup</text><text x="62" y="280" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#536377" text-anchor="start">Context and mode</text><rect x="271" y="206" width="203" height="205" rx="10" fill="#EAFBFA" stroke="#06A9B4" stroke-width="1.5"/><text x="291" y="246" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#172235" text-anchor="start">02  Read</text><text x="291" y="280" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#536377" text-anchor="start">Configured sources</text><rect x="500" y="206" width="203" height="205" rx="10" fill="#ECF9F0" stroke="#16A66A" stroke-width="1.5"/><text x="520" y="246" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#172235" text-anchor="start">03  Transform</text><text x="520" y="280" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#536377" text-anchor="start">Your PySpark logic</text><rect x="729" y="20