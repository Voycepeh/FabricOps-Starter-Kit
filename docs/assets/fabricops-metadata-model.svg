<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1540 1420" role="img" aria-labelledby="title desc">
<title id="title">FabricOps pipeline identity, execution and activation metadata</title>
<desc id="desc">Engineering Pipeline Registry owns permanent UUIDs. Governance Activated Pipeline is a logical immutable release inside Activation State. Each registry identity has many runs and releases. Live runs require an approved release.</desc>
