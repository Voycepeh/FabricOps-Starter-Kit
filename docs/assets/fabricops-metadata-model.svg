<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">FabricOps active metadata model</title>
  <desc id="desc">Active metadata model with enrichment and guardrail rule rows as review history source of truth.</desc>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#111827}.title{font-size:42px;font-weight:700}.h{font-size:26px;font-weight:700}.b{font-size:23px}.small{font-size:21px}.box{stroke:#334155;stroke-width:3;rx:18;ry:18}.arrow{stroke:#475569;stroke-width:4;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
  <text class="title" x="60" y="75">FabricOps active metadata model</text>
  <rect class="box" x="60" y="130" width="440" height="210" fill="#DBEAFE"/><text class="h" x="85" y="170">Agreement context</text><text class="b" x="85" y="215">METADATA_DATA_STEWARD</text><text class="b" x="85" y="250">METADATA_DATA_AGREEMENT</text><text class="b" x="85" y="285">METADATA_DATA_AGREEMENT_EVIDENCE</text>
  <rect class="box" x="560" y="130" width="440" height="210" fill="#E0E7FF"/><text class="h" x="585" y="170">Notebook traceability</text><text class="b" x="585" y="215">METADATA_NOTEBOOK_REGISTRY</text>
  <rect class="box" x="1060" y="130" width="440" height="210" fill="#E0F2FE"/><text class="h" x="1085" y="170">Access context</text><text class="b" x="1085" y="215">METADATA_DATA_ACCESS</text>
  <rect class="box" x="60" y="390" width="440" height="250" fill="#DCFCE7"/><text class="h" x="85" y="430">Observed evidence + policy</text><text class="b" x="85" y="475">METADATA_DATA_CATALOGUE</text><text class="small" x="85" y="515">Observed profile evidence</text><text class="small" x="85" y="550">governance_mode / approval_policy</text><text class="small" x="85" y="585">bypass_allowed / policy_reason</text>
  <rect class="box" x="560" y="360" width="440" height="310" fill="#FEF3C7"/><text class="h" x="585" y="400">Reviewable intent</text><text class="b" x="585" y="445">METADATA_ENRICHMENT_RULES</text><text class="small" x="585" y="480">Business context, classification, sensitivity, PII</text><text class="b" x="585" y="535">METADATA_GUARDRAIL_RULES</text><text class="small" x="585" y="570">Schema, freshness, profile, DQ rules</text><text class="small" x="585" y="620">Approval history = append-only rule rows</text>
  <rect class="box" x="1060" y="390" width="440" height="250" fill="#FCE7F3"/><text class="h" x="1085" y="430">Runtime evidence</text><text class="b" x="1085" y="475">METADATA_GUARDRAIL_RESULTS</text><text class="b" x="1085" y="510">METADATA_DATA_LINEAGE_TABLE</text><text class="b" x="1085" y="545">METADATA_PIPELINE_RUNS</text>
  <line class="arrow" x1="500" y1="235" x2="555" y2="235"/><line class="arrow" x1="1000" y1="235" x2="1055" y2="235"/><line class="arrow" x1="500" y1="515" x2="555" y2="515"/><line class="arrow" x1="1000" y1="515" x2="1055" y2="515"/><line class="arrow" x1="1280" y1="340" x2="1280" y2="385"/>
  <rect class="box" x="60" y="735" width="1440" height="190" fill="#F8FAFC"/><text class="h" x="90" y="775">Key principles</text><text class="b" x="90" y="820">METADATA_ENRICHMENT_RULES stores reviewable enrichment intent for business context, classification, sensitivity, and PII.</text><text class="b" x="90" y="855">Approval history is derived from enrichment and guardrail rule row history.</text>
</svg>
