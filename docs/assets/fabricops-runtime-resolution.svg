<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Development and Production runtime resolution</title>
  <desc id="desc">00_env_config determines the active environment. Development can resolve current authored metadata or a selected Data Contract. Production resolves the active approved Data Contract only. Both produce one governed runtime definition for Guardrails and processing or load behaviour.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7a8793"/></marker><style>.title{font:600 28px Arial,sans-serif;fill:#24313d}.kicker{font:700 11px 'Courier New',monospace;letter-spacing:1.5px;fill:#0f8f83}.node{fill:#fff;stroke:#aeb9c2;stroke-width:1.5}.focal{fill:#e8f6f3;stroke:#0f8f83;stroke-width:2}.store{fill:#f6f8f9;stroke:#c7d0d7;stroke-width:1.5}.name{font:600 18px Arial,sans-serif;fill:#24313d}.sub{font:12px 'Courier New',monospace;fill:#687580}.small{font:12px Arial,sans-serif;fill:#687580}.line{fill:none;stroke:#7a8793;stroke-width:1.7;marker-end:url(#arrow)}.dash{fill:none;stroke:#9aa5ae;stroke-width:1.3;stroke-dasharray:5 4;marker-end:url(#arrow)}.zone{fill:#24313d;fill-opacity:.018;stroke:#24313d;stroke-opacity:.12;stroke-width:1}.zoneLabel{font:700 10px 'Courier New',monospace;letter-spacing:1.2px;fill:#7a8793}.note{font:italic 15px Georgia,serif;fill:#52606c}</style></defs>
  <rect width="1200" height="520" fill="#fff"/><text x="55" y="52" class="kicker">ENVIRONMENT RESOLUTION</text><text x="55" y="86" class="title">Development stays flexible; Production stays frozen</text><text x="55" y="113" class="note">The environment changes where the governed runtime definition is allowed to come from.</text>
  <rect x="55" y="188" width="180" height="92" rx="7" class="node"/><text x="145" y="222" text-anchor="middle" class="name">00_env_config</text><text x="145" y="247" text-anchor="middle" class="sub">Development / Production</text>
  <rect x="310" y="145" width="330" height="255" rx="8" class="zone"/><rect x="332" y="139" width="100" height="20" fill="#fff"/><text x="342" y="153" class="zoneLabel">DEVELOPMENT</text><rect x="347" y="188" width="256" height="76" rx="7" class="node"/><text x="475" y="219" text-anchor="middle" class="name">Current authoring</text><text x="475" y="242" text-anchor="middle" class="sub">Guardrails + processing definition</text><rect x="347" y="298" width="256" height="76" rx="7" class="store"/><text x="475" y="329" text-anchor="middle" class="name">Selected Data Contract</text><text x="475" y="352" text-anchor="middle" class="sub">optional contract testing</text>
  <rect x="710" y="145" width="330" height="255" rx="8" class="zone"/><rect x="732" y="139" width="94" height="20" fill="#fff"/><text x="742" y="153" class="zoneLabel">PRODUCTION</text><rect x="747" y="225" width="256" height="100" rx="7" class="focal"/><text x="875" y="258" text-anchor="middle" class="name">Active Data Contract</text><text x="875" y="284" text-anchor="middle" class="sub">approved + versioned + frozen</text><text x="875" y="306" text-anchor="middle" class="small">Only allowed Production source</text>
  <path d="M235 234 H278 Q290 234 290 222 V222 Q290 210 310 210" class="line"/><path d="M235 246 H278 Q290 246 290 318 V318 Q290 330 310 330" class="dash"/><path d="M235 258 H675 Q687 258 687 275 V275 Q687 287 710 287" class="line"/>
  <path d="M603 226 H660 Q672 226 672 420 V420 Q672 432 684 432 H724" class="dash"/><path d="M603 336 H648 Q660 336 660 408 V408 Q660 420 672 420 H724" class="dash"/><path d="M875 325 V408 Q875 420 863 420 H844" class="line"/>
  <rect x="724" y="392" width="248" height="90" rx="7" class="focal"/><text x="848" y="424" text-anchor="middle" class="name">Resolved runtime definition</text><text x="848" y="449" text-anchor="middle" class="sub">Guardrails + processing/load strategy</text><text x="848" y="469" text-anchor="middle" class="sub">one object reused through the run</text>
</svg>