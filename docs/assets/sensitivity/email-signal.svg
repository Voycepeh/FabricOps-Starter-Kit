<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 288" width="720" height="288" role="img" aria-labelledby="title desc">
  <title id="title">An email pattern raises handling</title>
  <desc id="desc">Three example.org email addresses match the email pattern. Suggested handling is Confidential pending review of their business use.</desc>
  <rect x="1" y="1" width="718" height="286" rx="20" fill="#F6F8FF" stroke="#DDE3F3"/>
  <path d="M300 144h84m-12-10 12 10-12 10" fill="none" stroke="#52627A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="24" y="36" width="280" height="216" rx="12" fill="#FFFFFF" stroke="#DDE3F3" stroke-width="2"/>
  <rect x="396" y="36" width="300" height="216" rx="12" fill="#FFFFFF" stroke="#B45309" stroke-width="2"/>
  <path d="M24 96h280m-280 48h280m-280 48h280m92-40h300" stroke="#DDE3F3" stroke-width="2"/>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#19243A">
    <text x="44" y="76" font-size="24" font-weight="600">Email</text>
    <g font-family="Cascadia Code, Consolas, monospace">
      <text x="44" y="128" font-size="20">alex.tan@example.org</text>
      <text x="44" y="176" font-size="20">mira.lee@example.org</text>
      <text x="44" y="224" font-size="20">sam.ong@example.org</text>
    </g>
    <text x="420" y="76" font-size="22" fill="#52627A">Suggested handling</text>
    <text x="420" y="126" font-size="34" font-weight="700" fill="#B45309">Confidential</text>
    <text x="420" y="190" font-size="22" fill="#52627A">Review</text>
    <text x="420" y="228" font-size="24" font-weight="600">Check business use</text>
  </g>
</svg>
