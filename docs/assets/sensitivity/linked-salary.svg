<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 288" width="720" height="288" role="img" aria-labelledby="title desc">
  <title id="title">Linked Restricted columns make a Confidential dataset</title>
  <desc id="desc">Three staff numbers are paired with salary bands. Each column is Restricted. Confirmed linkage makes the dataset Confidential.</desc>
  <rect x="1" y="1" width="718" height="286" rx="20" fill="#F6F8FF" stroke="#DDE3F3"/>
  <path d="M304 144h80m-12-10 12 10-12 10" fill="none" stroke="#52627A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="24" y="36" width="280" height="216" rx="12" fill="#FFFFFF" stroke="#DDE3F3" stroke-width="2"/>
  <rect x="396" y="36" width="300" height="216" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <path d="M24 96h280m-280 48h280m-280 48h280m-144-96v156m236-100h300" stroke="#DDE3F3" stroke-width="2"/>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#19243A">
    <text x="44" y="76" font-size="21" font-weight="600">Staff no.</text>
    <text x="168" y="76" font-size="20" font-weight="600">Salary band</text>
    <g font-family="Cascadia Code, Consolas, monospace">
      <text x="44" y="128" font-size="20">ST-1042</text>
      <text x="168" y="128" font-size="18">3,500–4,499</text>
      <text x="44" y="176" font-size="20">ST-1087</text>
      <text x="168" y="176" font-size="18">4,500–5,499</text>
      <text x="44" y="224" font-size="20">ST-1163</text>
      <text x="168" y="224" font-size="18">5,500–6,499</text>
    </g>
    <text x="420" y="76" font-size="22" fill="#52627A">Suggested handling</text>
    <text x="420" y="126" font-size="34" font-weight="700" fill="#6D28D9">Confidential</text>
    <text x="420" y="209" font-size="24" font-weight="600">Confirmed linkage</text>
  </g>
</svg>
