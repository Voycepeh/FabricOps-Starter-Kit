<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 302" role="img" aria-label="Business requirements become reviewable Data Quality rules and deterministic checks"><title>Business requirements become reviewable Data Quality rules and deterministic checks</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="1000" height="302" rx="18" fill="#fff"/><rect x="22" y="54" width="204" height="96" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="22" y="54" width="5" height="96" rx="2.5" fill="#64748b"/><text x="40" y="92" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#0f172a">Requirement</text><text x="40" y="119" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#475569">Natural language</text><path d="M232 103 H252" stroke="#64748b" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/><rect x="258" y="54" width="204" height="96" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="258" y="54" width="5" height="96" rx="2.5" fill="#64748b"/><text x="276" y="92" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#0f172a">Rule proposal</text><text x="276" y="119" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#475569">Manual or optional AI</text><path d="M468 103 H488" stroke="#64748b" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/><rect x="494" y="54" width="204" height="96" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="494" y="54" width="5" height="96" rx="2.5" fill="#7c3aed"/><text x="512" y="92" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#0f172a">Human approval</text><text x="512" y="119" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#475569">Validate rule grammar</text><path d="M704 103 H724" stroke="#64748b" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/><rect x="730" y="54" width="248" height="96" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="730" y="54" width="5" height="96" rx="2.5" fill="#2563eb"/><text x="748" y="92" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#0f172a">Pipeline checks</text><text x="748" y="119" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#475569">Deterministic check_dq()</text><rect x="22" y="209" width="956" height="63" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="42" y="238" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#334155">Approved rules are evaluated on real data. AI is not used during execution.</text><text x="42" y="259" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#475569">Guardrail results record outcome and continuation decision.</text></svg>