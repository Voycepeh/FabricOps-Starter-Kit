<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="790" viewBox="0 0 1440 790" role="img" aria-label="Business rule authoring and Data Quality enforcement"><title>Business rule authoring and Data Quality enforcement</title><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#19243A"/></marker></defs><rect width="1440" height="790" fill="#fff"/><text x="68" y="94" fill="#19243A" font-family="Segoe UI,Arial,sans-serif" font-size="48" font-weight="700" text-anchor="start">Business rules to Data Quality</text><rect x="68" y="123" width="175" height="6" rx="3" fill="#7C3AED"/><text x="68" y="177" fill="#52627A" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" text-anchor="start">Turn a requirement into an approved rule, then evaluate real data.</text><rect x="88" y="247" width="366" height="332" rx="20" fill="#fff" stroke="#7C3AED" stroke-width="2.3"/><rect x="89" y="248" width="364" height="116" rx="19" fill="#F2ECFF"/><path d="M108 365H434" stroke="#DDE3F3"/><g transform="translate(239 275)" fill="none" stroke="#7C3AED" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5h28l12 12v40H12Z M40 5v12h12 M20 29h24 M20 39h24 M20 49h15"/></g><text x="271" y="421" fill="#19243A" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="700" text-anchor="middle">Describe</text><text x="271" y="462" fill="#52627A" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">Business requirement</text><rect x="537" y="247" width="366" height="332" rx="20" fill="#fff" stroke="#7C3AED" stroke-width="2.3"/><rect x="538" y="248" width="364" height="116" rx="19" fill="#F2ECFF"/><path d="M557 365H883" stroke="#DDE3F3"/><g transform="translate(688 275)" fill="none" stroke="#7C3AED" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="18" r="12"/><path d="M8 57c0-17 10-25 24-25s24 8 24 25"/></g><text x="720" y="421" fill="#19243A" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="700" text-anchor="middle">Approve</text><text x="720" y="462" fill="#52627A" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">Review supported rule</text><rect x="986" y="247" width="366" height="332" rx="20" fill="#fff" stroke="#2563EB" stroke-width="2.3"/><rect x="987" y="248" width="364" height="116" rx="19" fill="#E8F0FF"/><path d="M1006 365H1332" stroke="#DDE3F3"/><g transform="translate(1137 275)" fill="none" stroke="#2563EB" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="26"/><path d="m18 32 10 10 19-22"/></g><text x="1169" y="421" fill="#19243A" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="700" text-anchor="middle">Evaluate</text><text x="1169" y="462" fill="#52627A" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">Deterministic DQ check</text><path d="M457 413H531" stroke="#19243A" stroke-width="2.7" fill="none" marker-end="url(#ar)"/><path d="M906 413H980" stroke="#19243A" stroke-width="2.7" fill="none" marker-end="url(#ar)"/><rect x="88" y="590" width="1264" height="42" rx="10" fill="#F8FAFC"/><text x="720" y="619" fill="#52627A" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">Optional AI can propose a rule. Governance validates its grammar before use.</text><rect x="65" y="654" width="1310" height="88" rx="18" fill="#F2ECFF"/><rect x="102" y="672" width="5" height="52" rx="2" fill="#7C3AED"/><text x="132" y="690" fill="#19243A" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" text-anchor="start">Execution does not invoke AI.</text><text x="132" y="718" fill="#52627A" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Guardrail results record the outcome and continuation decision.</text></svg>