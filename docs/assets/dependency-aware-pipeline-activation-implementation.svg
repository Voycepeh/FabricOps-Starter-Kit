<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 784" role="img" aria-labelledby="dependency-aware-pipeline-activation-implementation-title dependency-aware-pipeline-activation-implementation-desc" id="dependency-aware-pipeline-activation-implementation-root">
<title id="dependency-aware-pipeline-activation-implementation-title">Inside coordinated pipeline activation</title>
<desc id="dependency-aware-pipeline-activation-implementation-desc">Setup, Read, Transform, Write and explicit finalization produce complete Testing records, which are checked against shared-table dependencies, Governance approves the release, one Delta snapshot publishes consistent mappings, and Live runs pin the approved revision while blockers preserve the current activation.</desc>
<defs>
      <style>#dependency-aware-pipeline-activation-implementation-root .diagram-title { font:600 28px Arial,sans-serif;fill:#101828 }
      #dependency-aware-pipeline-activation-implementation-root .tag { font:600 11px Arial,sans-serif;fill:#667085;letter-spacing:.5px }
      #dependency-aware-pipeline-activation-implementation-root .name { font:600 14px Arial,sans-serif;fill:#101828 }
      #dependency-aware-pipeline-activation-implementation-root .body { font:13px Arial,sans-serif;fill:#344054 }
      #dependency-aware-pipeline-activation-implementation-root .mono { font:12px Consolas,monospace;fill:#344054 }
      #dependency-aware-pipeline-activation-implementation-root .node { fill:#fff;stroke:#d0d5dd;stroke-width:1.4 }
      #dependency-aware-pipeline-activation-implementation-root .state { fill:#f9fafb;stroke:#98a2b3;stroke-width:1.4 }
      #dependency-aware-pipeline-activation-implementation-root .focal { fill:#effaf8;stroke:#0f8f83;stroke-width:1.8 }
      #dependency-aware-pipeline-activation-implementation-root .human { fill:#fff;stroke:#475467;stroke-width:1.6;stroke-dasharray:5 4 }
      #dependency-aware-pipeline-activation-implementation-root .edge { fill:none;stroke:#667085;stroke-width:1.6;marker-end:url(#dependency-aware-pipeline-activation-implementation-arrow) }
      #dependency-aware-pipeline-activation-implementation-root .publish { fill:none;stroke:#0f8f83;stroke-width:1.8;marker-end:url(#dependency-aware-pipeline-activation-implementation-arrow-teal) }
      #dependency-aware-pipeline-activation-implementation-root .blocked { fill:none;stroke:#98a2b3;stroke-width:1.4;stroke-dasharray:5 4;marker-end:url(#dependency-aware-pipeline-activation-implementation-arrow) }</style>
<marker id="dependency-aware-pipeline-activation-implementation-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#667085"/></marker>
<marker id="dependency-aware-pipeline-activation-implementation-arrow-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#0f8f83"/></marker>
</defs>

<rect width="1120" height="784" fill="#fff"/>
<text x="48" y="48" class="diagram-title">Inside coordinated pipeline activation</text>
<text x="48" y="76" class="body">Complete Testing → one approved release → pinned Live runs. Select a node to open its implementation.</text>
<!-- Execution and metadata connectors precede their endpoint nodes. -->
<path d="M332 204 H380" class="edge"/>
<path d="M688 204 H736" class="edge"/>
<path d="M904 280 V344" class="edge"/>
<path d="M736 406 H688" class="publish"/>
<path d="M380 406 H332" class="publish"/>
<path d="M190 468 V532" class="edge"/>
<path d="M1072 204 H1088 Q1096 204 1096 212 V592 Q1096 600 1088 600 H1072" class="blocked"/>

<a href="https://github.com/Voycepeh/FabricOps-Starter-Kit/blob/main/src/fabricops_kit/pipeline/setup_pipeline.py#L130" target="_blank" rel="noopener"><g>
<rect x="48" y="128" width="284" height="152" rx="6" class="node"/>
<text x="68" y="152" class="tag">1 · ENGINEERING / TESTING</text>
<text x="68" y="180" class="name">Run the whole pipeline</text>
<text x="68" y="204" class="mono">setup_pipeline()</text>
<text x="68" y="230" class="body">Read → Transform → Write</text>
<text x="68" y="256" class="mono">finalize_pipeline()</text>
</g></a>
<a href="https://github.com/Voycepeh/FabricOps-Starter-Kit/blob/main/src/fabricops_kit/pipeline/shared.py#L5740" target="_blank" rel="noopener"><g>
<rect x="380" y="128" width="308" height="152" rx="6" class="state"/>
<text x="400" y="152" class="tag">2 · CENTRAL RECORDS</text>
<text x="400" y="180" class="name">Complete Testing evidence</text>
<text x="400" y="208" class="mono">METADATA_PIPELINE_RUN</text>
<text x="400" y="230" class="mono">METADATA_GUARDRAIL_RESULTS</text>
<text x="400" y="254" class="body">Exact contracts, operations and results</text>
<text x="400" y="272" class="body">Finalized outcome + environment</text>
</g></a>
<a href="https://github.com/Voycepeh/FabricOps-Starter-Kit/blob/main/src/fabricops_kit/widgets/widget_activate_pipeline.py#L65" target="_blank" rel="noopener"><g>
<rect x="736" y="128" width="336" height="152" rx="6" class="node"/>
<text x="756" y="152" class="tag">3 · FABRICOPS / REVIEW</text>
<text x="756" y="180" class="name">Discover affected dependencies</text>
<text x="756" y="204" class="mono">widget_activate_pipeline()</text>
<text x="756" y="226" class="mono">review_pipeline_release()</text>
<text x="756" y="248" class="body">Compare contracts, writers and destinations</text>
<text x="756" y="270" class="body">Require compatible affected-pipeline tests</text>
</g></a>
<a href="https://github.com/Voycepeh/FabricOps-Starter-Kit/blob/main/src/fabricops_kit/activated_pipeline/shared.py#L362" target="_blank" rel="noopener"><g>
<rect x="736" y="344" width="336" height="124" rx="6" class="human"/>
<text x="756" y="368" class="tag">4 · HUMAN / GOVERNANCE</text>
<text x="756" y="396" class="name">Approve the complete release</text>
<text x="756" y="420" class="mono">approve_pipeline_release()</text>
<text x="756" y="448" class="body">Backend revalidates; stale review blocks.</text>
</g></a>
<a href="https://github.com/Voycepeh/FabricOps-Starter-Kit/blob/main/src/fabricops_kit/activated_pipeline/shared.py#L223" target="_blank" rel="noopener"><g>
<rect x="380" y="344" width="308" height="124" rx="6" class="focal"/>
<text x="400" y="368" class="tag">5 · FABRICOPS / COMMIT</text>
<text x="400" y="396" class="name">Publish atomically</text>
<text x="400" y="420" class="mono">commit_activation_state()</text>
<text x="400" y="448" class="body">One serializable Delta transaction</text>
</g></a>
<a href="https://github.com/Voycepeh/FabricOps-Starter-Kit/blob/main/src/fabricops_kit/activated_pipeline/shared.py#L209" target="_blank" rel="noopener"><g>
<rect x="48" y="344" width="284" height="124" rx="6" class="focal"/>
<text x="68" y="368" class="tag">CENTRAL AUTHORITY</text>
<text x="68" y="392" class="name">One authority snapshot</text>
<text x="68" y="416" class="mono">METADATA_ACTIVATION_STATE</text>
<text x="68" y="440" class="body">Pipeline + table mappings together</text>
<text x="68" y="460" class="body">Environment revision + reservations</text>
</g></a>
<a href="https://github.com/Voycepeh/FabricOps-Starter-Kit/blob/main/src/fabricops_kit/activated_pipeline/shared.py#L450" target="_blank" rel="noopener"><g>
<rect x="48" y="532" width="640" height="156" rx="6" class="node"/>
<text x="68" y="556" class="tag">6 · FABRICOPS / LIVE</text>
<text x="68" y="584" class="name">Resolve approval and pin one revision</text>
<text x="68" y="608" class="mono">setup_pipeline(execution_mode=&quot;live&quot;)</text>
<text x="68" y="630" class="mono">build_live_pipeline_plan() / verify_live_plan()</text>
<text x="68" y="652" class="mono">finalize_pipeline() → release execution reservation</text>
<text x="68" y="676" class="body">Affected running executions must drain before cutover.</text>
</g></a>
<a href="https://github.com/Voycepeh/FabricOps-Starter-Kit/blob/main/src/fabricops_kit/activated_pipeline/shared.py#L277" target="_blank" rel="noopener"><g>
<rect x="736" y="532" width="336" height="136" rx="6" class="state"/>
<text x="756" y="556" class="tag">BLOCKED · NO SNAPSHOT CHANGE</text>
<text x="756" y="584" class="name">Keep the current activation</text>
<text x="756" y="608" class="body">Missing tests or conflicting contracts</text>
<text x="756" y="630" class="body">Competing writers / unsafe destinations</text>
<text x="756" y="652" class="body">Reserved destinations / active runs</text>
</g></a>
<path d="M48 704 H1072" fill="none" stroke="#e4e7ec"/>
<rect x="48" y="724" width="24" height="16" rx="2" class="human"/>
<text x="84" y="737" class="body">Human decision</text>
<path d="M268 732 H308" class="edge"/>
<text x="324" y="737" class="body">Execution / metadata flow</text>
<path d="M556 732 H596" class="blocked"/>
<text x="612" y="737" class="body">Blocked release</text>
<text x="48" y="768" class="body">FabricOps governs Data Contracts. Engineering owns code integrity, CI/CD and notebook deployment.</text>
</svg>
