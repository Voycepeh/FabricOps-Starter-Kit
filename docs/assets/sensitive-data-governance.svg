<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 302" role="img" aria-label="Sensitive data governance: optional AI suggestion, human approval, deterministic write treatment"><title>Sensitive data governance: optional AI suggestion, human approval, deterministic write treatment</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="1000" height="302" rx="18" fill="#fff"/><rect x="22" y="55" width="204" height="96" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="22" y="55" width="5" height="96" rx="2.5" fill="#64748b"/><text x="40" y="93" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#0f172a">Column evidence</text><text x="40" y="120" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#475569">Schema + bounded profile</text><path d="M232 104 H252" stroke="#64748b" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/><rect x="258" y="55" width="204" height="96" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="258" y="55" width="5" height="96" rx="2.5" fill="#64748b"/><text x="276" y="93" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#0f172a">Optional AI</text><text x="276" y="120" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#475569">Classification proposal</text><path d="M468 104 H488" stroke="#64748b" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/><rect x="494" y="55" width="204" height="96" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="494" y="55" width="5" height="96" rx="2.5" fill="#7c3aed"/><text x="512" y="93" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#0f172a">Human review</text><text x="512" y="120" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#475569">PII + treatment decision</text><path d="M704 104 H724" stroke="#64748b" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/><rect x="730" y="55" width="248" height="96" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="730" y="55" width="5" height="96" rx="2.5" fill="#2563eb"/><text x="748" y="93" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#0f172a">Write enforcement</text><text x="748" y="120" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#475569">Mask · Bucket · Tokenize · Remove</text><rect x="22" y="210" width="956" height="62" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="42" y="239" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#334155">Approved rule stored in the frozen contract. Runtime treatment does not invoke AI.</text><text x="42" y="260" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#b91c1c">Treatment failures block publication.</text></svg>