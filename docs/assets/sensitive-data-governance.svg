<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="790" viewBox="0 0 1440 790" role="img" aria-label="Sensitive data authoring and runtime treatment"><title>Sensitive data authoring and runtime treatment</title><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#19243A"/></marker></defs><rect width="1440" height="790" fill="#fff"/><text x="68" y="94" fill="#19243A" font-family="Segoe UI,Arial,sans-serif" font-size="48" font-weight="700" text-anchor="start">Sensitive Data treatment</text><rect x="68" y="123" width="175" height="6" rx="3" fill="#7C3AED"/><text x="68" y="177" fill="#52627A" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" text-anchor="start">Human-approved classification controls deterministic write-time treatment.</text><rect x="88" y="247" width="366" height="332" rx="20" fill="#fff" stroke="#7C3AED" stroke-width="2.3"/><rect x="89" y="248" width="364" height="116" rx="19" fill="#F2ECFF"/><path d="M108 365H434" stroke="#DDE3F3"/><g transform="translate(239 275)" fill="none" stroke="#7C3AED" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="32" cy="13" rx="23" ry="9"/><path d="M9 13v17c0 12 46 12 46 0V13 M9 30v17c0 12 46 12 46 0V30"/></g><text x="271" y="421" fill="#19243A" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="700" text-anchor="middle">Observe</text><text x="271" y="462" fill="#52627A" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">Schema + bounded profile</text><rect x="537" y="247" width="366" height="332" rx="20" fill="#fff" stroke="#7C3AED" stroke-width="2.3"/><rect x="538" y="248" width="364" height="116" rx="19" fill="#F2ECFF"/><path d="M557 365H883" stroke="#DDE3F3"/><g transform="translate(688 275)" fill="none" stroke="#7C3AED" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="18" r="12"/><path d="M8 57c0-17 10-25 24-25s24 8 24 25"/></g><text x="720" y="421" fill="#19243A" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="700" text-anchor="middle">Review</text><text x="720" y="462" fill="#52627A" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">PII + treatment decision</text><rect x="986" y="247" width="366" height="332" rx="20" fill="#fff" stroke="#2563EB" stroke-width="2.3"/><rect x="987" y="248" width="364" height="116" rx="19" fill="#E8F0FF"/><path d="M1006 365H1332" stroke="#DDE3F3"/><g transform="translate(1137 275)" fill="none" stroke="#2563EB" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M32 5 56 14v18c0 15-11 24-24 28C19 56 8 47 8 32V14Z M21 32l8 8 16-19"/></g><text x="1169" y="421" fill="#19243A" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="700" text-anchor="middle">Enforce</text><text x="1169" y="462" fill="#52627A" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">Write-time treatment</text><path d="M457 413H531" stroke="#19243A" stroke-width="2.7" fill="none" marker-end="url(#ar)"/><path d="M906 413H980" stroke="#19243A" stroke-width="2.7" fill="none" marker-end="url(#ar)"/><rect x="88" y="590" width="1264" height="42" rx="10" fill="#F8FAFC"/><text x="720" y="619" fill="#52627A" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">Optional AI may propose classification. A person approves Mask, Bucket, Tokenize or Remove.</text><rect x="65" y="654" width="1310" height="88" rx="18" fill="#F2ECFF"/><rect x="102" y="672" width="5" height="52" rx="2" fill="#7C3AED"/><text x="132" y="690" fill="#19243A" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" text-anchor="start">Approved rules live in the frozen Data Contract.</text><text x="132" y="718" fill="#52627A" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Treatment runs without AI; failures block publication.</text></svg>