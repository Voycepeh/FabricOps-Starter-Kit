<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
<title id="title">Development to Production FabricOps pipeline promotion</title>
<desc id="desc">Two mirrored Development and Production panels show 00 Env Config resolving environment-specific Fabric Store locations and the same 02 Pipeline containing Data Contract context, Full and Incremental reads, a centered project-owned PySpark transformation below the reads, and Overwrite, Append, SCD1, and SCD2 writes below the transformation. A promotion connector links the Development and Production pipeline containers directly.</desc>
<defs>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
    <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#101828" flood-opacity=".08"/>
  </filter>
  <marker id="arrow-muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#98a2b3"/>
  </marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#0f8f83"/>
  </marker>
  <linearGradient id="devHead" x1="0" x2="1">
    <stop offset="0" stop-color="#ecfdf8"/>
    <stop offset="1" stop-color="#f8fffd"/>
  </linearGradient>
  <linearGradient id="prodHead" x1="0" x2="1">
    <stop offset="0" stop-color="#eff8ff"/>
    <stop offset="1" stop-color="#f8fbff"/>
  </linearGradient>
</defs>
<rect width="1440" height="860" fill="#ffffff"/>
<style>
.title{font:700 26px Arial,sans-serif;fill:#101828}
.subtitle{font:13px Arial,sans-serif;fill:#667085}
.paneltitle{font:700 20px Arial,sans-serif;fill:#101828}
.ey{font:700 11px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#667085;letter-spacing:.85px}
.h{font:700 14px Arial,sans-serif;fill:#101828}
.b{font:12px Arial,sans-serif;fill:#475467}
.small{font:11px Arial,sans-serif;fill:#667085}
.m{font:12px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#344054}
.outer{fill:#ffffff;stroke:#d0d5dd;stroke-width:1.5}
.pipeline{fill:#fcfcfd;stroke:#d0d5dd;stroke-width:1.3}
.soft{fill:#f9fafb;stroke:#d0d5dd;stroke-width:1.2}
.read{fill:#f8fafc;stroke:#98a2b3;stroke-width:1.2}
.focus{fill:#effaf8;stroke:#0f8f83;stroke-width:2}
.write{fill:#ffffff;stroke:#98a2b3;stroke-width:1.2}
.line{fill:none;stroke:#98a2b3;stroke-width:1.5;marker-end:url(#arrow-muted)}
.accent{fill:none;stroke:#0f8f83;stroke-width:2.2;marker-end:url(#arrow-accent)}
.divider{stroke:#eaecf0;stroke-width:1}
</style>

<text x="56" y="48" class="title">Same pipeline definition, promoted from Development to Production</text>
<text x="56" y="72" class="subtitle">Environment configuration changes. The governed pipeline shape and project-owned transformation stay the same.</text>

<!-- DEVELOPMENT -->
<g filter="url(#shadow)">
  <rect x="48" y="130" width="606" height="676" rx="14" class="outer"/>
  <path d="M48 144a14 14 0 0 1 14-14h578a14 14 0 0 1 14 14v78H48z" fill="url(#devHead)"/>
</g>
<text x="76" y="166" class="paneltitle">Development</text>
<text x="76" y="188" class="subtitle">Clonable notebook stack</text>
<rect x="76" y="240" width="550" height="72" rx="8" class="soft"/>
<text x="98" y="265" class="ey">00 ENV CONFIG</text>
<text x="98" y="289" class="h">Resolve Development Fabric Store locations</text>

<rect x="76" y="336" width="550" height="394" rx="10" class="pipeline"/>
<text x="98" y="363" class="ey">02 PIPELINE</text>
<line x1="98" y1="376" x2="604" y2="376" class="divider"/>

<rect x="98" y="394" width="180" height="62" rx="8" class="soft"/>
<text x="114" y="419" class="h">Data Contract context</text>
<text x="114" y="440" class="small">Select governed contract</text>

<rect x="98" y="486" width="150" height="72" rx="8" class="read"/>
<text x="114" y="511" class="h">Read Table 1</text>
<text x="114" y="534" class="b">Full</text>

<rect x="312" y="486" width="150" height="72" rx="8" class="read"/>
<text x="328" y="511" class="h">Read Table 2</text>
<text x="328" y="534" class="b">Incremental</text>

<rect x="180" y="592" width="340" height="90" rx="9" class="focus"/>
<text x="200" y="617" class="ey" style="fill:#0f8f83">PROJECT OWNED</text>
<text x="200" y="644" class="h">PySpark transformation</text>
<text x="200" y="666" class="small">Visible project logic between governed boundaries</text>

<path class="line" d="M173 558 V575 H350 V592"/>
<path class="line" d="M387 558 V575 H350 V592"/>

<rect x="98" y="742" width="112" height="60" rx="8" class="write"/>
<text x="114" y="766" class="h">Write 1</text>
<text x="114" y="788" class="b">Overwrite</text>

<rect x="220" y="742" width="112" height="60" rx="8" class="write"/>
<text x="236" y="766" class="h">Write 2</text>
<text x="236" y="788" class="b">Append</text>

<rect x="342" y="742" width="112" height="60" rx="8" class="write"/>
<text x="358" y="766" class="h">Write 3</text>
<text x="358" y="788" class="b">SCD1</text>

<rect x="464" y="742" width="112" height="60" rx="8" class="write"/>
<text x="480" y="766" class="h">Write 4</text>
<text x="480" y="788" class="b">SCD2</text>

<path class="line" d="M500 564 V582 H154 V604"/>
<path class="line" d="M500 564 V582 H276 V604"/>
<path class="line" d="M500 564 V582 H398 V604"/>
<path class="line" d="M500 564 V582 H520 V604"/>

<path class="line" d="M351 312 V336"/>

<!-- PRODUCTION -->
<g filter="url(#shadow)">
  <rect x="786" y="130" width="606" height="634" rx="14" class="outer"/>
  <path d="M786 144a14 14 0 0 1 14-14h578a14 14 0 0 1 14 14v78H786z" fill="url(#prodHead)"/>
</g>
<text x="814" y="166" class="paneltitle">Production</text>
<text x="814" y="188" class="subtitle">Same notebook stack</text>
<rect x="814" y="240" width="550" height="72" rx="8" class="soft"/>
<text x="836" y="265" class="ey">00 ENV CONFIG</text>
<text x="836" y="289" class="h">Resolve Production Fabric Store locations</text>

<rect x="814" y="336" width="550" height="352" rx="10" class="pipeline"/>
<text x="836" y="363" class="ey">02 PIPELINE</text>
<line x1="836" y1="376" x2="1342" y2="376" class="divider"/>

<rect x="836" y="394" width="180" height="62" rx="8" class="soft"/>
<text x="852" y="419" class="h">Data Contract context</text>
<text x="852" y="440" class="small">Resolve active contract</text>

<rect x="836" y="486" width="150" height="72" rx="8" class="read"/>
<text x="852" y="511" class="h">Read Table 1</text>
<text x="852" y="534" class="b">Full</text>

<rect x="1050" y="486" width="150" height="72" rx="8" class="read"/>
<text x="1066" y="511" class="h">Read Table 2</text>
<text x="1066" y="534" class="b">Incremental</text>

<rect x="918" y="592" width="340" height="90" rx="9" class="focus"/>
<text x="938" y="617" class="ey" style="fill:#0f8f83">PROJECT OWNED</text>
<text x="938" y="644" class="h">PySpark transformation</text>
<text x="938" y="666" class="small">Same promoted logic</text>

<path class="line" d="M911 558 V575 H1088 V592"/>
<path class="line" d="M1125 558 V575 H1088 V592"/>

<rect x="836" y="742" width="112" height="60" rx="8" class="write"/>
<text x="852" y="766" class="h">Write 1</text>
<text x="852" y="788" class="b">Overwrite</text>

<rect x="958" y="742" width="112" height="60" rx="8" class="write"/>
<text x="974" y="766" class="h">Write 2</text>
<text x="974" y="788" class="b">Append</text>

<rect x="1080" y="742" width="112" height="60" rx="8" class="write"/>
<text x="1096" y="766" class="h">Write 3</text>
<text x="1096" y="788" class="b">SCD1</text>

<rect x="1202" y="742" width="112" height="60" rx="8" class="write"/>
<text x="1218" y="766" class="h">Write 4</text>
<text x="1218" y="788" class="b">SCD2</text>

<path class="line" d="M1238 564 V582 H892 V604"/>
<path class="line" d="M1238 564 V582 H1014 V604"/>
<path class="line" d="M1238 564 V582 H1136 V604"/>
<path class="line" d="M1238 564 V582 H1258 V604"/>

<path class="line" d="M1089 312 V336"/>

<!-- connected promotion arrow, anchored to the 02 Pipeline containers -->
<path class="accent" d="M626 533 H674"/>
<rect x="674" y="508" width="92" height="32" rx="16" fill="#ffffff" stroke="#b7e3d8"/>
<text x="720" y="529" text-anchor="middle" class="ey" style="fill:#0f8f83">PROMOTE 1:1</text>
<path class="accent" d="M766 533 H814"/>

<text x="720" y="842" text-anchor="middle" class="subtitle">00 Env Config changes by environment. 02 Pipeline is promoted unchanged.</text>
</svg>