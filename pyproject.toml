[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fabricops-kit"
version = "0.1.0"
description = "A practical starter kit for building governed, quality-checked Microsoft Fabric notebook workflows."
requires-python = ">=3.11"
dependencies = [
  "PyYAML~=6.0",
  "jsonschema~=4.0",
  "pandas~=2.0",
]

[project.optional-dependencies]
dq-review = [
  "ipywidgets~=8.0",
]
dev = [
  "pytest~=8.0",
  "ruff~=0.11",
  "nbformat~=5.0",
  "pytest-cov~=7.0",
  "build~=1.3",
  "twine~=6.2",
]
lineage = [
  "matplotlib~=3.8",
  "networkx~=3.0",
]
fabric-ai = [
  "openai~=1.0",
  "pydantic~=2.0",
]
docs = [
  "mkdocs==1.6.1",
  "mkdocstrings[python]==0.30.0",
  "mkdocs-material==9.6.14",
  "mkdocs-gen-files==0.5.0",
  "mkdocs-literate-nav==0.6.1",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fabricops_kit = ["schemas/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
markers = [
  "unit: fast tests that do not require Spark or Fabric runtime behaviour",
  "integration: small mocked integration tests for storage, metadata, and platform boundaries",
  "spark: tests that require a local Spark session",
  "fabric: tests that simulate Microsoft Fabric runtime behaviour",
  "contract: package, schema, documentation, and public API consistency tests",
]

[tool.ruff]
line-length = 120
extend-exclude = ["templates/notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "D", "DOC"]
ignore = ["E402", "E501", "E701", "E702", "E712", "F401", "F821", "I001"]

[dependency-groups]
dev = [
    "build>=1.3.0",
    "pyspark>=4.1.1",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "twine>=6.2.0",
]


[tool.coverage.run]
source = ["fabricops_kit"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
