{% set breadcrumbs = fabricops_breadcrumbs | default([]) %}
{% if breadcrumbs %}
  <nav class="fabricops-breadcrumbs" aria-label="Breadcrumb">
    <ol>
      {% for crumb in breadcrumbs %}
        <li>
          {% if not loop.last and crumb.url %}
            <a href="{{ crumb.url | url }}">{{ crumb.title }}</a>
          {% else %}
            <span{% if loop.last %} aria-current="page"{% endif %}>{{ crumb.title }}</span>
          {% endif %}
        </li>
      {% endfor %}
    </ol>
  </nav>
{% endif %}
