name: Regenerate PR 1219 references

on:
  push:
    branches:
      - codex/refactor-to-generalize-sql-access-scanning

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: codex/refactor-to-generalize-sql-access-scanning
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install locked dependencies
        run: uv sync --frozen --extra docs --extra dev

      - name: Generate affected references
        id: generate
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH=src
          uv run python scripts/generate_public_function_call_flows_json.py
          uv run python scripts/generate_individual_function_reference_pages.py

          if git diff --quiet -- \
              docs/reference/_data/public-function-call-flows.json \
              docs/api/reference \
              docs/reference/index.md \
              docs/reference/function-call-graph.md; then
            git restore docs/reference/_data/generated-artifacts.json
            echo "substantive_changes=false" >> "$GITHUB_OUTPUT"
            echo "No substantive generated artifact changes required."
            exit 0
          fi

          git add docs/reference/_data/public-function-call-flows.json \
                  docs/reference/_data/generated-artifacts.json \
                  docs/api/reference \
                  docs/reference/index.md \
                  docs/reference/function-call-graph.md
          echo "substantive_changes=true" >> "$GITHUB_OUTPUT"
          git diff --cached --stat

      - name: Confirm individual reference generator is idempotent
        if: steps.generate.outputs.substantive_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH=src
          uv run python scripts/generate_individual_function_reference_pages.py
          git restore --worktree docs/reference/_data/generated-artifacts.json
          git diff --exit-code -- \
              docs/api/reference \
              docs/reference/index.md \
              docs/reference/function-call-graph.md

      - name: Commit generated artifacts
        if: steps.generate.outputs.substantive_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: regenerate access scanner references"
          git push origin HEAD:codex/refactor-to-generalize-sql-access-scanning
