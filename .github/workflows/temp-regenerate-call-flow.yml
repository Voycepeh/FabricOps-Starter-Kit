name: Temporary call-flow regeneration

on:
  push:
    branches:
      - fix/regenerate-call-flow-ci

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install locked dependencies
        run: uv sync --frozen --extra docs --extra dev
      - name: Regenerate call-flow artifact twice
        run: |
          PYTHONPATH=src uv run python scripts/generate_public_function_call_flows_json.py
          sha256sum docs/reference/_data/public-function-call-flows.json docs/reference/_data/generated-artifacts.json > /tmp/first.sha
          PYTHONPATH=src uv run python scripts/generate_public_function_call_flows_json.py
          sha256sum docs/reference/_data/public-function-call-flows.json docs/reference/_data/generated-artifacts.json > /tmp/second.sha
          diff -u /tmp/first.sha /tmp/second.sha
      - name: Commit generated artifacts and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/reference/_data/public-function-call-flows.json docs/reference/_data/generated-artifacts.json
          git commit -m "Regenerate public call-flow artifacts"
          git rm .github/workflows/temp-regenerate-call-flow.yml
          git commit -m "Remove temporary generation workflow"
          git push origin HEAD
