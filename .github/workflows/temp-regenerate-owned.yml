name: Temp regenerate owned artifacts

on:
  push:
    branches:
      - fix/full-read-pipeline-template

permissions:
  contents: write

jobs:
  regenerate:
    if: github.event.head_commit.message != 'Regenerate owned artifacts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install locked dependencies
        run: uv sync --frozen --extra docs --extra dev
      - name: Run generators twice
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH=src
          uv run python scripts/generate_public_function_call_flows_json.py
          uv run python scripts/generate_individual_function_reference_pages.py
          cp docs/reference/_data/public-function-call-flows.json /tmp/call-flow-first.json
          cp docs/reference/_data/generated-artifacts.json /tmp/generated-artifacts-first.json
          cp docs/reference/index.md /tmp/reference-index-first.md
          cp docs/reference/function-call-graph.md /tmp/function-call-graph-first.md
          cp -R docs/api/reference /tmp/reference-pages-first
          export FABRICOPS_PRESERVE_GENERATED_ARTIFACT_TIMESTAMPS=1
          uv run python scripts/generate_public_function_call_flows_json.py
          uv run python scripts/generate_individual_function_reference_pages.py
          diff -u /tmp/call-flow-first.json docs/reference/_data/public-function-call-flows.json
          diff -u /tmp/generated-artifacts-first.json docs/reference/_data/generated-artifacts.json
          diff -u /tmp/reference-index-first.md docs/reference/index.md
          diff -u /tmp/function-call-graph-first.md docs/reference/function-call-graph.md
          diff -ru /tmp/reference-pages-first docs/api/reference
      - name: Commit generated outputs
        shell: bash
        run: |
          set -euo pipefail
          git add docs/reference/_data/public-function-call-flows.json \
                  docs/reference/_data/generated-artifacts.json \
                  docs/reference/index.md \
                  docs/reference/function-call-graph.md \
                  docs/api/reference
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Regenerate owned artifacts'
          git push origin HEAD:fix/full-read-pipeline-template
