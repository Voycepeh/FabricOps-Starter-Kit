name: FabricOps CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-finish-stage4a:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/normalize-guardrail-metadata-model' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DISABLE_MKDOCS_2_WARNING: "true"
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: agent/normalize-guardrail-metadata-model
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install locked dependencies
        run: uv sync --frozen --extra docs --extra dev

      - name: Apply Stage 4A completion edits
        run: |
          uv run python scripts/_stage4a_finish.py
          uv run python scripts/_stage4a_fix2.py

      - name: Regenerate directly owned artifacts twice
        shell: bash
        run: |
          set -euo pipefail
          source .venv/bin/activate
          PYTHONPATH=src python scripts/generate_public_function_call_flows_json.py
          PYTHONPATH=src python scripts/generate_individual_function_reference_pages.py
          cp docs/reference/_data/generated-artifacts.json /tmp/generated-artifacts-first.json
          git diff -- . ':(exclude)docs/reference/_data/generated-artifacts.json' > /tmp/first.diff
          PYTHONPATH=src python scripts/generate_individual_function_reference_pages.py
          git diff -- . ':(exclude)docs/reference/_data/generated-artifacts.json' > /tmp/second.diff
          diff -u /tmp/first.diff /tmp/second.diff
          cp /tmp/generated-artifacts-first.json docs/reference/_data/generated-artifacts.json

      - name: Validate completed Stage 4A
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check .
          uv run pytest tests/unit/test_guardrail_metadata_contract.py tests/unit/test_metadata_reference_generator.py
          uv run pytest
          source .venv/bin/activate
          python scripts/validate_generated_artifact_ownership.py
          uv run mkdocs build --strict
          git diff --check

      - name: Commit completed Stage 4A
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm scripts/_stage4a_finish.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Complete Stage 4A metadata contract"
          git push origin HEAD:agent/normalize-guardrail-metadata-model

  validate:
    runs-on: ubuntu-latest
    env:
      DISABLE_MKDOCS_2_WARNING: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install locked dependencies
        run: uv sync --frozen --extra docs --extra dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Normalize guided-demo links
        run: uv run python scripts/normalize_guided_demo_links.py

      - name: Run full test suite
        run: uv run pytest

      - name: Validate release navigation
        run: uv run python scripts/release_navigation.py --check

      - name: Validate owned generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          source .venv/bin/activate
          python scripts/validate_generated_artifact_ownership.py

      - name: Build strict documentation
        env:
          FABRICOPS_GIT_SHA: ${{ github.sha }}
        run: uv run mkdocs build --strict

      - name: Build distributions
        run: uv build

      - name: Check distributions
        run: uvx twine check dist/*

      - name: Install wheel and smoke-test public imports
        shell: bash
        run: |
          set -euo pipefail
          wheel_path="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "${wheel_path}"
          python -m venv "${RUNNER_TEMP}/fabricops-wheel-smoke"
          source "${RUNNER_TEMP}/fabricops-wheel-smoke/bin/activate"
          python -m pip install --upgrade pip
          python -m pip install "pyspark>=4.1.1" "${wheel_path}"
          python - <<'PY'
          from importlib.metadata import version
          import fabricops_kit as kit

          assert kit.__version__ == version("fabricops-kit")
          for public_name in kit.__all__:
              getattr(kit, public_name)
          print(f"Imported fabricops_kit {kit.__version__} with {len(kit.__all__)} public names")
          PY

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload validated GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy-docs:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated documentation to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
