name: FabricOps CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DISABLE_MKDOCS_2_WARNING: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install locked dependencies
        run: uv sync --frozen --extra docs --extra dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Run full test suite
        run: uv run pytest

      # Callable architecture validation is temporarily disabled while the contract
      # moves from function-call-graph.json to public-function-call-flows.json.
      # Restore this as a dedicated public-function-call-flows.json validator.

      - name: Regenerate generated reference artifacts
        env:
          FABRICOPS_PRESERVE_GENERATED_ARTIFACT_TIMESTAMPS: "1"
        shell: bash
        run: |
          set -euo pipefail
          source .venv/bin/activate
          PYTHONPATH=src python scripts/generate_public_function_call_flows_json.py
          PYTHONPATH=src python scripts/generate_individual_function_reference_pages.py
          PYTHONPATH=src python scripts/generate_public_function_call_flows_dashboard.py

          # Freshness timestamps are informational and must not make deterministic
          # generated-artifact validation fail. Restore the committed metadata and
          # its displayed timestamps while leaving all substantive generated output
          # available for the stale-artifact diff below.
          git show HEAD:docs/reference/_data/generated-artifacts.json > /tmp/generated-artifacts.json
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          committed_path = Path('/tmp/generated-artifacts.json')
          committed = json.loads(committed_path.read_text(encoding='utf-8'))
          artifacts = committed.get('artifacts', {})
          reference_timestamp = artifacts.get('individual_function_reference_pages', {}).get(
              'generated_at_sgt', 'Generated timestamp unavailable'
          )
          call_flow_timestamp = artifacts.get('public_function_call_flows_json', {}).get(
              'generated_at_sgt', 'Generated timestamp unavailable'
          )

          reference_pattern = re.compile(r'^(\s*Reference pages generated: ).*$', re.MULTILINE)
          call_flow_pattern = re.compile(r'^(\s*Call-flow data generated: ).*$', re.MULTILINE)
          for page in Path('docs/api/reference').glob('*.md'):
              text = page.read_text(encoding='utf-8')
              text = reference_pattern.sub(rf'\g<1>{reference_timestamp}', text)
              text = call_flow_pattern.sub(rf'\g<1>{call_flow_timestamp}', text)
              page.write_text(text, encoding='utf-8')

          Path('docs/reference/_data/generated-artifacts.json').write_text(
              committed_path.read_text(encoding='utf-8'),
              encoding='utf-8',
          )
          PY

          git diff --exit-code \
            docs/reference/_data/public-function-call-flows.json \
            docs/reference/_data/generated-artifacts.json \
            docs/reference/index.md \
            docs/reference/function-call-graph.md \
            docs/assets/public-function-call-flows-dashboard.html \
            docs/api/reference

      - name: Build strict documentation
        env:
          FABRICOPS_GIT_SHA: ${{ github.sha }}
        run: uv run mkdocs build --strict

      - name: Build distributions
        run: uv build

      - name: Check distributions
        run: uvx twine check dist/*

      - name: Install wheel and smoke-test public imports
        shell: bash
        run: |
          set -euo pipefail
          wheel_path="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "${wheel_path}"
          python -m venv "${RUNNER_TEMP}/fabricops-wheel-smoke"
          source "${RUNNER_TEMP}/fabricops-wheel-smoke/bin/activate"
          python -m pip install --upgrade pip
          python -m pip install "pyspark>=4.1.1" "${wheel_path}"
          python - <<'PY'
          from importlib.metadata import version
          import fabricops_kit as kit

          assert kit.__version__ == version("fabricops-kit")
          for public_name in kit.__all__:
              getattr(kit, public_name)
          print(f"Imported fabricops_kit {kit.__version__} with {len(kit.__all__)} public names")
          PY
