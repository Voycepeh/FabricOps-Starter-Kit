name: FabricOps CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  DISABLE_MKDOCS_2_WARNING: "true"

# Replace obsolete PR runs; never interrupt validation/deployment on main.
concurrency:
  group: fabricops-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: tests (${{ matrix.suite }}, ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: integration
            shard: 0
            shards: 1
          - suite: contract
            shard: 0
            shards: 1
          - suite: unit
            shard: 0
            shards: 3
          - suite: unit
            shard: 1
            shards: 3
          - suite: unit
            shard: 2
            shards: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install locked dependencies
        run: uv sync --frozen --extra docs --extra dev

      - name: Normalize guided-demo links
        run: uv run python scripts/normalize_guided_demo_links.py

      # Separate runners isolate Spark sessions and generated-file mutations.
      # File-level sharding also keeps module-scoped fixtures together.
      - name: Run test shard and report slowest tests
        env:
          TEST_SUITE: ${{ matrix.suite }}
          TEST_SHARD: ${{ matrix.shard }}
          TEST_SHARDS: ${{ matrix.shards }}
        run: |
          uv run python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys

          suite = os.environ["TEST_SUITE"]
          shard = int(os.environ["TEST_SHARD"])
          shards = int(os.environ["TEST_SHARDS"])
          directories = ["tests/contract", "tests/templates"] if suite == "contract" else [f"tests/{suite}"]
          def test_files(directory):
              return {str(path) for path in Path(directory).rglob("*.py")
                      if path.name.startswith("test_") or path.name.endswith("_test.py")}

          assigned = set().union(*(test_files(f"tests/{group}") for group in ("unit", "integration", "contract", "templates")))
          unassigned = test_files("tests") - assigned
          if unassigned:
              raise SystemExit(f"Test files missing from CI partitions: {sorted(unassigned)}")
          files = sorted(set().union(*(test_files(directory) for directory in directories)))
          selected = files[shard::shards]
          if not selected:
              raise SystemExit("Empty test shard: check the CI partition")
          print(f"Running {suite} shard {shard + 1}/{shards}: {len(selected)} test files", flush=True)
          raise SystemExit(subprocess.call([sys.executable, "-m", "pytest", "--durations=20", *selected]))
          PY

  publication-regressions:
    name: persisted Delta publication regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install isolated Fabric-compatible Delta test runtime
        run: |
          uv venv .venv-delta --python 3.11
          uv pip install --python .venv-delta/bin/python -e '.[dev]' -r tests/integration/requirements-delta.txt
          mkdir -p /tmp/fabricops-delta-jars
          curl --fail --retry 3 -L https://repo.maven.apache.org/maven2/io/delta/delta-spark_2.12/3.3.2/delta-spark_2.12-3.3.2.jar -o /tmp/fabricops-delta-jars/delta-spark.jar
          curl --fail --retry 3 -L https://repo.maven.apache.org/maven2/io/delta/delta-storage/3.3.2/delta-storage-3.3.2.jar -o /tmp/fabricops-delta-jars/delta-storage.jar
      - name: Verify persisted business rows, history and checkpoint recovery
        env:
          SPARK_LOCAL_IP: "127.0.0.1"
          PYSPARK_PYTHON: "${{ github.workspace }}/.venv-delta/bin/python"
          PYSPARK_SUBMIT_ARGS: "--jars /tmp/fabricops-delta-jars/delta-spark.jar,/tmp/fabricops-delta-jars/delta-storage.jar --conf spark.databricks.delta.snapshotPartitions=2 --conf spark.sql.extensions=io.delta.sql.DeltaSparkSessionExtension --conf spark.sql.catalog.spark_catalog=org.apache.spark.sql.delta.catalog.DeltaCatalog pyspark-shell"
        run: |
          .venv-delta/bin/python -m pytest -q tests/integration/test_publication_batches.py --junitxml=/tmp/publication-regressions.xml
          .venv-delta/bin/python - <<'PY'
          import xml.etree.ElementTree as ET
          suites = ET.parse("/tmp/publication-regressions.xml").getroot().findall("testsuite")
          assert sum(int(suite.attrib["tests"]) for suite in suites) > 0
          assert sum(int(suite.attrib["skipped"]) for suite in suites) == 0, "Persisted Delta regressions must run, not skip"
          PY

  build:
    name: lint, docs and package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install locked dependencies
        run: uv sync --frozen --extra docs --extra dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Normalize guided-demo links
        run: uv run python scripts/normalize_guided_demo_links.py

      - name: Validate release navigation
        run: uv run python scripts/release_navigation.py --check

      - name: Validate owned generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          source .venv/bin/activate
          python scripts/validate_generated_artifact_ownership.py

      - name: Build strict documentation
        env:
          FABRICOPS_GIT_SHA: ${{ github.sha }}
        run: uv run mkdocs build --strict

      - name: Upload PR documentation preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: mkdocs-pr-preview
          path: site/
          if-no-files-found: error
          retention-days: 7

      - name: Build distributions
        run: uv build

      - name: Check distributions
        run: uvx twine check dist/*

      - name: Install wheel and smoke-test public imports
        shell: bash
        run: |
          set -euo pipefail
          wheel_path="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "${wheel_path}"
          uv venv "${RUNNER_TEMP}/fabricops-wheel-smoke"
          uv pip install --python "${RUNNER_TEMP}/fabricops-wheel-smoke/bin/python" "pyspark>=4.1.1" "${wheel_path}"
          source "${RUNNER_TEMP}/fabricops-wheel-smoke/bin/activate"
          python - <<'PY'
          from importlib.metadata import version
          import fabricops_kit as kit

          assert kit.__version__ == version("fabricops-kit")
          for public_name in kit.__all__:
              getattr(kit, public_name)
          print(f"Imported fabricops_kit {kit.__version__} with {len(kit.__all__)} public names")
          PY

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload validated GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  # Keep the existing required check name and fail it if any parallel job fails.
  validate:
    if: always()
    needs: [tests, build]
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation job to pass
        env:
          TEST_RESULT: ${{ needs.tests.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          test "$TEST_RESULT" = success
          test "$BUILD_RESULT" = success

  deploy-docs:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated documentation to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
