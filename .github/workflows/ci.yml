name: FabricOps CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install locked dependencies
        run: uv sync --frozen --extra docs --extra dev

      - name: Regenerate owned artifacts twice and commit
        shell: bash
        run: |
          set -euo pipefail
          source .venv/bin/activate
          export PYTHONPATH=src

          python scripts/generate_public_function_call_flows_json.py
          callflow_hash_1="$(sha256sum docs/reference/_data/public-function-call-flows.json | cut -d' ' -f1)"
          python scripts/generate_public_function_call_flows_json.py
          callflow_hash_2="$(sha256sum docs/reference/_data/public-function-call-flows.json | cut -d' ' -f1)"
          test "$callflow_hash_1" = "$callflow_hash_2"

          python scripts/generate_individual_function_reference_pages.py
          find docs/api/reference -type f -name '*.md' -print0 | sort -z | xargs -0 sha256sum > /tmp/refs-run1.sha
          sha256sum docs/reference/index.md docs/reference/function-call-graph.md >> /tmp/refs-run1.sha

          python scripts/generate_individual_function_reference_pages.py
          find docs/api/reference -type f -name '*.md' -print0 | sort -z | xargs -0 sha256sum > /tmp/refs-run2.sha
          sha256sum docs/reference/index.md docs/reference/function-call-graph.md >> /tmp/refs-run2.sha
          diff -u /tmp/refs-run1.sha /tmp/refs-run2.sha

          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             .github/workflows/ci.yml             docs/reference/_data/public-function-call-flows.json             docs/reference/_data/generated-artifacts.json             docs/api/reference             docs/reference/index.md             docs/reference/function-call-graph.md

          git diff --cached --stat
          git diff --cached --quiet && exit 0
          git commit -m "Regenerate stale generated artifacts"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
