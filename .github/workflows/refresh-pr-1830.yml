name: Refresh PR 1830 generated artifacts
on:
  push:
    branches:
      - fix/demo-reset-no-notebook-jobs-20261112
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install project dependencies
        run: uv sync --frozen --extra docs --extra dev
      - name: Generate owned artifacts with repository generators
        shell: bash
        run: |
          source .venv/bin/activate
          export PYTHONPATH=src
          export FABRICOPS_PRESERVE_GENERATED_ARTIFACT_TIMESTAMPS=1
          python scripts/generate_public_function_call_flows_json.py
          python scripts/generate_individual_function_reference_pages.py
          python scripts/generate_public_api_compatibility.py --main-ref "$(python - <<'PY'
          import json
          p = json.load(open("docs/reference/_data/public-api-compatibility.json"))
          print(next(s["revision"] for s in p["snapshots"] if s["version"] == "main"))
          PY
          )"
          python - <<'PY'
          from scripts.validate_generated_artifact_ownership import restore_generated_metadata_and_page_timestamps
          restore_generated_metadata_and_page_timestamps(update_reference_pages=True)
          PY
      - name: Commit artifacts and remove this one-off workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refresh-pr-1830.yml
          git add docs/reference/_data/public-function-call-flows.json docs/reference/_data/public-api-compatibility.json docs/api/reference docs/reference/index.md
          git diff --cached --stat
          git commit -m "docs: refresh generated API artifacts after demo reset refactor"
          git push origin HEAD:fix/demo-reset-no-notebook-jobs-20261112
