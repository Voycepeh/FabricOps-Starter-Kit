name: Regenerate profile PR artifacts (temporary)
on:
  push:
    branches:
      - fix/native-profile-display-status
    paths:
      - src/fabricops_kit/pipeline/shared.py
      - tests/unit/test_profile_presentation.py
      - .github/workflows/pr-profile-artifacts.yml
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/native-profile-display-status
          fetch-depth: 0
          persist-credentials: true
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: uv sync --frozen --extra docs --extra dev
      - name: Regenerate artifacts from branch source
        shell: bash
        run: |
          set -euo pipefail
          source .venv/bin/activate
          export PYTHONPATH=src
          export FABRICOPS_PRESERVE_GENERATED_ARTIFACT_TIMESTAMPS=1
          python scripts/generate_public_function_call_flows_json.py
          python scripts/generate_individual_function_reference_pages.py
          python scripts/generate_public_api_compatibility.py --main-ref "$(python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('docs/reference/_data/public-api-compatibility.json').read_text())
          print(next(x['revision'] for x in j['snapshots'] if x['version']=='main'))
          PY
          )"
          python - <<'PY'
          from scripts.validate_generated_artifact_ownership import restore_generated_metadata_and_page_timestamps
          restore_generated_metadata_and_page_timestamps(update_reference_pages=True)
          PY
      - name: Commit regenerated reference artifacts to PR
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/reference/_data/public-function-call-flows.json docs/reference/_data/public-api-compatibility.json docs/api/reference docs/reference/index.md docs/reference/function-call-graph.md
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate owned profile API reference artifacts"
            git push origin HEAD:fix/native-profile-display-status
          fi
