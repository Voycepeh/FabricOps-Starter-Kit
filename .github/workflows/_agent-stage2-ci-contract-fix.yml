name: Stage 2 CI contract fix

on:
  push:
    branches:
      - agent/stage2-metadata-operational-family

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: agent/stage2-metadata-operational-family
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Apply Stage 2 CI contract fix
        run: python .github/_agent_stage2_fix.py
      - name: Install locked dependencies
        run: uv sync --frozen --extra docs --extra dev
      - name: Validate
        run: |
          uv run ruff check .
          uv run pytest
      - name: Regenerate references
        run: |
          PYTHONPATH=src uv run python scripts/generate_individual_function_reference_pages.py
          git add src tests scripts docs/api/reference docs/reference/index.md docs/reference/function-call-graph.md docs/reference/_data/generated-artifacts.json
          PYTHONPATH=src uv run python scripts/generate_individual_function_reference_pages.py
          git diff --exit-code -- docs/api/reference docs/reference/index.md docs/reference/function-call-graph.md
      - name: Commit and clean up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests scripts docs/api/reference docs/reference/index.md docs/reference/function-call-graph.md docs/reference/_data/generated-artifacts.json
          git commit -m "Fix Stage 2 stale CI contracts"
          git rm .github/_agent_stage2_fix.py .github/workflows/_agent-stage2-ci-contract-fix.yml
          git commit -m "Remove temporary Stage 2 CI fix files"
          git push origin HEAD:agent/stage2-metadata-operational-family
