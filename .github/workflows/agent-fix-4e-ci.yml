name: One-time Stage 4E CI cleanup

on:
  push:
    branches:
      - agent/metadata-contract-cleanup

permissions:
  contents: write

jobs:
  fix-ci:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: agent/metadata-contract-cleanup
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install locked dependencies
        run: uv sync --frozen --extra docs --extra dev

      - name: Apply Stage 4E CI cleanup and targeted validation
        run: uv run python scripts/_agent_fix_4e_ci.py

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No CI fixes to commit"
            exit 0
          fi
          git commit -m "Align tests with Stage 4E metadata contract"
          git push origin HEAD:agent/metadata-contract-cleanup
