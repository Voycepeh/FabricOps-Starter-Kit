name: One-time Stage 4E cleanup

on:
  push:
    branches:
      - agent/metadata-contract-cleanup

permissions:
  contents: write

jobs:
  apply-cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: agent/metadata-contract-cleanup
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install locked dependencies
        run: uv sync --frozen --extra docs --extra dev

      - name: Apply Stage 4E cleanup and regenerate owned artifacts
        run: uv run python scripts/_agent_apply_4e_cleanup.py

      - name: Commit generated cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No cleanup changes to commit"
            exit 0
          fi
          git commit -m "Complete Stage 4E Guardrail cleanup"
          git push origin HEAD:agent/metadata-contract-cleanup
