name: Agent Fix Generator Verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/consolidate-guardrail-shared
          fetch-depth: 1
      - name: Patch temporary consolidation workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/agent-generate.yml')
          text = path.read_text()
          text = text.replace(
              "if not k.startswith('generated_at')",
              "if 'generated_at' not in k",
          )
          marker = '          git config user.name "github-actions[bot]"\n'
          replacement = (
              '          git rm .github/workflows/agent-generate.yml\n'
              + marker
          )
          if 'git rm .github/workflows/agent-generate.yml' not in text:
              text = text.replace(marker, replacement)
          path.write_text(text)
          PY
          git rm .github/workflows/agent-fix-generator.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/agent-generate.yml
          git commit -m "Fix Guardrail generator idempotence check"
          git push origin HEAD:agent/consolidate-guardrail-shared
