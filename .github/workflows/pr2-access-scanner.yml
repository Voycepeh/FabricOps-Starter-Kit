name: PR2 access scanner validation

on:
  push:
    branches:
      - feat/sql-access-inventory-scanner
    paths:
      - .github/workflows/pr2-access-scanner.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sql-access-inventory-scanner
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.11

      - name: Install locked dependencies
        run: uv sync --frozen --all-groups

      - name: Generate public call flows first pass
        run: PYTHONPATH=src uv run python scripts/generate_public_function_call_flows_json.py

      - name: Run focused tests
        run: |
          PYTHONPATH=src uv run pytest -q tests/unit/test_scan_warehouse_access.py
          PYTHONPATH=src uv run pytest -q tests/unit/test_metadata_reference_generator.py
          PYTHONPATH=src uv run pytest -q tests/unit/test_release_inventory.py

      - name: Discard unrelated release fixture drift
        run: git restore docs/releases

      - name: Generate function references first pass
        run: PYTHONPATH=src uv run python scripts/generate_individual_function_reference_pages.py

      - name: Commit first pass outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/api/reference docs/reference docs/reference/_data mkdocs.yml
          git status --short
          git commit -m "docs: generate access scanner references"

      - name: Generate function references second pass
        env:
          FABRICOPS_PRESERVE_GENERATED_ARTIFACT_TIMESTAMPS: "1"
        run: PYTHONPATH=src uv run python scripts/generate_individual_function_reference_pages.py

      - name: Confirm function reference second pass is clean
        run: git diff --exit-code

      - name: Generate public call flows second pass
        env:
          FABRICOPS_PRESERVE_GENERATED_ARTIFACT_TIMESTAMPS: "1"
        run: PYTHONPATH=src uv run python scripts/generate_public_function_call_flows_json.py

      - name: Confirm call flow second pass is clean
        run: git diff --exit-code

      - name: Push generated commit
        run: git push origin HEAD:feat/sql-access-inventory-scanner
