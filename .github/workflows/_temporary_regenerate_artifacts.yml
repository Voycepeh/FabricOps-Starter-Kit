name: Temporary regenerate affected artifacts

on:
  push:
    branches:
      - fix/data-contract-render-ci
    paths:
      - .github/workflows/_temporary_regenerate_artifacts.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/data-contract-render-ci
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: pip install -e . packaging
      - name: Generate public call flows
        run: PYTHONPATH=.:src python scripts/generate_public_function_call_flows_json.py
      - name: Generate function references twice
        run: |
          PYTHONPATH=.:src python scripts/generate_individual_function_reference_pages.py
          git diff -- docs/api/reference docs/reference/index.md docs/reference/function-call-graph.md > /tmp/first-reference.diff
          PYTHONPATH=.:src python scripts/generate_individual_function_reference_pages.py
          git diff -- docs/api/reference docs/reference/index.md docs/reference/function-call-graph.md > /tmp/second-reference.diff
          diff -u /tmp/first-reference.diff /tmp/second-reference.diff
      - name: Remove temporary workflow and commit generated diff
        run: |
          rm .github/workflows/_temporary_regenerate_artifacts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/reference/_data/public-function-call-flows.json docs/reference/_data/generated-artifacts.json docs/api/reference docs/reference/index.md docs/reference/function-call-graph.md .github/workflows/_temporary_regenerate_artifacts.yml
          if git diff --cached --quiet; then
            echo "No generated artifact changes."
            exit 0
          fi
          git commit -m "docs: regenerate affected reference artifacts"
          git push origin HEAD:fix/data-contract-render-ci
