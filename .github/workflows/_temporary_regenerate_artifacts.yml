name: Temporary regenerate affected artifacts

on:
  push:
    branches: [fix/data-contract-render-ci]
    paths: [.github/workflows/_temporary_regenerate_artifacts.yml]

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/data-contract-render-ci
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e . packaging
      - name: Generate affected artifacts
        run: |
          PYTHONPATH=.:src python scripts/generate_public_function_call_flows_json.py
          PYTHONPATH=.:src python scripts/generate_individual_function_reference_pages.py
          git diff -- docs/api/reference docs/reference/index.md docs/reference/function-call-graph.md > /tmp/first.diff
          PYTHONPATH=.:src python scripts/generate_individual_function_reference_pages.py
          git diff -- docs/api/reference docs/reference/index.md docs/reference/function-call-graph.md > /tmp/second.diff
          diff -u /tmp/first.diff /tmp/second.diff
      - name: Commit generated diff
        run: |
          rm .github/workflows/_temporary_regenerate_artifacts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/reference/_data/public-function-call-flows.json docs/reference/_data/generated-artifacts.json docs/api/reference docs/reference/index.md docs/reference/function-call-graph.md .github/workflows/_temporary_regenerate_artifacts.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: regenerate affected reference artifacts"
          git push origin HEAD:fix/data-contract-render-ci
