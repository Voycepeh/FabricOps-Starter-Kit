name: Agent Stage 4B 4C Finalize

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - agent/improve-standalone-guardrail-dq-authoring
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: agent/improve-standalone-guardrail-dq-authoring
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install locked dependencies
        run: |
          uv sync --frozen --extra docs --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Apply focused source, lint, metadata, and notebook updates
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("src/fabricops_kit/widgets/widget_author_guardrails.py"): {
                  '"""Author Schema, Freshness, and Change expectations for a profiled table.':
                  '"""Configure Schema, Freshness, and Change expectations for a profiled table.',
              },
              Path("src/fabricops_kit/widgets/widget_author_dq_rules.py"): {
                  '"""Author Data Quality rules for relevant columns of a profiled table.':
                  '"""Configure Data Quality rules for relevant columns of a profiled table.',
              },
              Path("scripts/reference_docs_metadata.py"): {
                  "'module_summary': 'Owns versioned Schema, Freshness, and Changes guardrail authoring.',":
                  "'module_summary': 'Owns standalone Schema, Freshness, and Changes Guardrail authoring.',",
                  "'module_summary': 'Owns DQ rule authoring widget workflow.',":
                  "'module_summary': 'Owns standalone Data Quality rule authoring for profiled tables.',",
                  "'summary_override': 'Render versioned table-level Schema, Freshness, and Changes guardrail controls.',":
                  "'summary_override': 'Author Schema, Freshness, and Changes expectations for a profiled table.',",
                  "'expanded_purpose': 'Renders one lightweight form for versioned table-level Schema, Freshness, and Changes guardrail intent.',":
                  "'expanded_purpose': 'Authors Schema, Freshness, and Changes expectations for a profiled table using the normalized Guardrail metadata model.',",
                  "'when_to_use': 'Use in 01_governance after selecting a table to append a new guardrail configuration version.',":
                  "'when_to_use': 'Use in 01_governance to select a profiled table and author its Schema, Freshness, and Changes expectations.',",
                  "'summary_override': 'Render interactive manual DQ guardrail authoring controls.',":
                  "'summary_override': 'Author Data Quality rules for relevant columns of a profiled table.',",
                  "'expanded_purpose': 'Renders standalone structured DQ authoring controls with integrated profiled-target selection.',":
                  "'expanded_purpose': 'Authors Data Quality rules from canonical rule definitions after independently resolving a profiled table and its columns.',",
                  "'when_to_use': 'Use in 01_governance to select a profiled table and submit structured DQ rule intent.',":
                  "'when_to_use': 'Use in 01_governance to select a profiled table, choose a Data Quality rule, configure its parameters, and apply it to the relevant columns.',",
              },
              Path("templates/notebooks/01_governance.ipynb"): {
                  'Create or update schema, freshness, profile-behaviour, and data-quality guardrail rules.':
                  'Create or update Schema, Freshness, Changes, and Data Quality guardrail rules.',
                  '    "    source_notebook_type=\\"01_governance\\",\\n",\n    "    created_by_role=\\"governance\\",\\n",\n':
                  '',
              },
          }

          for path, mapping in replacements.items():
              text = path.read_text(encoding="utf-8")
              for old, new in mapping.items():
                  if old not in text:
                      raise SystemExit(f"Expected text not found in {path}: {old}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")

          helper_names = {
              "stable_json": "_stable_json",
              "latest_rule": "_latest_rule",
              "rule_parameters": "_rule_parameters",
              "column_id_for_name": "_column_id_for_name",
              "build_guardrail_rule_id": "_build_guardrail_rule_id",
              "next_configuration_version": "_next_configuration_version",
              "build_rule_record": "_build_rule_record",
              "dq_records_from_selection": "_dq_records_from_selection",
              "canonicalize_and_write": "_canonicalize_records",
              "load_guardrail_authoring_targets": "_load_guardrail_authoring_targets",
          }
          helper_paths = (
              Path("src/fabricops_kit/widgets/guardrail_authoring_shared.py"),
              Path("src/fabricops_kit/widgets/widget_author_guardrails.py"),
              Path("src/fabricops_kit/widgets/widget_author_dq_rules.py"),
              Path("tests/unit/test_widget_author_guardrails.py"),
              Path("tests/unit/test_widget_author_dq_rules.py"),
          )
          for path in helper_paths:
              text = path.read_text(encoding="utf-8")
              for old, new in helper_names.items():
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")

          helper_path = Path("src/fabricops_kit/widgets/guardrail_authoring_shared.py")
          helper_text = helper_path.read_text(encoding="utf-8")
          old_block = '''def _canonicalize_records(
    records: list[dict[str, Any]],
    *,
    config: Any,
    env: str,
    spark_session: Any,
) -> list[dict[str, Any]]:
    """Normalize and append authored Guardrail rows through the canonical writer path."""
    canonical = [canonical_guardrail_rule_record(record, config=config, env=env) for record in records]
    shared._write_rule_records(canonical, config=config, env=env, spark_session=spark_session)
    return canonical
'''
          new_block = '''def _canonicalize_records(
    records: list[dict[str, Any]],
    *,
    config: Any,
    env: str,
) -> list[dict[str, Any]]:
    """Normalize authored Guardrail rows before the widget-owned shared write call."""
    return [canonical_guardrail_rule_record(record, config=config, env=env) for record in records]
'''
          if old_block not in helper_text:
              raise SystemExit("Expected canonical authoring helper block not found")
          helper_path.write_text(helper_text.replace(old_block, new_block, 1), encoding="utf-8")

          for path in (
              Path("src/fabricops_kit/widgets/widget_author_guardrails.py"),
              Path("src/fabricops_kit/widgets/widget_author_dq_rules.py"),
          ):
              text = path.read_text(encoding="utf-8")
              old = '''        canonical_records = authoring._canonicalize_records(
            records,
            config=config,
            env=env,
            spark_session=spark_session,
        )
'''
              new = '''        canonical_records = authoring._canonicalize_records(
            records,
            config=config,
            env=env,
        )
        shared._write_rule_records(
            canonical_records,
            config=config,
            env=env,
            spark_session=spark_session,
        )
'''
              if old not in text:
                  raise SystemExit(f"Expected canonical save block not found in {path}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          guardrail_test = Path("tests/unit/test_widget_author_guardrails.py")
          text = guardrail_test.read_text(encoding="utf-8")
          old = '''    monkeypatch.setattr(
        authoring,
        "_canonicalize_records",
        lambda records, **kwargs: saved.append([dict(row) for row in records]) or [dict(row) for row in records],
    )
'''
          new = '''    monkeypatch.setattr(
        authoring,
        "_canonicalize_records",
        lambda records, **kwargs: [dict(row) for row in records],
    )
    monkeypatch.setattr(
        sys.modules["fabricops_kit.widgets.widget_author_guardrails"].shared,
        "_write_rule_records",
        lambda records, **kwargs: saved.append([dict(row) for row in records]),
    )
'''
          if old not in text:
              raise SystemExit("Expected Guardrail save test block not found")
          guardrail_test.write_text(text.replace(old, new, 1), encoding="utf-8")

          dq_test = Path("tests/unit/test_widget_author_dq_rules.py")
          text = dq_test.read_text(encoding="utf-8")
          old = '''    monkeypatch.setattr(
        module.authoring,
        "_canonicalize_records",
        lambda records, **kwargs: saved.append(records) or records,
    )
'''
          new = '''    monkeypatch.setattr(
        module.authoring,
        "_canonicalize_records",
        lambda records, **kwargs: records,
    )
    monkeypatch.setattr(
        module.shared,
        "_write_rule_records",
        lambda records, **kwargs: saved.append(records),
    )
'''
          if old not in text:
              raise SystemExit("Expected DQ save test block not found")
          dq_test.write_text(text.replace(old, new, 1), encoding="utf-8")

          for path in (
              Path("tests/unit/test_widget_author_guardrails.py"),
              Path("tests/unit/test_widget_author_dq_rules.py"),
          ):
              lines = path.read_text(encoding="utf-8").splitlines()
              result = []
              for index, line in enumerate(lines):
                  result.append(line)
                  if line.startswith("def test_") and line.rstrip().endswith("):"):
                      next_line = lines[index + 1] if index + 1 < len(lines) else ""
                      if not next_line.lstrip().startswith(('"""', "'''")):
                          result.append('    """Verify the focused authoring contract."""')
              path.write_text("\n".join(result) + "\n", encoding="utf-8")
          PY

      - name: Regenerate public call-flow contract twice
        run: |
          PYTHONPATH=src python scripts/generate_public_function_call_flows_json.py
          cp docs/reference/_data/public-function-call-flows.json /tmp/public-function-call-flows-first.json
          PYTHONPATH=src python scripts/generate_public_function_call_flows_json.py
          diff -u /tmp/public-function-call-flows-first.json docs/reference/_data/public-function-call-flows.json

      - name: Regenerate individual function references twice
        run: |
          PYTHONPATH=src python scripts/generate_individual_function_reference_pages.py
          git diff -- docs/api/reference docs/reference/index.md docs/reference/function-call-graph.md > /tmp/reference-first.diff
          PYTHONPATH=src python scripts/generate_individual_function_reference_pages.py
          git diff -- docs/api/reference docs/reference/index.md docs/reference/function-call-graph.md > /tmp/reference-second.diff
          diff -u /tmp/reference-first.diff /tmp/reference-second.diff

      - name: Verify dashboard was not regenerated
        run: |
          if git diff --name-only | grep -Fx 'docs/assets/public-function-call-flows-dashboard.html'; then
            echo 'Dashboard HTML changed unexpectedly.' >&2
            exit 1
          fi

      - name: Ruff lint
        run: uv run ruff check .

      - name: Compile Python
        run: python -m compileall -q src scripts

      - name: Run full test suite
        run: uv run pytest

      - name: Validate generated artifact ownership
        run: python scripts/validate_generated_artifact_ownership.py

      - name: Build strict documentation
        env:
          DISABLE_MKDOCS_2_WARNING: "true"
        run: uv run mkdocs build --strict

      - name: Check diff whitespace
        run: git diff --check

      - name: Review resulting diff
        run: |
          git status --short
          git diff --stat
          git diff --name-only

      - name: Remove temporary workflow and publish validated changes
        run: |
          git rm .github/workflows/agent-stage4bc-finalize.yml
          git diff --check
          if git diff --name-only | grep -Fx 'docs/assets/public-function-call-flows-dashboard.html'; then
            echo 'Dashboard HTML changed unexpectedly.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize standalone Guardrail and DQ authoring'
          git push origin HEAD:agent/improve-standalone-guardrail-dq-authoring
