name: Release FabricOps Starter Kit

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DISABLE_MKDOCS_2_WARNING: "true"
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install locked project and documentation dependencies
        run: uv sync --frozen --extra docs --extra dev

      - name: Verify tag matches pyproject version
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/check_release_ready.py "${GITHUB_REF_NAME}"
          version="${GITHUB_REF_NAME#v}"
          echo "FABRICOPS_PACKAGE_VERSION=${version}" >> "${GITHUB_ENV}"
          echo "FABRICOPS_GIT_SHA=${GITHUB_SHA}" >> "${GITHUB_ENV}"

      - name: Ruff lint
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest

      - name: Regenerate generated reference artifacts
        shell: bash
        run: |
          set -euo pipefail
          source .venv/bin/activate
          PYTHONPATH=src python scripts/generate_individual_function_reference_pages.py
          PYTHONPATH=src python scripts/generate_release_inventory.py --check
          PYTHONPATH=src python scripts/generate_release_contract_pages.py

          # Keep the manually maintained explanatory page unchanged. The legacy
          # generator still writes this path, but it is not part of its output contract.
          git restore --source=HEAD -- docs/reference/function-call-graph.md

      - name: Build strict documentation
        run: uv run mkdocs build --strict

      - name: Build distributions
        run: uv build

      - name: Check distributions
        run: uvx twine check dist/*

      - name: Install wheel and smoke-test public imports
        shell: bash
        run: |
          set -euo pipefail
          wheel_path="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "${wheel_path}"
          python -m venv "${RUNNER_TEMP}/fabricops-wheel-smoke"
          source "${RUNNER_TEMP}/fabricops-wheel-smoke/bin/activate"
          python -m pip install --upgrade pip
          python -m pip install "pyspark>=4.1.1" "${wheel_path}"
          python - <<'PY'
          from importlib.metadata import version
          import fabricops_kit as kit

          assert kit.__version__ == version("fabricops-kit")
          for public_name in kit.__all__:
              getattr(kit, public_name)
          print(f"Imported fabricops_kit {kit.__version__} with {len(kit.__all__)} public names")
          PY

      - name: Build Live notebook pack
        run: uv run python scripts/build_release_notebook_pack.py "${FABRICOPS_PACKAGE_VERSION}" --output-dir dist

      - name: Generate SHA256 checksums
        run: |
          cd dist
          sha256sum *.whl *.tar.gz *.zip > SHA256SUMS.txt

      - name: Extract changelog release notes
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["FABRICOPS_PACKAGE_VERSION"]
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = re.compile(rf"^## \[(?:v)?{re.escape(version)}\].*?$", re.MULTILINE)
          match = pattern.search(changelog)
          if not match:
              raise SystemExit(f"CHANGELOG.md has no release section for {version}")
          next_heading = re.search(r"^## ", changelog[match.end():], re.MULTILINE)
          end = match.end() + next_heading.start() if next_heading else len(changelog)
          notes = changelog[match.start():end].strip()
          Path("dist/RELEASE_NOTES.md").write_text(notes + "\n", encoding="utf-8")
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: FabricOps Starter Kit ${{ github.ref_name }}
          body_path: dist/RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS.txt
