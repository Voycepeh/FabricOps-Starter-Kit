name: Release FabricOps Starter Kit

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install locked release dependencies
        run: uv sync --frozen --extra dev

      - name: Verify tag matches release contract
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/check_release_ready.py "${GITHUB_REF_NAME}"
          uv run python scripts/generate_release_inventory.py --check
          uv run python scripts/release_navigation.py --check
          version="${GITHUB_REF_NAME#v}"
          echo "FABRICOPS_PACKAGE_VERSION=${version}" >> "${GITHUB_ENV}"
          echo "FABRICOPS_GIT_SHA=${GITHUB_SHA}" >> "${GITHUB_ENV}"

      - name: Build release distributions
        run: uv build

      - name: Check release distributions
        run: uvx twine check dist/*

      - name: Generate SHA256 checksums
        run: |
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS.txt

      - name: Extract changelog release notes
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["FABRICOPS_PACKAGE_VERSION"]
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = re.compile(rf"^## \[(?:v)?{re.escape(version)}\].*?$", re.MULTILINE)
          match = pattern.search(changelog)
          if not match:
              raise SystemExit(f"CHANGELOG.md has no release section for {version}")
          next_heading = re.search(r"^## ", changelog[match.end():], re.MULTILINE)
          end = match.end() + next_heading.start() if next_heading else len(changelog)
          notes = changelog[match.start():end].strip()
          Path("dist/RELEASE_NOTES.md").write_text(notes + "\n", encoding="utf-8")
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: FabricOps Starter Kit ${{ github.ref_name }}
          body_path: dist/RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS.txt
