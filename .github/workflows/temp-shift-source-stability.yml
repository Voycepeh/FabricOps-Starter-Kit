name: Shift Source Stability wording

on:
  push:
    branches:
      - docs/refresh-read-write-sequence

permissions:
  contents: write

jobs:
  update-doc:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: docs/refresh-read-write-sequence
      - name: Move Source Stability to Write sequence
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/how-fabricops-works.md')
          text = path.read_text()
          old_read = '- enforce Freshness with [`check_freshness()`](api/reference/check_freshness.md) and Source Stability with [`check_source_stability()`](api/reference/check_source_stability.md)\n'
          new_read = '- enforce Freshness with [`check_freshness()`](api/reference/check_freshness.md)\n'
          if old_read not in text:
              raise SystemExit('Read Source Stability line not found')
          text = text.replace(old_read, new_read, 1)
          old_write = '- enforce target Schema with [`check_schema()`](api/reference/check_schema.md) and Data Quality with [`check_dq()`](api/reference/check_dq.md)\n'
          new_write = '- enforce Source Stability with [`check_source_stability()`](api/reference/check_source_stability.md) once the governed source-to-target relationship is known\n' + old_write
          if old_write not in text:
              raise SystemExit('Write check line not found')
          text = text.replace(old_write, new_write, 1)
          path.write_text(text)
          PY
      - name: Commit doc update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/how-fabricops-works.md
          git diff --cached --quiet && exit 0
          git commit -m 'Move Source Stability to Write sequence [skip ci]'
          git push origin HEAD:docs/refresh-read-write-sequence
