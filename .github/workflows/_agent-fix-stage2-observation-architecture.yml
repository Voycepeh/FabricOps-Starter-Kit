name: Fix Stage 2 observation helper architecture

on:
  push:
    branches:
      - agent/stage2-metadata-operational-family

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: agent/stage2-metadata-operational-family
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Move Stage 2 helpers into canonical shared modules
        run: |
          python - <<'PY'
          from pathlib import Path

          config_shared = Path('src/fabricops_kit/config/shared.py')
          text = config_shared.read_text()
          future_header = 'from __future__ import annotations\n'
          required_header = 'from __future__ import annotations\n\nimport hashlib\nimport json\n'
          if required_header not in text:
              text = text.replace(future_header, required_header, 1)
          identity_block = '''\n\ndef stable_metadata_id(*parts: Any) -> str:\n    \"\"\"Return a deterministic SHA-256 identity from normalized logical parts.\"\"\"\n    payload = [\n        {\"is_null\": part is None, \"value\": None if part is None else str(part).strip().lower()}\n        for part in parts\n    ]\n    return hashlib.sha256(\n        json.dumps(payload, separators=(\",\", \":\"), sort_keys=True).encode(\"utf-8\")\n    ).hexdigest()\n\n\ndef build_table_id(store_type: Any, layer: Any, schema_name: Any, table_name: Any) -> str:\n    \"\"\"Return the environment-independent logical identity for a table asset.\"\"\"\n    return stable_metadata_id(store_type, layer, schema_name, table_name)\n\n\ndef build_column_id(table_id: Any, column_name: Any) -> str:\n    \"\"\"Return the environment-independent logical identity for a column asset.\"\"\"\n    return stable_metadata_id(table_id, column_name)\n'''
          if 'def build_table_id(' not in text:
              text += identity_block
          config_shared.write_text(text)

          pipeline_shared = Path('src/fabricops_kit/pipeline/shared.py')
          text = pipeline_shared.read_text()
          text = text.replace(
              'from ..io.shared import configured_lakehouse_schema, write_lakehouse_table_core',
              'from ..io.shared import configured_lakehouse_schema, read_lakehouse_table_core, write_lakehouse_table_core',
          )
          observation_block = '''\n\nSOURCE_OBSERVATION_COLUMNS = frozenset(\n    {\n        \"observation_id\",\n        \"table_id\",\n        \"environment_name\",\n        \"partition_value\",\n        \"row_count\",\n        \"min_change_value\",\n        \"max_change_value\",\n        \"is_present\",\n        \"observed_at\",\n    }\n)\n\n\ndef observation_rows(dataframe: Any) -> list[dict[str, Any]]:\n    \"\"\"Return canonical observation rows as dictionaries.\"\"\"\n    values = dataframe.collect() if hasattr(dataframe, \"collect\") else dataframe\n    return [row.asDict(recursive=True) if hasattr(row, \"asDict\") else dict(row) for row in values or []]\n\n\ndef is_source_observation(dataframe: Any) -> bool:\n    \"\"\"Return whether a value exposes the normalized observation contract.\"\"\"\n    columns = set(getattr(dataframe, \"columns\", ()))\n    if not columns and isinstance(dataframe, (list, tuple)) and dataframe:\n        columns = set(dict(dataframe[0]))\n    return SOURCE_OBSERVATION_COLUMNS <= columns\n\n\ndef catalogue_table_identity(\n    *, config: Any, env: str, table_id: str, spark_session: Any\n) -> dict[str, Any] | None:\n    \"\"\"Resolve physical table attributes from the environment-specific Catalogue row.\"\"\"\n    catalogue = read_lakehouse_table_core(\n        \"METADATA_DATA_CATALOGUE\",\n        target=\"metadata\",\n        schema=configured_lakehouse_schema(config, env, \"metadata\"),\n        spark_session=spark_session,\n        context={\"config\": config, \"env\": env},\n    )\n    if hasattr(catalogue, \"where\"):\n        from pyspark.sql import functions as F\n\n        matches = catalogue.where(\n            (F.col(\"environment_name\") == env)\n            & (F.col(\"table_id\") == table_id)\n            & (F.col(\"metadata_level\") == \"table\")\n        )\n        if \"is_active\" in getattr(matches, \"columns\", ()):\n            matches = matches.where(F.col(\"is_active\") == F.lit(True))\n        rows = matches.orderBy(F.col(\"last_profiled_at\").desc_nulls_last()).limit(1).collect()\n        return rows[0].asDict(recursive=True) if rows else None\n\n    rows = observation_rows(catalogue)\n    candidates = [\n        row\n        for row in rows\n        if str(row.get(\"environment_name\") or \"\") == env\n        and str(row.get(\"table_id\") or \"\") == table_id\n        and str(row.get(\"metadata_level\") or \"\") == \"table\"\n        and row.get(\"is_active\", True) is not False\n    ]\n    if not candidates:\n        return None\n    candidates.sort(key=lambda row: str(row.get(\"last_profiled_at\") or \"\"), reverse=True)\n    return candidates[0]\n\n\ndef guardrail_compatibility_observation(\n    observation: Any, *, table_id: str, change_column: str\n) -> Any:\n    \"\"\"Add temporary in-memory aliases required by the Stage 4 Guardrail model.\"\"\"\n    if hasattr(observation, \"withColumn\"):\n        from pyspark.sql import functions as F\n\n        return observation.withColumn(\"metadata_table_key\", F.lit(table_id)).withColumn(\n            \"change_column\", F.lit(change_column)\n        )\n    return [\n        {**row, \"metadata_table_key\": table_id, \"change_column\": change_column}\n        for row in observation_rows(observation)\n    ]\n'''
          if 'def observation_rows(' not in text:
              text += observation_block
          pipeline_shared.write_text(text)

          for root in (Path('src'), Path('tests')):
              for path in root.rglob('*.py'):
                  if path in {config_shared, pipeline_shared}:
                      continue
                  text = path.read_text()
                  text = text.replace('from fabricops_kit.config.metadata_identity import _build_column_id, _build_table_id', 'from fabricops_kit.config.shared import build_column_id, build_table_id')
                  text = text.replace('from fabricops_kit.config.metadata_identity import _build_table_id', 'from fabricops_kit.config.shared import build_table_id')
                  text = text.replace('from fabricops_kit.config.metadata_identity import _build_column_id', 'from fabricops_kit.config.shared import build_column_id')
                  text = text.replace('_build_table_id(', 'build_table_id(')
                  text = text.replace('_build_column_id(', 'build_column_id(')
                  text = text.replace('from fabricops_kit.pipeline.observation_shared import (', 'from fabricops_kit.pipeline.shared import (')
                  text = text.replace('from fabricops_kit.pipeline.observation_shared import _is_source_observation, _observation_rows', 'from fabricops_kit.pipeline.shared import is_source_observation, observation_rows')
                  text = text.replace('from fabricops_kit.pipeline.observation_shared import is_source_observation, observation_rows', 'from fabricops_kit.pipeline.shared import is_source_observation, observation_rows')
                  text = text.replace('_guardrail_compatibility_observation', 'guardrail_compatibility_observation')
                  text = text.replace('_catalogue_table_identity', 'catalogue_table_identity')
                  text = text.replace('_is_source_observation', 'is_source_observation')
                  text = text.replace('_observation_rows', 'observation_rows')
                  path.write_text(text)
          PY
          git rm -f src/fabricops_kit/config/metadata_identity.py
          git rm -f src/fabricops_kit/pipeline/observation_shared.py
      - name: Install locked dependencies
        run: uv sync --frozen --extra docs --extra dev
      - name: Validate source
        run: |
          uv run ruff check .
          uv run pytest
          uv run python scripts/release_navigation.py --check
      - name: Regenerate owned artifacts
        env:
          PYTHONPATH: src
          FABRICOPS_PRESERVE_GENERATED_ARTIFACT_TIMESTAMPS: "1"
        run: |
          uv run python scripts/generate_public_function_call_flows_json.py
          uv run python scripts/generate_individual_function_reference_pages.py
      - name: Verify generated stability
        env:
          PYTHONPATH: src
          FABRICOPS_PRESERVE_GENERATED_ARTIFACT_TIMESTAMPS: "1"
        run: |
          git add src tests scripts docs/reference/_data/public-function-call-flows.json docs/reference/_data/generated-artifacts.json docs/api/reference docs/reference/index.md docs/reference/function-call-graph.md docs/reference/metadata.md docs/reference/metadata
          uv run python scripts/generate_public_function_call_flows_json.py
          uv run python scripts/generate_individual_function_reference_pages.py
          git diff --exit-code -- docs/reference/_data/public-function-call-flows.json docs/api/reference docs/reference/index.md docs/reference/function-call-graph.md docs/reference/metadata.md docs/reference/metadata
      - name: Validate ownership and docs
        run: |
          uv run python scripts/validate_generated_artifact_ownership.py --base-ref main
          uv run mkdocs build --strict
      - name: Commit final fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests scripts docs/reference/_data/public-function-call-flows.json docs/reference/_data/generated-artifacts.json docs/api/reference docs/reference/index.md docs/reference/function-call-graph.md docs/reference/metadata.md docs/reference/metadata
          git commit -m "Align Stage 2 helpers with shared architecture"
      - name: Remove temporary workflow and push
        run: |
          git rm .github/workflows/_agent-fix-stage2-observation-architecture.yml
          git commit -m "Remove temporary Stage 2 architecture workflow"
          git push origin HEAD:agent/stage2-metadata-operational-family
