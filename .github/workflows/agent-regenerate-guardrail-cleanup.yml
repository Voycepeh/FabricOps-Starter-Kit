name: Agent regenerate guardrail cleanup

on:
  push:
    branches:
      - agent/remove-unused-guardrail-review-widget

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: agent/remove-unused-guardrail-review-widget

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install locked dependencies
        run: uv sync --frozen --extra docs --extra dev

      - name: Remove stale docs metadata references
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path("scripts/reference_docs_metadata.py")
          text = path.read_text(encoding="utf-8")
          tree = ast.parse(text)
          short = "widget_review_guardrail_governance"
          module = "widgets.widget_review_guardrail_governance"
          fq = "fabricops_kit.widgets.widget_review_guardrail_governance.widget_review_guardrail_governance"

          starts = [0]
          for i, char in enumerate(text):
              if char == "\n":
                  starts.append(i + 1)

          def offset(lineno, col):
              return starts[lineno - 1] + col

          spans = []
          for node in ast.walk(tree):
              if not isinstance(node, ast.Dict):
                  continue
              pairs = {}
              for key, value in zip(node.keys, node.values):
                  if isinstance(key, ast.Constant) and isinstance(key.value, str) and isinstance(value, ast.Constant):
                      pairs[key.value] = value.value
                  if isinstance(key, ast.Constant) and key.value == short:
                      start = offset(key.lineno, key.col_offset)
                      end = offset(value.end_lineno, value.end_col_offset)
                      pos = end
                      while pos < len(text) and text[pos] in " \t":
                          pos += 1
                      if pos < len(text) and text[pos] == ",":
                          pos += 1
                      spans.append((start, pos))
              if pairs.get("symbol_name") == short or pairs.get("module_name") == module:
                  start = offset(node.lineno, node.col_offset)
                  end = offset(node.end_lineno, node.end_col_offset)
                  pos = end
                  while pos < len(text) and text[pos] in " \t":
                      pos += 1
                  if pos < len(text) and text[pos] == ",":
                      pos += 1
                  spans.append((start, pos))

          for start, end in sorted(set(spans), reverse=True):
              text = text[:start] + text[end:]

          text = "\n".join(line for line in text.split("\n") if fq not in line)
          text = text.replace(f", '{short}'", "")
          text = text.replace(f"'{short}', ", "")
          text = text.replace(f"['{short}']", "[]")
          text = text.replace(f', "{short}"', "")
          text = text.replace(f'"{short}", ', "")
          text = text.replace(f'["{short}"]', "[]")
          if short in text:
              for lineno, line in enumerate(text.splitlines(), 1):
                  if short in line:
                      print(f"remaining {lineno}: {line}")
              raise SystemExit("stale widget_review_guardrail_governance reference remains in reference_docs_metadata.py")
          ast.parse(text)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Generate public function call flows twice
        run: |
          source .venv/bin/activate
          PYTHONPATH=src python scripts/generate_public_function_call_flows_json.py
          cp docs/reference/_data/public-function-call-flows.json /tmp/public-function-call-flows-first.json
          PYTHONPATH=src python scripts/generate_public_function_call_flows_json.py
          cmp /tmp/public-function-call-flows-first.json docs/reference/_data/public-function-call-flows.json

      - name: Generate individual function references twice
        run: |
          source .venv/bin/activate
          PYTHONPATH=src python scripts/generate_individual_function_reference_pages.py
          git diff -- docs/api/reference docs/reference/index.md docs/reference/function-call-graph.md > /tmp/reference-first.diff
          PYTHONPATH=src python scripts/generate_individual_function_reference_pages.py
          git diff -- docs/api/reference docs/reference/index.md docs/reference/function-call-graph.md > /tmp/reference-second.diff
          diff -u /tmp/reference-first.diff /tmp/reference-second.diff

      - name: Commit source and generated diffs only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/agent-regenerate-guardrail-cleanup.yml
          git add -u -- scripts/reference_docs_metadata.py .github/workflows/agent-regenerate-guardrail-cleanup.yml docs/reference/_data/public-function-call-flows.json docs/reference/_data/generated-artifacts.json docs/api/reference docs/reference/index.md docs/reference/function-call-graph.md
          git commit -m "docs: regenerate references after widget removal"
          git push origin HEAD:agent/remove-unused-guardrail-review-widget
