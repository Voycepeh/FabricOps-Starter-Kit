name: Agent fix removed widget tests

on:
  push:
    branches:
      - agent/remove-unused-guardrail-review-widget

permissions:
  contents: write

jobs:
  fix-tests:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/remove-unused-guardrail-review-widget
          fetch-depth: 0

      - name: Remove obsolete deleted-widget tests
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path('tests/unit/test_guardrail_authoring_model.py')
          text = path.read_text(encoding='utf-8')
          target = 'widget_review_guardrail_governance'
          tree = ast.parse(text)
          lines = text.splitlines(keepends=True)

          ranges = []
          for node in tree.body:
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                  segment = ast.get_source_segment(text, node) or ''
                  if target in segment:
                      ranges.append((node.lineno - 1, node.end_lineno))

          for start, end in reversed(ranges):
              del lines[start:end]

          text = ''.join(lines)
          text = text.replace(', widget_review_guardrail_governance', '')
          text = text.replace('widget_review_guardrail_governance, ', '')
          if target in text:
              for lineno, line in enumerate(text.splitlines(), 1):
                  if target in line:
                      print(f'remaining {lineno}: {line}')
              raise SystemExit('stale deleted-widget test reference remains')
          ast.parse(text)
          path.write_text(text, encoding='utf-8')
          print(f'Removed {len(ranges)} obsolete widget test function(s)')
          PY

      - name: Commit focused test cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/agent-fix-removed-widget-tests.yml
          git add -u -- tests/unit/test_guardrail_authoring_model.py .github/workflows/agent-fix-removed-widget-tests.yml
          git commit -m "test: remove retired guardrail review widget coverage"
          git push origin HEAD:agent/remove-unused-guardrail-review-widget
