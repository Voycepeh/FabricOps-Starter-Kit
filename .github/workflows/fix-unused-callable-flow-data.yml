name: Fix unused callable flow data

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'fix/function-call-graph-root-v2' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/function-call-graph-root-v2
          fetch-depth: 0

      - name: Remove obsolete variable
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/generate_individual_function_reference_pages.py')
          text = path.read_text(encoding='utf-8')
          obsolete = '''    callable_flow_data = {
        "metadata": dashboard_inventory_data.get("metadata", {}),
        "public_entrypoint_flow": dashboard_public_functions,
        "public_functions": dashboard_public_functions,
    }
'''
          if obsolete not in text:
              raise SystemExit('Expected callable_flow_data block was not found')
          path.write_text(text.replace(obsolete, '', 1), encoding='utf-8')
          PY

      - name: Commit lint fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/generate_individual_function_reference_pages.py
          git commit -m "fix: remove unused callable flow data"
          git push origin HEAD:fix/function-call-graph-root-v2
