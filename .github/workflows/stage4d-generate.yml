name: Stage 4D generate references

on:
  push:
    branches:
      - agent/stage-4d-guardrail-runtime

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[stage4d-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: agent/stage-4d-guardrail-runtime
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install locked dependencies
        run: uv sync --frozen --extra docs --extra dev

      - name: Add run_table_guardrails public metadata
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          from pathlib import Path

          path = Path("scripts/reference_docs_metadata.py")
          text = path.read_text(encoding="utf-8")
          if "'symbol_name': 'run_table_guardrails'" not in text:
              marker = "\n\nFOCUSED_FUNCTION_DOC_UPDATES = {"
              if marker not in text:
                  raise SystemExit("Could not locate PUBLIC_SYMBOL_DOCS insertion point")
              entry = '''\n {'kind': 'function',
  'module': 'pipeline',
  'function_type': 'callable',
  'summary_override': 'Run Schema, Freshness, Changes, and DQ guardrails for one table.',
  'symbol_name': 'run_table_guardrails',
  'template_notebook': '02_pipeline',
  'template_segment': 'Guardrail enforcement',
  'use_when': 'Use after source data is available when one table should run the governed Schema, Freshness, Changes, and DQ checks through one orchestration call.',
  'do_not_use_when': 'Do not use to author Guardrail rules or replace the independently callable check_schema, check_freshness, check_changes, or check_dq functions.',
  'parameters': 'DataFrame, table name, configured target and optional schema, optional pre-collected observation, optional dataset/run identity, and optional DQ row-identity columns.',
  'returns': 'Combined status and can_continue decision, individual check results, canonical observation, DQ-tagged dataframe, passing_dataframe, and quarantine_dataframe.',
  'raises': 'Raises underlying observation, metadata-read, DQ evaluation, or Spark errors that are not represented as normal Guardrail results.',
  'side_effects': 'Delegates to the focused checks, which own Guardrail result persistence; DQ also owns failed-row evidence persistence. The orchestrator does not introduce separate quarantine storage.',
  'fabric_context': 'Use in 02_pipeline with configured FabricOps target routing. Schema, Freshness, and Changes remain table-level continuation checks while blocking DQ failures are exposed as quarantine rows.',
  'ai_verification': 'Verify all four check results, overall can_continue, and the passing/quarantine split before downstream writes.',
  'preferred_example': 'guardrail_result = run_table_guardrails(source_df, "orders", target="source", schema="dbo", run_id=RUN_ID, row_identity_columns=["order_id"])',
  'related_functions': ['check_schema', 'check_freshness', 'check_changes', 'check_dq', 'observe_table'],
  'expanded_purpose': 'Coordinates the existing public Schema, Freshness, Changes, and DQ checks for one governed table without duplicating their rule selection, evaluation, or evidence writers. It derives one combined continuation decision and separates rows with blocking DQ failures from rows that may continue.',
  'when_to_use': 'Use when 02_pipeline needs one table-level runtime entry point while keeping the four focused checks independently callable.',
  'glossary_terms': ['guardrails', 'can_continue', 'source data', 'target table'],
  'return_interpretation': 'A failed overall result means at least one focused check blocks continuation. Warning means execution may continue with a warning. quarantine_dataframe contains only rows tagged failed by DQ; warning-only DQ rows stay in passing_dataframe.',
  'common_failure_causes': ['The table or configured target cannot be observed.', 'Required Guardrail metadata cannot be resolved.', 'Schema or DQ evaluation encounters unsupported data.', 'The caller supplies invalid row-identity columns or table identity.']},\n'''
              text = text.replace(marker, entry + marker, 1)
              path.write_text(text, encoding="utf-8")
          PY

      - name: Generate public call-flow contract
        run: PYTHONPATH=src uv run python scripts/generate_public_function_call_flows_json.py

      - name: Generate individual function references
        run: PYTHONPATH=src uv run python scripts/generate_individual_function_reference_pages.py

      - name: Verify individual reference generator is stable
        shell: bash
        run: |
          set -euo pipefail
          before="$(git diff --no-ext-diff --binary)"
          PYTHONPATH=src uv run python scripts/generate_individual_function_reference_pages.py
          after="$(git diff --no-ext-diff --binary)"
          test "${before}" = "${after}"

      - name: Commit exact generated outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/reference_docs_metadata.py
          git add docs/reference/_data/public-function-call-flows.json
          git add docs/reference/_data/generated-artifacts.json
          git add docs/api/reference docs/reference/index.md docs/reference/call-graph.md
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "docs: generate Stage 4D public references [stage4d-generated]"
          git push origin HEAD:agent/stage-4d-guardrail-runtime
