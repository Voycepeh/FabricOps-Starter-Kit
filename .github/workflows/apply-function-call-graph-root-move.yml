name: Apply function call graph root move

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/function-call-graph-root-v2' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/function-call-graph-root-v2
          fetch-depth: 0

      - name: Apply repository patch
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import ast
          import re
          from pathlib import Path

          root = Path('.')

          generator_path = root / 'scripts/generate_individual_function_reference_pages.py'
          source = generator_path.read_text(encoding='utf-8')
          tree = ast.parse(source)
          lines = source.splitlines(keepends=True)
          removals = []
          for node in tree.body:
              if isinstance(node, ast.FunctionDef) and node.name == '_render_callable_flow_page':
                  removals.append((node.lineno, node.end_lineno or node.lineno))
          for node in ast.walk(tree):
              if not isinstance(node, ast.Expr) or not isinstance(node.value, ast.Call):
                  continue
              func = node.value.func
              if isinstance(func, ast.Attribute) and func.attr == 'write_text' and isinstance(func.value, ast.Name) and func.value.id == 'FUNCTION_CALL_GRAPH_PAGE_PATH':
                  removals.append((node.lineno, node.end_lineno or node.lineno))
          for start, end in sorted(removals, reverse=True):
              del lines[start - 1:end]
          source = ''.join(lines)
          source = re.sub(r'^FUNCTION_CALL_GRAPH_PAGE_PATH = ROOT / "docs" / "reference" / "function-call-graph\.md"\n', '', source, flags=re.MULTILINE)
          source = source.replace('[Function Call Graph](function-call-graph.md)', '[Function Call Graph](../function-call-graph.md)')
          generator_path.write_text(source, encoding='utf-8')

          old_page = root / 'docs/reference/function-call-graph.md'
          new_page = root / 'docs/function-call-graph.md'
          page = old_page.read_text(encoding='utf-8')
          page = page.replace('href="../../assets/', 'href="assets/')
          page = page.replace('href="../_data/', 'href="reference/_data/')
          page = page.replace('](../assets/', '](assets/')
          page = page.replace('`docs/reference/function-call-graph.md` is a standalone, manually maintained explanatory page. The CI, development-docs, and release workflows preserve this file after legacy reference generation so the generated copy is never built or deployed.', '`docs/function-call-graph.md` is a standalone, manually maintained guide. It is not owned or regenerated by the individual function reference generator.')
          new_page.write_text(page, encoding='utf-8')
          old_page.write_text('# Function Call Graph\n\n<meta http-equiv="refresh" content="0; url=../../function-call-graph/">\n\nThis guide has moved to the [standalone Function Call Graph page](../../function-call-graph/).\n', encoding='utf-8')

          mkdocs_path = root / 'mkdocs.yml'
          mkdocs = mkdocs_path.read_text(encoding='utf-8')
          mkdocs = mkdocs.replace('  - How FabricOps Works: how-fabricops-works.md\n', '  - How FabricOps Works: how-fabricops-works.md\n  - Function Call Graph: function-call-graph.md\n')
          mkdocs = mkdocs.replace('      - Function Call Graph: reference/function-call-graph.md\n', '')
          mkdocs_path.write_text(mkdocs, encoding='utf-8')

          homepage = root / 'docs/index.md'
          homepage.write_text(homepage.read_text(encoding='utf-8').replace('href="reference/function-call-graph/"', 'href="function-call-graph/"').replace('Open Function Call Graph Reference', 'Open Function Call Graph Guide'), encoding='utf-8')

          reference_index = root / 'docs/reference/index.md'
          reference_index.write_text(reference_index.read_text(encoding='utf-8').replace('[Function Call Graph](function-call-graph.md)', '[Function Call Graph](../function-call-graph.md)'), encoding='utf-8')

          public_contract = root / 'docs/reference/public-api-contract.md'
          if public_contract.exists():
              text = public_contract.read_text(encoding='utf-8').replace('](function-call-graph.md)', '](../function-call-graph.md)').replace('docs/reference/function-call-graph.md', 'docs/function-call-graph.md')
              public_contract.write_text(text, encoding='utf-8')

          agents_path = root / 'AGENTS.md'
          agents = agents_path.read_text(encoding='utf-8').replace('docs/reference/function-call-graph.md', 'docs/function-call-graph.md')
          agents = agents.replace('   - `docs/function-call-graph.md`\n   - generated by:\n      `PYTHONPATH=src python scripts/generate_individual_function_reference_pages.py`', '   - generated by:\n      `PYTHONPATH=src python scripts/generate_individual_function_reference_pages.py`')
          marker = 'Source inputs and generators:\n'
          if '4. Standalone maintainer guide:' not in agents:
              agents = agents.replace(marker, '4. Standalone maintainer guide:\n   - `docs/function-call-graph.md`\n   - manually maintained and not generated by the individual reference generator\n\n' + marker)
          agents_path.write_text(agents, encoding='utf-8')

          test_path = root / 'tests/unit/test_reference_agent_docs.py'
          test_source = test_path.read_text(encoding='utf-8')
          test_tree = ast.parse(test_source)
          target = next(node for node in test_tree.body if isinstance(node, ast.FunctionDef) and node.name == 'test_callable_flow_page_and_json_cover_public_surface')
          replacement = '''def test_callable_flow_page_and_json_cover_public_surface() -> None:\n    """Verify the standalone guide and v2 JSON contract cover the public surface."""\n    flow_page = ROOT / "docs" / "function-call-graph.md"\n    redirect_page = REFERENCE_DIR / "function-call-graph.md"\n    flow_data_path = REFERENCE_DIR / "_data" / "public-function-call-flows.json"\n\n    assert flow_page.exists()\n    assert redirect_page.exists()\n    assert flow_data_path.exists()\n\n    flow_text = flow_page.read_text(encoding="utf-8")\n    assert "# Function Call Graph" in flow_text\n    assert "## 1. Repository Code" in flow_text\n    assert "## 2. Agent reads context" in flow_text\n    assert "## 3. Edit function source" in flow_text\n    assert "## 4. Regenerate call flow" in flow_text\n    assert "## 5. Dashboard & review" in flow_text\n    assert 'href="assets/public-function-call-flows-dashboard.html"' in flow_text\n    assert 'href="reference/_data/public-function-call-flows.json"' in flow_text\n\n    redirect_text = redirect_page.read_text(encoding="utf-8")\n    assert "../../function-call-graph/" in redirect_text\n\n    data = json.loads(flow_data_path.read_text(encoding="utf-8"))\n    assert data["public_functions"]\n    assert data["defined_functions"]\n    assert "defined_but_not_used" in data\n\n    generator_source = (ROOT / "scripts" / "generate_individual_function_reference_pages.py").read_text(encoding="utf-8")\n    assert "FUNCTION_CALL_GRAPH_PAGE_PATH" not in generator_source\n    assert "def _render_callable_flow_page" not in generator_source\n    assert "docs/reference/function-call-graph.md" not in generator_source\n\n'''
          source_lines = test_source.splitlines(keepends=True)
          source_lines[target.lineno - 1:target.end_lineno] = replacement.splitlines(keepends=True)
          test_path.write_text(''.join(source_lines), encoding='utf-8')

          focused_test = root / 'tests/unit/test_function_call_graph_standalone.py'
          focused_test.write_text('''from pathlib import Path\n\nROOT = Path(__file__).parents[2]\n\ndef test_function_call_graph_is_root_owned_and_not_generated() -> None:\n    generator = (ROOT / "scripts/generate_individual_function_reference_pages.py").read_text(encoding="utf-8")\n    mkdocs = (ROOT / "mkdocs.yml").read_text(encoding="utf-8")\n    homepage = (ROOT / "docs/index.md").read_text(encoding="utf-8")\n    assert (ROOT / "docs/function-call-graph.md").exists()\n    assert "FUNCTION_CALL_GRAPH_PAGE_PATH" not in generator\n    assert "def _render_callable_flow_page" not in generator\n    assert "Function Call Graph: function-call-graph.md" in mkdocs\n    assert "Function Call Graph: reference/function-call-graph.md" not in mkdocs\n    assert 'href="function-call-graph/"' in homepage\n''', encoding='utf-8')

          for trigger in root.glob('docs/.trigger-function-call-graph-patch*'):
              trigger.unlink()
          PY

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: promote function call graph guide to docs root"
          git push origin HEAD:fix/function-call-graph-root-v2
