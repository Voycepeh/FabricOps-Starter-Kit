name: Regenerate call-flow dashboard

on:
  push:
    branches:
      - agent/add-call-flow-simplify-prompt

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: agent/add-call-flow-simplify-prompt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Regenerate dashboard
        run: PYTHONPATH=src python scripts/generate_public_function_call_flows_dashboard.py

      - name: Commit generated dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/public-function-call-flows-dashboard.html docs/reference/_data/generated-artifacts.json
          if git diff --cached --quiet; then
            echo "Dashboard already current"
          else
            git commit -m "regenerate call-flow dashboard"
            git push origin HEAD:agent/add-call-flow-simplify-prompt
          fi
