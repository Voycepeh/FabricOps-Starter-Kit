name: Agent finalize retired widget PR

on:
  push:
    branches:
      - agent/remove-unused-guardrail-review-widget

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/remove-unused-guardrail-review-widget
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --frozen --extra docs --extra dev

      - name: Revert unrelated guided-demo normalization
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/reference_docs_metadata.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '../../guided-demo/02-run-pipeline.md': '../../guided-demo/run-pipeline.md',
              '../../guided-demo/03-enrich-guardrails.md': '../../guided-demo/review-guardrails.md',
          }
          for new, old in replacements.items():
              text = text.replace(new, old)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Regenerate individual references twice
        run: |
          source .venv/bin/activate
          PYTHONPATH=src python scripts/generate_individual_function_reference_pages.py
          git diff -- docs/api/reference docs/reference/index.md docs/reference/function-call-graph.md docs/reference/metadata.md docs/reference/metadata > /tmp/reference-first.diff
          PYTHONPATH=src python scripts/generate_individual_function_reference_pages.py
          git diff -- docs/api/reference docs/reference/index.md docs/reference/function-call-graph.md docs/reference/metadata.md docs/reference/metadata > /tmp/reference-second.diff
          diff -u /tmp/reference-first.diff /tmp/reference-second.diff

      - name: Run focused validation
        run: |
          uv run pytest \
            tests/unit/test_function_catalogue.py \
            tests/unit/test_generated_docs_links.py \
            tests/unit/test_metadata.py \
            tests/unit/test_metadata_reference_generator.py \
            tests/unit/test_metadata_writer_ownership.py \
            tests/unit/test_public_function_call_flows.py

      - name: Commit only actual final diffs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/agent-finalize-retired-widget-pr.yml
          git add -u -- \
            .github/workflows/agent-finalize-retired-widget-pr.yml \
            scripts/reference_docs_metadata.py \
            docs/reference/_data/generated-artifacts.json \
            docs/api/reference \
            docs/reference/index.md \
            docs/reference/function-call-graph.md \
            docs/reference/metadata.md \
            docs/reference/metadata
          if git diff --cached --quiet; then
            echo 'No final changes to commit'
            exit 0
          fi
          git commit -m "docs: finalize retired widget references"
          git push origin HEAD:agent/remove-unused-guardrail-review-widget
