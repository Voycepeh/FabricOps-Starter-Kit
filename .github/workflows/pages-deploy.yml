name: Deploy FabricOps docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DISABLE_MKDOCS_2_WARNING: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install docs dependencies
        run: python -m pip install -e ".[docs]"

      - name: Build docs site
        run: python -m mkdocs build

      - name: Deploy site to gh-pages branch
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin gh-pages || true

          temp_dir="$(mktemp -d)"

          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git worktree add "$temp_dir" origin/gh-pages
          else
            git worktree add --detach "$temp_dir"
            (
              cd "$temp_dir"
              git switch --orphan gh-pages
              git rm -rf . >/dev/null 2>&1 || true
            )
          fi

          rsync -a --delete site/ "$temp_dir"/
          touch "$temp_dir/.nojekyll"

          (
            cd "$temp_dir"
            git add -A
            if git diff --cached --quiet; then
              echo "No changes to deploy."
            else
              git commit -m "Deploy docs from ${GITHUB_SHA}"
              git push origin HEAD:gh-pages
            fi
          )

          git worktree remove "$temp_dir" --force
