name: Deploy FabricOps documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install locked documentation dependencies
        run: uv sync --frozen --extra docs

      - name: Regenerate generated reference artifacts
        shell: bash
        run: |
          set -euo pipefail
          source .venv/bin/activate
          PYTHONPATH=src python scripts/generate_individual_function_reference_pages.py
          python scripts/normalize_guided_demo_links.py

      - name: Build strict documentation
        env:
          FABRICOPS_GIT_SHA: ${{ github.sha }}
        run: uv run mkdocs build --strict

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy documentation to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
