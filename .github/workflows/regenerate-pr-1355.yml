name: Regenerate PR 1355 artifacts

on:
  push:
    branches:
      - fix/warehouse-first-write-preflight

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/warehouse-first-write-preflight
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: uv sync --frozen --extra docs --extra dev
      - name: Generate owned artifacts twice
        shell: bash
        run: |
          set -euo pipefail
          source .venv/bin/activate
          export PYTHONPATH=src
          python scripts/generate_public_function_call_flows_json.py
          python scripts/generate_individual_function_reference_pages.py
          git diff --binary > /tmp/first.diff
          export FABRICOPS_PRESERVE_GENERATED_ARTIFACT_TIMESTAMPS=1
          python scripts/generate_public_function_call_flows_json.py
          python scripts/generate_individual_function_reference_pages.py
          git diff --binary > /tmp/second.diff
          cmp /tmp/first.diff /tmp/second.diff
      - name: Commit generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/reference/_data/public-function-call-flows.json
          git add docs/reference/_data/generated-artifacts.json
          git add docs/api/reference
          git add docs/reference/index.md
          git add docs/reference/function-call-graph.md
          git rm .github/workflows/regenerate-pr-1355.yml
          git commit -m "Regenerate affected reference artifacts"
          git push origin HEAD:fix/warehouse-first-write-preflight
