name: Render Remotion product POC

on:
  pull_request:
    paths:
      - "video/remotion/product-poc/**"
      - ".github/workflows/render-remotion-product-poc.yml"
  workflow_dispatch:
    inputs:
      composition:
        description: "Composition to render"
        required: true
        default: "hero"
        type: choice
        options:
          - hero
          - part2

permissions:
  contents: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      hero: ${{ steps.filter.outputs.hero }}
      part2: ${{ steps.filter.outputs.part2 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect affected composition
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            hero:
              - 'video/remotion/product-poc/src/FabricOpsHero.tsx'
              - 'video/remotion/product-poc/src/OpeningPlatform.tsx'
              - 'video/remotion/product-poc/src/FabricOpsReveal.tsx'
              - 'video/remotion/product-poc/src/NotebookJourney.tsx'
              - 'video/remotion/product-poc/src/LifecycleScene.tsx'
              - 'video/remotion/product-poc/src/videoConfig.ts'
              - 'video/remotion/product-poc/src/videoTuning.ts'
              - 'video/remotion/product-poc/FabricOps_narration_master_numbered.m4a'
              - 'video/remotion/product-poc/package.json'
              - 'video/remotion/product-poc/package-lock.json'
              - '.github/workflows/render-remotion-product-poc.yml'
            part2:
              - 'video/remotion/product-poc/src/FabricOpsPart2.tsx'
              - 'video/remotion/product-poc/src/GuidedDemoJourney.tsx'
              - 'video/remotion/product-poc/package.json'
              - 'video/remotion/product-poc/package-lock.json'
              - '.github/workflows/render-remotion-product-poc.yml'

  render-hero:
    needs: changes
    if: |
      (github.event_name == 'pull_request' && needs.changes.outputs.hero == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.composition == 'hero')
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Stage narration asset for Remotion
        run: |
          mkdir -p video/remotion/product-poc/public/audio
          cp video/remotion/product-poc/FabricOps_narration_master_numbered.m4a video/remotion/product-poc/public/audio/FabricOps_narration_master_numbered.m4a

      - name: Install dependencies
        working-directory: video/remotion/product-poc
        run: npm install

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Type-check composition
        working-directory: video/remotion/product-poc
        run: npm run typecheck

      - name: Render review video
        working-directory: video/remotion/product-poc
        run: npm run render

      - name: Verify narration is audible
        run: |
          ffmpeg -i video/remotion/product-poc/out/fabricops-product-poc.mp4 -map 0:a:0 -af volumedetect -f null - 2> /tmp/volumedetect.log
          cat /tmp/volumedetect.log
          mean_volume=$(sed -n 's/.*mean_volume: \([-0-9.]*\) dB.*/\1/p' /tmp/volumedetect.log | tail -1)
          python - "$mean_volume" <<'PY'
          import sys
          mean_volume = float(sys.argv[1])
          if mean_volume < -45:
              raise SystemExit(f"Narration is effectively silent: mean volume {mean_volume} dB")
          print(f"Narration verified at mean volume {mean_volume} dB")
          PY

      - name: Upload review video
        uses: actions/upload-artifact@v4
        with:
          name: fabricops-product-poc
          path: video/remotion/product-poc/out/fabricops-product-poc.mp4
          if-no-files-found: error

      - name: Sync rendered homepage video
        if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          cp video/remotion/product-poc/out/fabricops-product-poc.mp4 docs/assets/FabricOps_Overview_Video_web.mp4
          if git diff --quiet -- docs/assets/FabricOps_Overview_Video_web.mp4; then
            echo "Homepage video is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/FabricOps_Overview_Video_web.mp4
          git commit -m "video: update homepage overview render"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

  render-part2:
    needs: changes
    if: |
      (github.event_name == 'pull_request' && needs.changes.outputs.part2 == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.composition == 'part2')
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: video/remotion/product-poc
        run: npm install

      - name: Type-check composition
        working-directory: video/remotion/product-poc
        run: npm run typecheck

      - name: Render Part 2 review video
        working-directory: video/remotion/product-poc
        run: npm run render:part2

      - name: Upload Part 2 review video
        uses: actions/upload-artifact@v4
        with:
          name: fabricops-part2
          path: video/remotion/product-poc/out/fabricops-part2.mp4
          if-no-files-found: error
