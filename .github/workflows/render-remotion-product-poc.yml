name: Render Remotion product POC

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: video/remotion/product-poc

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Render FabricOpsHero
        run: npm run render

      - name: Upload rendered MP4
        uses: actions/upload-artifact@v4
        with:
          name: fabricops-product-poc
          path: video/remotion/product-poc/out/fabricops-product-poc.mp4
          if-no-files-found: error
          retention-days: 14
