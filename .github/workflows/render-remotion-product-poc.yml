name: Render Remotion product POC

on:
  pull_request:
    paths:
      - "video/remotion/product-poc/**"
      - ".github/workflows/render-remotion-product-poc.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: video/remotion/product-poc
        run: npm install

      - name: Type-check composition
        working-directory: video/remotion/product-poc
        run: npm run typecheck

      - name: Render review video
        working-directory: video/remotion/product-poc
        run: npm run render

      - name: Upload review video
        uses: actions/upload-artifact@v4
        with:
          name: fabricops-product-poc
          path: video/remotion/product-poc/out/fabricops-product-poc.mp4
          if-no-files-found: error

      - name: Sync rendered homepage video
        if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          cp video/remotion/product-poc/out/fabricops-product-poc.mp4 docs/assets/FabricOps_Overview_Video_web.mp4
          if git diff --quiet -- docs/assets/FabricOps_Overview_Video_web.mp4; then
            echo "Homepage video is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/FabricOps_Overview_Video_web.mp4
          git commit -m "video: update homepage overview render"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
