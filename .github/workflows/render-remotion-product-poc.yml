name: Render Remotion product POC

on:
  pull_request:
    paths:
      - "video/remotion/product-poc/**"
      - ".github/workflows/render-remotion-product-poc.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: video/remotion/product-poc
        run: npm install

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Type-check composition
        working-directory: video/remotion/product-poc
        run: npm run typecheck

      - name: Generate review guide
        working-directory: video/remotion/product-poc
        run: |
          npm run motion:guide
          git diff --exit-code -- MOTION_REVIEW_GUIDE.md

      - name: Render enhanced Part 1
        working-directory: video/remotion/product-poc
        run: npm run motion:render

      - name: Verify enhanced narration is audible
        run: |
          ffmpeg -i video/remotion/product-poc/out/motion-experiment/FabricOps-Part1-Motion-Full.mp4 -map 0:a:0 -af volumedetect -f null - 2> /tmp/volumedetect.log
          cat /tmp/volumedetect.log
          mean_volume=$(sed -n 's/.*mean_volume: \([-0-9.]*\) dB.*/\1/p' /tmp/volumedetect.log | tail -1)
          python - "$mean_volume" <<'PY'
          import sys
          mean_volume = float(sys.argv[1])
          if mean_volume < -45:
              raise SystemExit(f"Narration is effectively silent: mean volume {mean_volume} dB")
          print(f"Narration verified at mean volume {mean_volume} dB")
          PY

      - name: Generate enhanced Part 1 contact sheets
        working-directory: video/remotion/product-poc
        run: npm run motion:sheets

      - name: Upload enhanced Part 1 review package
        uses: actions/upload-artifact@v4
        with:
          name: fabricops-part1-motion-full
          path: |
            video/remotion/product-poc/out/motion-experiment/FabricOps-Part1-Motion-Full.mp4
            video/remotion/product-poc/out/motion-experiment/contact-sheets/**/*.png
            video/remotion/product-poc/MOTION_REVIEW_GUIDE.md
          if-no-files-found: error
