name: Apply metadata reference fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install locked dependencies
        run: uv sync --frozen --extra docs --extra dev

      - name: Apply focused metadata reference changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          generator_path = Path("scripts/generate_individual_function_reference_pages.py")
          source = generator_path.read_text(encoding="utf-8")
          start = source.index("def _metadata_index_relationships(")
          end = source.index("\ndef _metadata_column_counts(", start)
          replacement = '''def _metadata_index_downstream_tables(
              table_name: str,
              table_models: dict[str, dict[str, Any]],
          ) -> list[str]:
              """Return unique downstream tables that reference one metadata table."""
              downstream_tables: list[str] = []
              seen: set[str] = set()
              for child_table, child_model in table_models.items():
                  if child_table == table_name:
                      continue
                  for foreign_key in child_model.get("foreign_keys", []):
                      if foreign_key["referenced_table"] != table_name:
                          continue
                      if child_table not in seen:
                          seen.add(child_table)
                          downstream_tables.append(child_table)
                      break
              return downstream_tables


          def render_metadata_reference_index(
              table_models: dict[str, dict[str, Any]],
              reference_order: list[str],
              table_purposes: dict[str, str],
          ) -> str:
              """Render the compact, clickable metadata model landing page."""
              lines = [
                  "# List of Metadata Tables",
                  "",
                  *parse_metadata_reference_overview(),
                  "",
                  "## Metadata tables",
                  "",
                  "<style>",
                  ".metadata-table-grid { display: grid; grid-template-columns: 1fr; gap: 1rem; margin: 1.25rem 0 2rem; }",
                  ".metadata-table-card { display: flex; flex-direction: column; gap: .55rem; padding: 1rem 1.1rem; border: 1px solid rgba(0, 150, 136, .24); border-radius: .7rem; background: rgba(0, 150, 136, .055); color: inherit !important; text-decoration: none !important; box-shadow: 0 1px 2px rgba(0, 0, 0, .04); transition: border-color .15s ease, background .15s ease, transform .15s ease; }",
                  ".metadata-table-card:hover { border-color: rgba(0, 150, 136, .48); background: rgba(0, 150, 136, .085); transform: translateY(-1px); }",
                  ".metadata-table-card__header { display: flex; align-items: flex-start; justify-content: space-between; gap: .75rem; }",
                  ".metadata-table-card__title { font-family: var(--md-code-font-family); font-size: .82rem; font-weight: 700; color: var(--md-primary-fg-color); overflow-wrap: anywhere; }",
                  ".metadata-table-card__arrow { flex: 0 0 auto; font-size: 1rem; color: var(--md-primary-fg-color); }",
                  ".metadata-table-card__purpose { line-height: 1.45; }",
                  ".metadata-table-card__meta { display: grid; grid-template-columns: 6.4rem minmax(0, 1fr); gap: .5rem; align-items: start; font-size: .84rem; line-height: 1.4; }",
                  ".metadata-table-card__meta strong, .metadata-table-card__relationships-label { color: var(--md-default-fg-color--light); font-size: .74rem; letter-spacing: .02em; text-transform: uppercase; }",
                  ".metadata-table-card__relationships { display: flex; flex-direction: column; gap: .35rem; padding-top: .15rem; }",
                  ".metadata-table-card__relationships-header { display: flex; align-items: baseline; justify-content: space-between; gap: .75rem; }",
                  ".metadata-table-card__relationships-count { font-size: .74rem; color: var(--md-default-fg-color--light); white-space: nowrap; }",
                  ".metadata-table-card__relationship-summary { display: grid; grid-template-columns: 3.5rem minmax(0, 1fr); gap: .5rem; align-items: start; }",
                  ".metadata-table-card__relationship-list { display: flex; flex-wrap: wrap; gap: .35rem .5rem; min-width: 0; }",
                  ".metadata-table-card__relationship-list code { font-size: .74rem; overflow-wrap: anywhere; }",
                  ".metadata-table-card__cardinality { font-weight: 700; color: var(--md-primary-fg-color); white-space: nowrap; }",
                  ".metadata-table-card__empty { font-size: .8rem; color: var(--md-default-fg-color--light); }",
                  "@media (max-width: 720px) { .metadata-table-grid { gap: .8rem; } .metadata-table-card { padding: .9rem 1rem; } .metadata-table-card__meta { grid-template-columns: 1fr; gap: .15rem; } .metadata-table-card__relationship-summary { grid-template-columns: 3rem minmax(0, 1fr); } }",
                  "</style>",
                  "",
                  '<div class="metadata-table-grid">',
              ]
              for table_name in reference_order:
                  slug = table_name.lower()
                  model = table_models[table_name]
                  purpose = _metadata_table_purpose(table_name, table_purposes)
                  downstream_tables = _metadata_index_downstream_tables(table_name, table_models)
                  downstream_count = len(downstream_tables)
                  downstream_label = plural_word(downstream_count, "table", "tables")
                  lines.extend([
                      f'<a class="metadata-table-card" href="{slug}/" aria-label="Open {html_escape(table_name)} schema">',
                      '  <span class="metadata-table-card__header">',
                      f'    <span class="metadata-table-card__title">{html_escape(table_name)}</span>',
                      '    <span class="metadata-table-card__arrow" aria-hidden="true">→</span>',
                      '  </span>',
                      f'  <span class="metadata-table-card__purpose">{html_escape(purpose)}</span>',
                      '  <span class="metadata-table-card__meta">',
                      '    <strong>Grain</strong>',
                      f'    <span>{html_escape(str(model["grain"]))}</span>',
                      '  </span>',
                      '  <span class="metadata-table-card__meta">',
                      '    <strong>Primary key</strong>',
                      f'    <span>{_metadata_index_key_html(model["primary_key"])}</span>',
                      '  </span>',
                      '  <span class="metadata-table-card__relationships">',
                      '    <span class="metadata-table-card__relationships-header">',
                      '      <span class="metadata-table-card__relationships-label">Used by</span>',
                      f'      <span class="metadata-table-card__relationships-count">{downstream_count} {downstream_label}</span>',
                      '    </span>',
                  ])
                  if downstream_tables:
                      lines.extend([
                          '    <span class="metadata-table-card__relationship-summary">',
                          '      <span class="metadata-table-card__cardinality">1 → N</span>',
                          '      <span class="metadata-table-card__relationship-list">',
                      ])
                      for downstream_table in downstream_tables:
                          lines.append(f'        <code>{html_escape(downstream_table)}</code>')
                      lines.extend([
                          '      </span>',
                          '    </span>',
                      ])
                  else:
                      lines.append('    <span class="metadata-table-card__empty">No downstream tables.</span>')
                  lines.extend(['  </span>', '</a>'])
              lines.extend(['</div>', ''])
              return "\\n".join(lines).rstrip() + "\\n"


          '''
          generator_path.write_text(source[:start] + replacement + source[end + 1:], encoding="utf-8")

          test_path = Path("tests/unit/test_metadata_reference_generator.py")
          test_source = test_path.read_text(encoding="utf-8")
          test_start = test_source.index('    assert \'<div class="grid cards"\' not in first_landing')
          test_end = test_source.index("\n    generator.generate_metadata_reference_pages()", test_start)
          test_replacement = '''    assert '<div class="grid cards"' not in first_landing
              assert '<div class="metadata-table-grid">' in first_landing
              assert "grid-template-columns: 1fr;" in first_landing
              assert "repeat(2, minmax(0, 1fr))" not in first_landing
              assert "1 → N" in first_landing
              assert "Used by" in first_landing
              assert "View full schema" not in first_landing
              assert "## Data Agreement versus Data Contract" not in first_landing
              assert "METADATA_DATA_CATALOGUE.table_id" not in first_landing
              assert "metadata/metadata_data_profiled_frequency" not in first_landing
              for table_name in CANONICAL_METADATA_TABLES:
                  slug = table_name.lower()
                  assert first_landing.count(f'href="{slug}/"') == 1
                  assert first_landing.count(f'>{table_name}</span>') == 1
                  page = first_pages[f"{slug}.md"]
                  assert "## Model" in page
                  assert "**Grain:**" in page
                  assert "**Primary key:**" in page
                  assert "**Relationships:**" in page
                  assert "## Implemented schema" in page
                  assert "| Column | Data type | Managed by | Description |" in page

              catalogue_card = first_landing.split(
                  'aria-label="Open METADATA_DATA_CATALOGUE schema">', 1
              )[1].split("</a>", 1)[0]
              assert catalogue_card.count(">METADATA_DATA_PROFILED</code>") == 1

              profiled_card = first_landing.split(
                  'aria-label="Open METADATA_DATA_PROFILED schema">', 1
              )[1].split("</a>", 1)[0]
              assert "METADATA_DATA_CATALOGUE" not in profiled_card
              assert ">METADATA_DATA_PROFILED_FREQUENCY</code>" in profiled_card
              assert 'href="metadata_data_profiled_frequency/"' in first_landing
          '''
          test_path.write_text(
              test_source[:test_start] + test_replacement + test_source[test_end:],
              encoding="utf-8",
          )
          PY

      - name: Regenerate metadata reference output
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src uv run python scripts/generate_individual_function_reference_pages.py
          first_hash="$(sha256sum docs/reference/metadata.md | awk '{print $1}')"
          PYTHONPATH=src uv run python scripts/generate_individual_function_reference_pages.py
          second_hash="$(sha256sum docs/reference/metadata.md | awk '{print $1}')"
          test "${first_hash}" = "${second_hash}"
          git checkout -- docs/reference/_data/generated-artifacts.json

      - name: Run focused tests
        run: uv run pytest tests/unit/test_metadata_reference_generator.py

      - name: Verify focused diff
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess

          allowed = {
              ".github/workflows/apply_metadata_reference_fix.yml",
              "docs/reference/metadata.md",
              "scripts/generate_individual_function_reference_pages.py",
              "tests/unit/test_metadata_reference_generator.py",
          }
          changed = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines())
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit(f"Unexpected generated changes: {sorted(unexpected)}")
          PY

      - name: Commit focused result and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply_metadata_reference_fix.yml
          git add docs/reference/metadata.md scripts/generate_individual_function_reference_pages.py tests/unit/test_metadata_reference_generator.py
          git commit -m "Fix metadata reference card layout and links"
          git push origin HEAD:fix/metadata-reference-card-summary
