name: Regenerate PR artifacts

on:
  push:
    branches:
      - cleanup/remove-obsolete-pii-token-map-writer

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: cleanup/remove-obsolete-pii-token-map-writer
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install locked dependencies
        run: uv sync --frozen --extra docs --extra dev

      - name: Remove obsolete token-map helper
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/fabricops_kit/pipeline/shared.py')
          text = path.read_text()
          start = text.index('\ndef build_token_map_frame(')
          end = text.index('\nDQ_RULE_TYPES = [', start)
          path.write_text(text[:start] + '\n' + text[end:])
          PY

      - name: Regenerate public call-flow contract
        run: PYTHONPATH=src uv run python scripts/generate_public_function_call_flows_json.py

      - name: Regenerate function references
        run: |
          PYTHONPATH=src uv run python scripts/generate_individual_function_reference_pages.py
          PYTHONPATH=src uv run python scripts/generate_individual_function_reference_pages.py

      - name: Commit generated outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/fabricops_kit/pipeline/shared.py docs/reference/_data/public-function-call-flows.json docs/reference/_data/generated-artifacts.json docs/api/reference docs/reference/index.md docs/reference/function-call-graph.md docs/reference/call-graph.md || true
          git diff --cached --quiet && exit 0
          git commit -m 'Regenerate affected reference artifacts [skip ci]'
          git push origin HEAD:cleanup/remove-obsolete-pii-token-map-writer
