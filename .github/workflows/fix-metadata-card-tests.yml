name: Fix metadata card tests

on:
  push:
    branches:
      - docs/metadata-reference-cards

permissions:
  contents: write

jobs:
  fix-tests:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/metadata-reference-cards
          fetch-depth: 0

      - name: Update tests for metadata cards
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/unit/test_metadata_reference_generator.py')
          text = path.read_text(encoding='utf-8')
          old = '''    assert '<div class="grid cards"' not in first_landing
    for table_name in CANONICAL_METADATA_TABLES:
        slug = table_name.lower()
        assert first_landing.count(f"## [{table_name}](metadata/{slug}.md)") == 1
        page = first_pages[f"{slug}.md"]
'''
          new = '''    assert '<div class="grid cards"' not in first_landing
    assert '<div class="metadata-table-grid">' in first_landing
    assert "View full schema" not in first_landing
    assert "## Data Agreement versus Data Contract" not in first_landing
    for table_name in CANONICAL_METADATA_TABLES:
        slug = table_name.lower()
        assert first_landing.count(f'href="metadata/{slug}.md"') == 1
        assert first_landing.count(f'>{table_name}</span>') == 1
        page = first_pages[f"{slug}.md"]
'''
          if old not in text:
              raise SystemExit('metadata generator test block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          path = Path('tests/unit/test_reference_agent_docs.py')
          text = path.read_text(encoding='utf-8')
          old = '''    assert text.index("FabricOps metadata tables describe") < text.index(image_reference)
    assert text.index(image_reference) < text.index("## [METADATA_DATA_STEWARD]")
'''
          new = '''    assert text.index("FabricOps metadata tables describe") < text.index(image_reference)
    assert text.index(image_reference) < text.index('<div class="metadata-table-grid">')
    assert text.index(image_reference) < text.index("METADATA_DATA_STEWARD")
'''
          if old not in text:
              raise SystemExit('metadata overview ordering assertion not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Run focused checks
        run: |
          uv run ruff check tests/unit/test_metadata_reference_generator.py tests/unit/test_reference_agent_docs.py
          uv run pytest tests/unit/test_metadata_reference_generator.py tests/unit/test_reference_agent_docs.py -q
          git diff --check

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/fix-metadata-card-tests.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/unit/test_metadata_reference_generator.py tests/unit/test_reference_agent_docs.py .github/workflows/fix-metadata-card-tests.yml
          git commit -m 'Update metadata reference card tests'
          git push origin HEAD:docs/metadata-reference-cards
