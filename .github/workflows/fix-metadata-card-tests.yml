name: Fix metadata card tests

"on":
  push:
    branches:
      - docs/metadata-reference-cards

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/metadata-reference-cards
          fetch-depth: 0
      - name: Patch test
        shell: bash
        run: |
          python -c 'from pathlib import Path; p=Path("tests/unit/test_reference_agent_docs.py"); s=p.read_text(); old="    assert text.index(\"image_reference\")"'
          python - <<'PY'
          from pathlib import Path
          p = Path("tests/unit/test_reference_agent_docs.py")
          s = p.read_text(encoding="utf-8")
          old = '    assert text.index(image_reference) < text.index("## [METADATA_DATA_STEWARD]")\n'
          new = '    assert text.index(image_reference) < text.index(\'<div class="metadata-table-grid">\')\n    assert text.index(image_reference) < text.index("METADATA_DATA_STEWARD")\n'
          if old not in s:
              raise SystemExit("old assertion not found")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Commit
        run: |
          rm .github/workflows/fix-metadata-card-tests.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/unit/test_reference_agent_docs.py .github/workflows/fix-metadata-card-tests.yml
          git commit -m "Update metadata reference overview test"
          git push origin HEAD:docs/metadata-reference-cards
