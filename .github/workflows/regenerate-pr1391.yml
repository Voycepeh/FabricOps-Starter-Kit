name: Temporary regenerate PR 1391 artifacts

on:
  push:
    branches:
      - perf/data-contract-session-state-save-once
    paths:
      - .github/workflows/regenerate-pr1391.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: perf/data-contract-session-state-save-once
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Regenerate owned artifacts
        run: |
          PYTHONPATH=src uv run python scripts/generate_public_function_call_flows_json.py
          PYTHONPATH=src uv run python scripts/generate_individual_function_reference_pages.py
          git diff > /tmp/first-generation.diff
          FABRICOPS_PRESERVE_GENERATED_ARTIFACT_TIMESTAMPS=1 PYTHONPATH=src uv run python scripts/generate_individual_function_reference_pages.py
          git diff > /tmp/second-generation.diff
          cmp /tmp/first-generation.diff /tmp/second-generation.diff
      - name: Commit generated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/reference/_data/public-function-call-flows.json
          git add docs/reference/_data/generated-artifacts.json
          git add docs/api/reference
          git add docs/reference/index.md
          if [ -f docs/reference/function-call-graph.md ]; then git add docs/reference/function-call-graph.md; fi
          if [ -f docs/reference/call-graph.md ]; then git add docs/reference/call-graph.md; fi
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "chore: regenerate Data Contract references"
          git push origin HEAD:perf/data-contract-session-state-save-once
