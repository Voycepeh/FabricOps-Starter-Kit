name: Temporary release navigation fix

on:
  push:
    branches:
      - release/0.2.0-finalize

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: release/0.2.0-finalize
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: uv sync --frozen --extra docs --extra dev
      - name: Regenerate release navigation
        run: PYTHONPATH=src uv run python scripts/release_navigation.py
      - name: Validate affected release tests
        run: uv run pytest tests/unit/test_release_navigation.py tests/unit/test_release_preparing_state.py tests/unit/test_release_ready.py
      - name: Commit generated navigation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-release-nav-fix.yml
          git add mkdocs.yml tests/unit/test_release_preparing_state.py
          git commit -m "Regenerate 0.2.0 release navigation"
          git push origin HEAD:release/0.2.0-finalize
