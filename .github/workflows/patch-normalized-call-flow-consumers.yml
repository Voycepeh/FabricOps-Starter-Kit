name: Patch normalized call-flow consumers

on:
  push:
    branches:
      - agent/normalize-call-flow-json
    paths:
      - .github/workflows/patch-normalized-call-flow-consumers.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update agent and test consumers
        run: |
          python - <<'PY'
          from pathlib import Path

          agents = Path('AGENTS.md')
          text = agents.read_text(encoding='utf-8')
          old = '''## Public call-flow architecture contract

`docs/reference/_data/public-function-call-flows.json` is the committed public callable architecture contract and compact lookup index for agents.

Before function-level source changes, inspect the relevant entry for:

- callable scope and owner file
- direct and transitive callees
- helper reachability
- source locations
- architecture violations
- cleanup signals
- defined-but-not-used functions

Source code, exports, reference metadata, and generators remain authoritative. Do not manually edit the JSON as a fix.
'''
          new = '''## Public call-flow architecture contract

`docs/reference/_data/public-function-call-flows.json` is the committed normalized public callable architecture contract and compact lookup index for agents. It stores each callable once in `defined_functions`, public-root metrics and lifecycle in `public_functions`, and each resolved direct caller-to-callee edge once in `relationships`.

Before function-level source changes:

- find the callable by `qualified_name` in `defined_functions` for owner file, source location, classification, inbound callers, source references, and cleanup signals
- inspect `public_functions` when public-root width, scope, depth, files touched, lifecycle, or Live impact matters
- inspect `relationships` where `caller_qualified_name` matches the current callable for direct callees
- follow those relationships recursively only when transitive helper reachability is needed
- keep `inbound_callers` and `inbound_source_references` distinct; a package import or loaded-symbol reference is not a call edge
- use the dashboard when a fully expanded interactive call tree is useful; the dashboard reconstructs that view from the same normalized relationships at runtime

Source code, exports, reference metadata, and generators remain authoritative. Do not manually edit the JSON as a fix, and do not require agents to parse the generated dashboard HTML to understand the graph.
'''
          if old not in text:
              raise SystemExit('AGENTS call-flow block not found')
          agents.write_text(text.replace(old, new, 1), encoding='utf-8')

          test_path = Path('tests/unit/test_profile_and_register_table.py')
          text = test_path.read_text(encoding='utf-8')
          old = '''def test_profile_registration_call_flow_records_shared_frequency_implementation():
    payload = json.loads(Path("docs/reference/_data/public-function-call-flows.json").read_text(encoding="utf-8"))
    flow = next(row for row in payload["public_functions"] if row["function_name"] == "profile_and_register_table")
    direct_callees = {
        row["qualified_name"]: row for row in flow["flow"] if row["parent_qualified_name"] == flow["qualified_name"]
    }
    assert "fabricops_kit.pipeline.shared.build_profile_dataframe" in direct_callees
    assert "fabricops_kit.pipeline.shared.build_frequency_distribution_dataframe" in direct_callees
'''
          new = '''def test_profile_registration_call_flow_records_shared_frequency_implementation():
    payload = json.loads(Path("docs/reference/_data/public-function-call-flows.json").read_text(encoding="utf-8"))
    root = next(row for row in payload["public_functions"] if row["function_name"] == "profile_and_register_table")
    direct_callees = {
        row["callee_qualified_name"]: row
        for row in payload["relationships"]
        if row["caller_qualified_name"] == root["qualified_name"]
    }
    assert "fabricops_kit.pipeline.shared.build_profile_dataframe" in direct_callees
    assert "fabricops_kit.pipeline.shared.build_frequency_distribution_dataframe" in direct_callees
'''
          if old not in text:
              raise SystemExit('profile call-flow test block not found')
          test_path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit consumer updates
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add AGENTS.md tests/unit/test_profile_and_register_table.py
          git diff --cached --quiet && exit 0
          git commit -m "Wire agents and tests to normalized call-flow graph"
          git push
