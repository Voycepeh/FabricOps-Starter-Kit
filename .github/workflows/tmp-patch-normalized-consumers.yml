name: Temporary normalized consumer patch

on:
  push:
    branches:
      - agent/normalize-call-flow-json
    paths:
      - scripts/tmp_patch_normalized_call_flow_consumers.py
      - .github/workflows/tmp-patch-normalized-consumers.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/tmp_patch_normalized_call_flow_consumers.py
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add AGENTS.md tests/unit/test_profile_and_register_table.py
          git diff --cached --quiet && exit 0
          git commit -m "Wire agents and tests to normalized call-flow graph"
          git push
