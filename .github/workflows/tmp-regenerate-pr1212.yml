name: Temporary regenerate PR 1212

on:
  push:
    branches:
      - feat/pii-token-map-support

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install dependencies
        run: uv sync --frozen --extra docs --extra dev
      - name: Regenerate call-flow contract
        run: |
          source .venv/bin/activate
          PYTHONPATH=src python scripts/generate_public_function_call_flows_json.py
      - name: Regenerate function references twice
        run: |
          source .venv/bin/activate
          PYTHONPATH=src python scripts/generate_individual_function_reference_pages.py
          git diff -- . ':(exclude)docs/reference/_data/generated-artifacts.json' > /tmp/first.diff
          PYTHONPATH=src python scripts/generate_individual_function_reference_pages.py
          git diff -- . ':(exclude)docs/reference/_data/generated-artifacts.json' > /tmp/second.diff
          diff -u /tmp/first.diff /tmp/second.diff
      - name: Collect changed generated artifacts
        run: |
          mkdir -p generated
          git diff --name-only | while read path; do
            mkdir -p "generated/$(dirname "$path")"
            cp "$path" "generated/$path"
          done
          git diff --name-only > generated/changed-files.txt
      - name: Upload generated files
        uses: actions/upload-artifact@v4
        with:
          name: pr1212-generated
          path: generated
          if-no-files-found: error
