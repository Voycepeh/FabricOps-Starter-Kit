name: Agent Consolidate Guardrail Shared Modules

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/consolidate-guardrail-shared
          fetch-depth: 1
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv sync --locked --all-groups

      - name: Consolidate Guardrail implementation into package shared modules
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast
          import copy
          import re

          root = Path('.')
          pipeline = root / 'src/fabricops_kit/pipeline'
          widgets = root / 'src/fabricops_kit/widgets'

          def strip_future(text: str) -> str:
              return re.sub(r'^from __future__ import annotations\n+', '', text, flags=re.M)

          def remove_top_function(source: str, function_name: str) -> str:
              tree = ast.parse(source)
              lines = source.splitlines(keepends=True)
              targets = [
                  node
                  for node in tree.body
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
                  and node.name == function_name
              ]
              for node in reversed(targets):
                  del lines[node.lineno - 1:node.end_lineno]
              return ''.join(lines)

          def remove_imports_from_module(source: str, module_name: str) -> str:
              tree = ast.parse(source)
              lines = source.splitlines(keepends=True)
              targets = [
                  node
                  for node in tree.body
                  if isinstance(node, ast.ImportFrom) and node.module == module_name
              ]
              for node in sorted(targets, key=lambda item: item.lineno, reverse=True):
                  del lines[node.lineno - 1:node.end_lineno]
              return ''.join(lines)

          def target_names(target):
              if isinstance(target, ast.Name):
                  return {target.id}
              if isinstance(target, (ast.Tuple, ast.List)):
                  names = set()
                  for item in target.elts:
                      names.update(target_names(item))
                  return names
              return set()

          def node_bound_names(node):
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):
                  return {node.name}
              if isinstance(node, ast.Assign):
                  names = set()
                  for target in node.targets:
                      names.update(target_names(target))
                  return names
              if isinstance(node, ast.AnnAssign):
                  return target_names(node.target)
              if isinstance(node, ast.Import):
                  return {alias.asname or alias.name.split('.')[0] for alias in node.names}
              if isinstance(node, ast.ImportFrom):
                  return {alias.asname or alias.name for alias in node.names}
              return set()

          def top_level_names(source: str):
              names = set()
              for node in ast.parse(source).body:
                  names.update(node_bound_names(node))
              return names

          def append_unique_symbols(base: str, source: str, *, section_title: str) -> str:
              seen = top_level_names(base)
              tree = ast.parse(source)
              pieces = []

              for index, node in enumerate(tree.body):
                  if (
                      index == 0
                      and isinstance(node, ast.Expr)
                      and isinstance(node.value, ast.Constant)
                      and isinstance(node.value.value, str)
                  ):
                      continue
                  if isinstance(node, ast.ImportFrom) and node.module == '__future__':
                      continue

                  if isinstance(node, ast.Import):
                      kept = []
                      for alias in node.names:
                          bound = alias.asname or alias.name.split('.')[0]
                          if bound not in seen:
                              kept.append(alias)
                              seen.add(bound)
                      if kept:
                          new_node = copy.deepcopy(node)
                          new_node.names = kept
                          pieces.append(ast.unparse(new_node))
                      continue

                  if isinstance(node, ast.ImportFrom):
                      kept = []
                      for alias in node.names:
                          bound = alias.asname or alias.name
                          if bound not in seen:
                              kept.append(alias)
                              seen.add(bound)
                      if kept:
                          new_node = copy.deepcopy(node)
                          new_node.names = kept
                          pieces.append(ast.unparse(new_node))
                      continue

                  bound = node_bound_names(node)
                  if bound and bound & seen:
                      continue

                  segment = ast.get_source_segment(source, node)
                  if segment is None:
                      segment = ast.unparse(node)
                  pieces.append(segment)
                  seen.update(bound)

              if not pieces:
                  return base
              return (
                  base.rstrip()
                  + f'\n\n\n# ---------------------------------------------------------------------------\n# {section_title}\n# ---------------------------------------------------------------------------\n\n'
                  + '\n\n'.join(piece.strip() for piece in pieces if piece.strip())
                  + '\n'
              )

          legacy_path = pipeline / 'guardrails_shared.py'
          canonical_path = pipeline / 'guardrail_shared.py'
          shared_path = pipeline / 'shared.py'
          if legacy_path.exists() and canonical_path.exists():
              base = shared_path.read_text()
              legacy = strip_future(legacy_path.read_text())
              canonical = strip_future(canonical_path.read_text())

              base = remove_imports_from_module(base, 'fabricops_kit.pipeline.guardrails_shared')
              legacy = remove_imports_from_module(legacy, 'fabricops_kit.pipeline.shared')
              legacy = re.sub(
                  r'(?m)^def schema_check_core\(',
                  'def _guardrail_schema_check_base(',
                  legacy,
                  count=1,
              )

              canonical = remove_top_function(
                  canonical,
                  'resolve_change_rule_observation_columns',
              )
              canonical = canonical.replace(
                  'from fabricops_kit.pipeline import guardrails_shared as runtime\n',
                  '',
              )
              canonical = remove_imports_from_module(
                  canonical,
                  'fabricops_kit.pipeline.guardrails_shared',
              )
              canonical = canonical.replace(
                  'runtime.schema_check_core',
                  '_guardrail_schema_check_base',
              )
              canonical = canonical.replace(
                  'runtime.resolve_guardrail_change_behaviour',
                  'resolve_guardrail_change_behaviour',
              )

              merged = append_unique_symbols(
                  base,
                  legacy,
                  section_title='Guardrail shared implementation',
              )
              merged = append_unique_symbols(
                  merged,
                  canonical,
                  section_title='Canonical Guardrail rule/runtime adapters',
              )
              shared_path.write_text(merged)
              legacy_path.unlink()
              canonical_path.unlink()

          authoring_path = widgets / 'guardrail_authoring_shared.py'
          widget_shared_path = widgets / 'shared.py'
          if authoring_path.exists():
              base = widget_shared_path.read_text()
              authoring = strip_future(authoring_path.read_text())
              authoring = authoring.replace('from fabricops_kit.widgets import shared\n', '')
              authoring = authoring.replace(
                  'from fabricops_kit.pipeline.guardrail_shared import canonical_guardrail_rule_record',
                  'from fabricops_kit.pipeline.shared import canonical_guardrail_rule_record',
              )
              authoring = re.sub(r'\b_stable_json\b', '_guardrail_stable_json', authoring)
              authoring = re.sub(r'\b_coerce_rows\b', '_guardrail_coerce_rows', authoring)
              authoring = authoring.replace('shared.widget_common', 'widget_common')
              merged = append_unique_symbols(
                  base,
                  authoring,
                  section_title='Guardrail authoring shared implementation',
              )
              widget_shared_path.write_text(merged)
              authoring_path.unlink()

          for path in [
              *Path('src').rglob('*.py'),
              *Path('tests').rglob('*.py'),
              Path('scripts/reference_docs_metadata.py'),
          ]:
              if not path.exists():
                  continue
              text = path.read_text()
              text = text.replace(
                  'fabricops_kit.pipeline.guardrail_metadata',
                  'fabricops_kit.pipeline.shared',
              )
              text = text.replace(
                  'fabricops_kit.pipeline.guardrail_shared',
                  'fabricops_kit.pipeline.shared',
              )
              text = text.replace(
                  'fabricops_kit.pipeline.guardrails_shared',
                  'fabricops_kit.pipeline.shared',
              )
              text = text.replace(
                  'from fabricops_kit.widgets import guardrail_authoring_shared as authoring',
                  'from fabricops_kit.widgets import shared as authoring',
              )
              text = text.replace(
                  'from fabricops_kit.pipeline import guardrail_shared, guardrails_shared',
                  'from fabricops_kit.pipeline import shared as guardrail_shared\nguardrails_shared = guardrail_shared',
              )
              path.write_text(text)

          owner_test = Path('tests/contract/test_public_owner_file_pattern.py')
          text = owner_test.read_text()
          for name in (
              '    "guardrail_shared.py",\n',
              '    "guardrails_shared.py",\n',
              '    "guardrail_authoring_shared.py",\n',
          ):
              text = text.replace(name, '')
          owner_test.write_text(text)
          PY

      - name: Lint transformed source
        run: |
          uv run --with ruff ruff check --fix src tests scripts/reference_docs_metadata.py
          uv run --with ruff ruff check src tests scripts/reference_docs_metadata.py

      - name: Run focused Guardrail tests
        run: |
          uv run pytest -q \
            tests/unit/test_guardrail_metadata_contract.py \
            tests/unit/test_widget_author_guardrails.py \
            tests/unit/test_widget_author_dq_rules.py \
            tests/contract/test_public_owner_file_pattern.py

      - name: Generate owned artifacts
        run: |
          uv run env PYTHONPATH=src python scripts/generate_public_function_call_flows_json.py
          uv run env PYTHONPATH=src python scripts/generate_individual_function_reference_pages.py

      - name: Capture first generated state
        run: |
          git diff --binary -- scripts/reference_docs_metadata.py docs/api/reference docs/reference/index.md docs/reference/function-call-graph.md docs/reference/metadata.md docs/reference/metadata > /tmp/generated-first.diff
          python - <<'PY'
          import json
          from pathlib import Path

          def normalized(path):
              value = json.loads(Path(path).read_text())
              def clean(obj):
                  if isinstance(obj, dict):
                      return {k: clean(v) for k, v in obj.items() if not k.startswith('generated_at')}
                  if isinstance(obj, list):
                      return [clean(v) for v in obj]
                  return obj
              return json.dumps(clean(value), sort_keys=True, separators=(',', ':'))

          Path('/tmp/callflow-first.json').write_text(
              normalized('docs/reference/_data/public-function-call-flows.json')
          )
          Path('/tmp/manifest-first.json').write_text(
              normalized('docs/reference/_data/generated-artifacts.json')
          )
          PY

      - name: Verify generators are idempotent apart from owned timestamps
        run: |
          uv run env PYTHONPATH=src python scripts/generate_public_function_call_flows_json.py
          uv run env PYTHONPATH=src python scripts/generate_individual_function_reference_pages.py
          git diff --binary -- scripts/reference_docs_metadata.py docs/api/reference docs/reference/index.md docs/reference/function-call-graph.md docs/reference/metadata.md docs/reference/metadata > /tmp/generated-second.diff
          cmp /tmp/generated-first.diff /tmp/generated-second.diff
          python - <<'PY'
          import json
          from pathlib import Path

          def normalized(path):
              value = json.loads(Path(path).read_text())
              def clean(obj):
                  if isinstance(obj, dict):
                      return {k: clean(v) for k, v in obj.items() if not k.startswith('generated_at')}
                  if isinstance(obj, list):
                      return [clean(v) for v in obj]
                  return obj
              return json.dumps(clean(value), sort_keys=True, separators=(',', ':'))

          assert Path('/tmp/callflow-first.json').read_text() == normalized(
              'docs/reference/_data/public-function-call-flows.json'
          )
          assert Path('/tmp/manifest-first.json').read_text() == normalized(
              'docs/reference/_data/generated-artifacts.json'
          )
          PY

      - name: Verify selected flows have no architecture violations
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('docs/reference/_data/public-function-call-flows.json').read_text())
          selected = {
              'check_dq',
              'check_freshness',
              'widget_author_dq_rules',
              'widget_author_guardrails',
          }
          bad = {}
          found = set()

          def walk(value):
              if isinstance(value, dict):
                  name = value.get('function_name')
                  if name in selected and (
                      'architecture_violation_count' in value
                      or 'has_architecture_violation' in value
                  ):
                      found.add(name)
                      count = int(value.get('architecture_violation_count') or 0)
                      flag = bool(value.get('has_architecture_violation', False))
                      if count or flag:
                          bad[name] = {'count': count, 'flag': flag}
                  for child in value.values():
                      walk(child)
              elif isinstance(value, list):
                  for child in value:
                      walk(child)

          walk(data)
          assert selected <= found, f'Missing selected flow summaries: {sorted(selected - found)}'
          assert not bad, f'Architecture violations remain: {bad}'
          print(
              'Selected flows have zero Type 1-5 architecture violations:',
              ', '.join(sorted(selected)),
          )
          PY

      - name: Commit source and directly affected generated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests scripts/reference_docs_metadata.py
          git add docs/reference/_data/public-function-call-flows.json docs/reference/_data/generated-artifacts.json
          git add docs/api/reference docs/reference/index.md docs/reference/function-call-graph.md
          git add docs/reference/metadata.md docs/reference/metadata
          if git diff --cached --quiet; then
            echo "No consolidation changes to commit."
          else
            git commit -m "Consolidate Guardrail helpers into shared modules"
            git push origin HEAD:agent/consolidate-guardrail-shared
          fi
