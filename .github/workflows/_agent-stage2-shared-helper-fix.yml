name: Stage 2 shared helper fix

on:
  push:
    branches:
      - agent/stage2-metadata-operational-family

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: agent/stage2-metadata-operational-family
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Apply shared-helper architecture fix
        run: |
          python .github/_agent_stage2_shared_fix.py
          git rm src/fabricops_kit/config/metadata_identity.py
          git rm src/fabricops_kit/pipeline/observation_shared.py
      - name: Install locked dependencies
        run: uv sync --frozen --extra docs --extra dev
      - name: Normalize generated-doc metadata inputs
        run: uv run python scripts/normalize_guided_demo_links.py
      - name: Validate source and tests
        run: |
          uv run ruff check .
          uv run pytest
          uv run python scripts/release_navigation.py --check
      - name: Regenerate owned artifacts
        env:
          PYTHONPATH: src
          FABRICOPS_PRESERVE_GENERATED_ARTIFACT_TIMESTAMPS: "1"
        run: |
          python scripts/generate_public_function_call_flows_json.py
          python scripts/generate_individual_function_reference_pages.py
      - name: Verify generated artifacts are stable
        run: |
          git add src tests scripts docs/reference/_data/public-function-call-flows.json docs/reference/_data/generated-artifacts.json docs/api/reference docs/reference/index.md docs/reference/function-call-graph.md docs/reference/metadata.md docs/reference/metadata
          PYTHONPATH=src FABRICOPS_PRESERVE_GENERATED_ARTIFACT_TIMESTAMPS=1 python scripts/generate_public_function_call_flows_json.py
          PYTHONPATH=src FABRICOPS_PRESERVE_GENERATED_ARTIFACT_TIMESTAMPS=1 python scripts/generate_individual_function_reference_pages.py
          git diff --exit-code -- docs/reference/_data/public-function-call-flows.json docs/api/reference docs/reference/index.md docs/reference/function-call-graph.md docs/reference/metadata.md docs/reference/metadata
      - name: Validate generated artifact ownership
        run: python scripts/validate_generated_artifact_ownership.py --base-ref main
      - name: Build strict documentation
        env:
          FABRICOPS_GIT_SHA: ${{ github.sha }}
        run: uv run mkdocs build --strict
      - name: Commit architecture fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests scripts docs/reference/_data/public-function-call-flows.json docs/reference/_data/generated-artifacts.json docs/api/reference docs/reference/index.md docs/reference/function-call-graph.md docs/reference/metadata.md docs/reference/metadata
          git commit -m "Align Stage 2 helpers with shared architecture"
      - name: Remove temporary files and push
        run: |
          git rm .github/_agent_stage2_shared_fix.py .github/workflows/_agent-stage2-shared-helper-fix.yml
          git commit -m "Remove temporary Stage 2 shared-helper workflow"
          git push origin HEAD:agent/stage2-metadata-operational-family
