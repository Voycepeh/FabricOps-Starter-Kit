name: Harden simplify export

on:
  push:
    branches:
      - agent/add-call-flow-simplify-prompt

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/add-call-flow-simplify-prompt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Harden simplify prompt and export
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/generate_public_function_call_flows_dashboard.py')
          text = path.read_text()

          old = "`- Run targeted tests after simplification.`,`- If callable structure, source locations, public exports, helper relationships, architecture classification, or public flow metrics change, regenerate docs/reference/_data/public-function-call-flows.json with the existing generator.`,`- At the end, report what was simplified, why it is simpler, whether observable behaviour changed, and tests run/results.`"
          new = "`- Establish a behavioural baseline before editing: run the most relevant existing tests for the selected public callable and record the result.`,`- Run the same targeted tests after simplification and require them to pass with the same externally observable behaviour.`,`- Do not change the function's behaviour as part of simplification. If you discover a bug or desirable behaviour change, report it separately and leave it unchanged in this PR.`,`- Preserve parameters, defaults, accepted inputs, returned values and schemas, exceptions, side effects, persisted outputs, audit fields, ordering guarantees, and documented edge-case behaviour.`,`- If behaviour equivalence cannot be demonstrated with existing tests, add focused regression tests that capture the current behaviour before refactoring.`,`- If any targeted test fails, output/schema/side effect changes, or equivalence is uncertain, stop and keep/revert the original implementation rather than forcing the simplification.`,`- If callable structure, source locations, public exports, helper relationships, architecture classification, or public flow metrics change, regenerate docs/reference/_data/public-function-call-flows.json with the existing generator.`,`- At the end, report the before/after tests, what was simplified, why it is simpler, and explicitly confirm whether observable behaviour changed.`"
          if old not in text:
              raise SystemExit('simplify goals anchor not found')
          text = text.replace(old, new, 1)

          old = "function simplifyPacket(){const payload=packet(), evidence=payload.evidence_packet||{}; evidence.prompt_task='simplify_preserve_behaviour'; evidence.cleanup_mode='preserve_compatibility'; evidence.instructions_for_ai=['Simplify only the selected export scope.','Preserve observable behaviour and the selected public callable boundary.','Use deterministic call-flow evidence and tests as the source of truth.','Do not introduce new architecture violations.']; return {codex_prompt:buildSimplifyPrompt(evidence),evidence_packet:evidence}}"
          new = "function simplifyPacket(){if(!selectedPublic)throw new Error('Select a public function before exporting a simplify packet.');const payload=packet(), evidence=payload.evidence_packet||{}; evidence.prompt_task='simplify_preserve_behaviour'; evidence.cleanup_mode='preserve_compatibility'; evidence.instructions_for_ai=['Simplify only the selected export scope.','Preserve observable behaviour and the selected public callable boundary.','Run targeted behavioural tests before and after the change.','If equivalence is uncertain or tests fail, keep/revert the original implementation.','Do not change function behaviour or fix unrelated bugs in a simplify PR.','Use deterministic call-flow evidence and tests as the source of truth.','Do not introduce new architecture violations.']; return {codex_prompt:buildSimplifyPrompt(evidence),evidence_packet:evidence}}"
          if old not in text:
              raise SystemExit('simplify packet anchor not found')
          text = text.replace(old, new, 1)

          old = "function exportSimplifyPacket(){const payload=simplifyPacket(), evidence=payload.evidence_packet||{}, filename=buildSimplifyPacketFilename({exportScope:evidence.export_scope,functionCount:evidence.exported_function_count,publicFunctionName:(evidence.selected_public_function||{}).function_name});download(filename,JSON.stringify(payload,null,2),'application/json');$('exportStatus').textContent='Downloaded Codex/GPT-ready simplify packet.'}"
          new = "function exportSimplifyPacket(){try{const payload=simplifyPacket(), evidence=payload.evidence_packet||{}, filename=buildSimplifyPacketFilename({exportScope:evidence.export_scope,functionCount:evidence.exported_function_count,publicFunctionName:(evidence.selected_public_function||{}).function_name});download(filename,JSON.stringify(payload,null,2),'application/json');$('exportStatus').textContent='Downloaded Codex/GPT-ready simplify packet.'}catch(error){console.error('Simplify packet export failed',error);$('exportStatus').textContent=`Simplify export failed: ${error&&error.message?error.message:error}`;}}"
          if old not in text:
              raise SystemExit('simplify export anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text)

          test = Path('tests/unit/test_call_flow_simplify_prompt.py')
          t = test.read_text()
          anchor = "    assert \"Respect Type 1 to Type 5 architecture rules; do not introduce new architecture violations.\" in html\n"
          addition = anchor + "    assert \"Establish a behavioural baseline before editing\" in html\n    assert \"Run the same targeted tests after simplification\" in html\n    assert \"Do not change the function's behaviour as part of simplification.\" in html\n    assert \"If behaviour equivalence cannot be demonstrated with existing tests\" in html\n    assert \"keep/revert the original implementation\" in html\n    assert \"function exportSimplifyPacket(){try{\" in html\n    assert \"Simplify packet export failed\" in html\n    assert html.count(\"Download Codex cleanup packet\") == 1\n"
          if anchor not in t:
              raise SystemExit('test anchor not found')
          test.write_text(t.replace(anchor, addition, 1))
          PY
      - name: Run focused test
        run: PYTHONPATH=src python -m pytest tests/unit/test_call_flow_simplify_prompt.py -q
      - name: Regenerate dashboard
        run: PYTHONPATH=src python scripts/generate_public_function_call_flows_dashboard.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/generate_public_function_call_flows_dashboard.py tests/unit/test_call_flow_simplify_prompt.py docs/assets/public-function-call-flows-dashboard.html docs/reference/_data/generated-artifacts.json
          git commit -m "harden Codex simplify behaviour preservation"
          git push origin HEAD:agent/add-call-flow-simplify-prompt
