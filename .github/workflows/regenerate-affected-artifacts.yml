name: Regenerate affected artifacts

on:
  push:
    branches:
      - fix/suppress-internal-warehouse-profile-read-logs

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/suppress-internal-warehouse-profile-read-logs
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: uv sync --frozen --extra docs --extra dev
      - name: Regenerate affected artifacts
        shell: bash
        run: |
          set -euo pipefail
          source .venv/bin/activate
          export PYTHONPATH=src
          python scripts/generate_public_function_call_flows_json.py
          python scripts/generate_individual_function_reference_pages.py
          git diff > /tmp/first.diff
          python scripts/generate_public_function_call_flows_json.py
          python scripts/generate_individual_function_reference_pages.py
          git diff > /tmp/second.diff
          diff -u /tmp/first.diff /tmp/second.diff
      - name: Commit generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/reference/_data/public-function-call-flows.json \
                  docs/reference/_data/generated-artifacts.json \
                  docs/api/reference \
                  docs/reference/index.md \
                  docs/reference/function-call-graph.md
          if git diff --cached --quiet; then
            echo "No generated artifact changes."
          else
            git commit -m "Regenerate affected reference artifacts"
            git push origin HEAD:fix/suppress-internal-warehouse-profile-read-logs
          fi
