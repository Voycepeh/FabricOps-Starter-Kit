name: PR1 metadata regeneration

on:
  push:
    branches:
      - feat/repurpose-data-access-metadata
    paths:
      - .github/workflows/pr1-generator.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/repurpose-data-access-metadata
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.11

      - name: Install locked dependencies
        run: uv sync --frozen --all-groups

      - name: Update Data Access generator sources
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path

          metadata = Path("scripts/reference_docs_metadata.py")
          text = metadata.read_text(encoding="utf-8")
          old = '''    "METADATA_DATA_ACCESS": {
                  "purpose": "See who has row-level access to the data.",
                  "grain": "One RLS assignment for one user and one Catalogue table in one environment.",
                  "primary_key": ["access_id"],
                  "foreign_keys": [
                      {"local_field": "table_id", "referenced_table": "METADATA_DATA_CATALOGUE", "referenced_field": "table_id", "cardinality": "N:1", "statement": "Many RLS assignments can reference the same logical Catalogue table identity in an environment."},
                  ],
                  "relationships": [],
              },'''
          new = '''    "METADATA_DATA_ACCESS": {
                  "purpose": "See the SQL permissions observed for governed tables, including direct and role-based access.",
                  "grain": "One observed SQL permission row for one principal and one governed table within one access snapshot.",
                  "primary_key": ["access_id"],
                  "foreign_keys": [
                      {"local_field": "table_id", "referenced_table": "METADATA_DATA_CATALOGUE", "referenced_field": "table_id", "cardinality": "N:1", "statement": "Many observed SQL permission rows can reference the same logical Catalogue table identity in an environment."},
                  ],
                  "relationships": [],
              },'''
          if old not in text:
              raise SystemExit("Expected METADATA_DATA_ACCESS model block not found")
          metadata.write_text(text.replace(old, new, 1), encoding="utf-8")

          generator = Path("scripts/generate_individual_function_reference_pages.py")
          text = generator.read_text(encoding="utf-8")
          old = '''    "user_principal": "User principal recorded for the access row.",
              "role_name": "Role name recorded for the access row.",
              "permission": "Permission recorded for the access row.",
              "access_purpose": "Reason the access row exists.",
              "approval_status": "Approval status recorded for the access row.",
              "access_scope": "Scope of the recorded access entry.",
              "granted_date": "Date when access was granted.",
              "expires_at": "Timestamp when access expires.",
              "approved_by": "Actor who approved the access row.",
              "approved_at": "Timestamp when the access row was approved.",
              "notes": "Free-text notes recorded for the row.",'''
          new = '''    "access_id": "Stable identifier for one observed SQL permission row.",
              "access_snapshot_id": "Identifier grouping permission rows captured in the same access inventory snapshot.",
              "user_principal": "SQL principal name observed for the permission row.",
              "user_type": "SQL principal type observed for the permission row.",
              "role_name": "Database role through which the permission is inherited when applicable.",
              "permission_source": "Whether the observed permission is direct or inherited through a database role.",
              "database_name": "Database containing the observed permission scope.",
              "object_name": "Database object name covered by the observed permission when applicable.",
              "object_type": "Database object type covered by the observed permission when applicable.",
              "access_level": "SQL permission class or scope, such as SCHEMA or OBJECT_OR_COLUMN.",
              "access_value": "SQL permission name, such as SELECT.",
              "access_state": "Observed SQL permission state, such as GRANT or DENY.",
              "permission": "Permission recorded for the access row.",
              "access_purpose": "Reason the access row exists.",
              "approval_status": "Approval status recorded for the access row.",
              "access_scope": "Scope of the recorded access entry.",
              "granted_date": "Date when access was granted.",
              "expires_at": "Timestamp when access expires.",
              "approved_by": "Actor who approved the access row.",
              "approved_at": "Timestamp when the access row was approved.",
              "notes": "Free-text notes recorded for the row.",'''
          if old not in text:
              raise SystemExit("Expected access field description block not found")
          generator.write_text(text.replace(old, new, 1), encoding="utf-8")

          notebook_path = Path("templates/notebooks/00_env_config.ipynb")
          notebook = json.loads(notebook_path.read_text(encoding="utf-8"))
          old_line = "- `METADATA_DATA_ACCESS` is optional manual/offline governance metadata and is created as an empty table when present in the active schema registry. \n"
          new_line = "- `METADATA_DATA_ACCESS` is the canonical schema for observed SQL permission inventory and is created as an empty table until access snapshots are collected. \n"
          replaced = False
          for cell in notebook["cells"]:
              source = cell.get("source", [])
              if old_line in source:
                  source[source.index(old_line)] = new_line
                  replaced = True
          if not replaced:
              raise SystemExit("Expected 00_env_config Data Access wording not found")
          notebook_path.write_text(json.dumps(notebook, indent=1, ensure_ascii=False) + "\n", encoding="utf-8")
          PY

      - name: Generate references first pass
        run: PYTHONPATH=src uv run python scripts/generate_individual_function_reference_pages.py

      - name: Commit first pass outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/reference_docs_metadata.py scripts/generate_individual_function_reference_pages.py templates/notebooks/00_env_config.ipynb docs/reference docs/api/reference docs/reference/_data
          git status --short
          git commit -m "docs: regenerate Data Access metadata references"

      - name: Generate references second pass
        env:
          FABRICOPS_PRESERVE_GENERATED_ARTIFACT_TIMESTAMPS: "1"
        run: PYTHONPATH=src uv run python scripts/generate_individual_function_reference_pages.py

      - name: Confirm second pass is clean
        run: git diff --exit-code

      - name: Run focused tests
        run: uv run pytest tests/unit/test_metadata_schemas.py tests/unit/test_metadata_reference_generator.py tests/unit/test_config.py -q

      - name: Push generated commit
        run: git push origin HEAD:feat/repurpose-data-access-metadata
