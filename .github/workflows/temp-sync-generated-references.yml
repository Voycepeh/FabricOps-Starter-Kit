name: Temporary generated reference sync

on:
  push:
    branches:
      - fix/sync-generated-metadata-reference-pages

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Regenerate owned reference outputs
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src uv run python scripts/generate_individual_function_reference_pages.py
          PYTHONPATH=src uv run python scripts/generate_individual_function_reference_pages.py
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -vE '^(docs/reference/index\.md|docs/reference/metadata/)' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected generated paths:"
            echo "$unexpected"
            exit 1
          fi
          git add docs/reference/index.md docs/reference/metadata/
          if git diff --cached --quiet; then
            echo "No generated reference changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: sync generated reference pages"
          git push
