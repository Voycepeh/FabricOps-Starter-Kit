name: Agent Fix Final Guardrail CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/consolidate-guardrail-shared
          fetch-depth: 1
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv sync --locked --all-groups

      - name: Patch canonical Guardrail consolidation
        run: |
          uv run python - <<'PY'
          from pathlib import Path

          shared = Path('src/fabricops_kit/pipeline/shared.py')
          text = shared.read_text()
          text = text.replace(
              '''def _is_active_guardrail_rule(row: dict) -> bool:\n    activation_state = _string_value(_catalogue_value(row, "activation_state")).lower()\n    if activation_state:\n        if activation_state != "active":\n            return False\n    elif _catalogue_value(row, "is_active") is not True:\n        return False\n    return _rule_review_status(row) in _ACTIVE_RULE_REVIEW_STATUSES\n''',
              '''def _is_active_guardrail_rule(row: dict) -> bool:\n    activation_state = _string_value(_catalogue_value(row, "activation_state")).lower()\n    if activation_state:\n        if activation_state != "active":\n            return False\n    elif _catalogue_value(row, "is_active") is not True:\n        return False\n    review_status = _rule_review_status(row)\n    return not review_status or review_status in _ACTIVE_RULE_REVIEW_STATUSES\n''',
              1,
          )
          text = text.replace(
              'rule_table_key = _string_value(_catalogue_value(row, "metadata_table_key"))',
              'rule_table_key = _string_value(_catalogue_value(row, "table_id", "metadata_table_key"))',
              1,
          )
          text = text.replace(
              '''        "severity": severity,\n        "rule_key": _string_value(_catalogue_value(rule, "rule_key", "rule_id")),\n    })''',
              '''        "severity": severity,\n        "rule_key": _string_value(_catalogue_value(rule, "rule_key", "rule_id")),\n        "guardrail_rule_id": _string_value(_catalogue_value(rule, "guardrail_rule_id", "rule_id")),\n        "guardrail_version": int(_catalogue_value(rule, "guardrail_version", "configuration_version") or 1),\n        "rule_id": _string_value(_catalogue_value(rule, "rule_id")),\n    })''',
              1,
          )
          text = text.replace(
              '{"metadata_table_key", "partition_value", "change_column", "max_change_value", "observed_at"} <= dataframe_columns',
              '{"metadata_table_key", "partition_value", "change_column", "max_change_value", "_committed_at"} <= dataframe_columns',
              1,
          )
          shared.write_text(text)

          path = Path('tests/unit/test_config.py')
          text = path.read_text()
          text = text.replace('src/fabricops_kit/pipeline/guardrails_shared.py', 'src/fabricops_kit/pipeline/shared.py')
          text = text.replace(
              '''    writer_paths = [\n        Path("src/fabricops_kit/pipeline/shared.py"),\n        Path("src/fabricops_kit/widgets/shared.py"),\n        Path("src/fabricops_kit/pipeline/shared.py"),\n    ]''',
              '''    writer_paths = [\n        Path("src/fabricops_kit/widgets/shared.py"),\n        Path("src/fabricops_kit/pipeline/shared.py"),\n    ]''',
          )
          text = text.replace('guardrails_shared_source = Path("src/fabricops_kit/pipeline/shared.py")', 'pipeline_shared_source = Path("src/fabricops_kit/pipeline/shared.py")')
          text = text.replace('in guardrails_shared_source', 'in pipeline_shared_source')
          text = text.replace('not in guardrails_shared_source', 'not in pipeline_shared_source')
          text = text.replace(
              'assert "from fabricops_kit.config.audit import build_runtime_audit_fields" in Path(\n        "src/fabricops_kit/pipeline/shared.py"\n    ).read_text(encoding="utf-8")',
              'assert "build_runtime_audit_fields" in Path(\n        "src/fabricops_kit/pipeline/shared.py"\n    ).read_text(encoding="utf-8")',
          )
          text = text.replace(
              'assert "from fabricops_kit.config.metadata_schemas import coerce_metadata_row_types" in pipeline_shared_source',
              'assert "coerce_metadata_row_types" in pipeline_shared_source',
          )
          path.write_text(text)

          path = Path('tests/unit/test_metadata_writer_ownership.py')
          path.write_text(path.read_text().replace('pipeline/guardrails_shared.py', 'pipeline/shared.py'))

          path = Path('tests/unit/test_governance_review_migration.py')
          text = path.read_text().replace(
              'assert "from fabricops_kit.pipeline.shared import run_active_dq_guardrail" in pipeline_source',
              'assert "def run_active_dq_guardrail(" in pipeline_source',
          )
          path.write_text(text)
          PY

      - name: Validate focused failures
        run: |
          uv run --with ruff ruff check src/fabricops_kit/pipeline/shared.py tests/unit/test_config.py tests/unit/test_metadata_writer_ownership.py tests/unit/test_governance_review_migration.py tests/unit/test_observation_guardrails.py
          uv run pytest -q \
            tests/unit/test_config.py \
            tests/unit/test_governance_review_migration.py \
            tests/unit/test_metadata_writer_ownership.py \
            tests/unit/test_observation_guardrails.py

      - name: Run full test suite
        run: uv run pytest -q

      - name: Regenerate owned architecture outputs
        run: |
          uv run env PYTHONPATH=src python scripts/generate_public_function_call_flows_json.py
          uv run env PYTHONPATH=src python scripts/generate_individual_function_reference_pages.py
          cp docs/reference/_data/public-function-call-flows.json /tmp/callflow-first.json
          git diff --binary -- docs/api/reference docs/reference/index.md docs/reference/function-call-graph.md > /tmp/reference-first.diff
          uv run env PYTHONPATH=src python scripts/generate_public_function_call_flows_json.py
          uv run env PYTHONPATH=src python scripts/generate_individual_function_reference_pages.py
          cmp /tmp/callflow-first.json docs/reference/_data/public-function-call-flows.json
          git diff --binary -- docs/api/reference docs/reference/index.md docs/reference/function-call-graph.md > /tmp/reference-second.diff
          cmp /tmp/reference-first.diff /tmp/reference-second.diff

      - name: Verify selected architecture flows
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('docs/reference/_data/public-function-call-flows.json').read_text())
          selected = {'check_dq', 'check_freshness', 'widget_author_dq_rules', 'widget_author_guardrails'}
          found = set()
          bad = {}
          def walk(value):
              if isinstance(value, dict):
                  name = value.get('function_name')
                  if name in selected and ('architecture_violation_count' in value or 'has_architecture_violation' in value):
                      found.add(name)
                      count = int(value.get('architecture_violation_count') or 0)
                      flag = bool(value.get('has_architecture_violation', False))
                      if count or flag:
                          bad[name] = {'count': count, 'flag': flag}
                  for child in value.values():
                      walk(child)
              elif isinstance(value, list):
                  for child in value:
                      walk(child)
          walk(data)
          assert selected <= found, f'Missing flow summaries: {sorted(selected - found)}'
          assert not bad, f'Architecture violations remain: {bad}'
          PY

      - name: Commit final fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests docs/reference/_data/public-function-call-flows.json docs/reference/_data/generated-artifacts.json docs/api/reference docs/reference/index.md docs/reference/function-call-graph.md
          if ! git diff --cached --quiet; then
            git commit -m "Fix canonical Guardrail consolidation behavior"
            git push origin HEAD:agent/consolidate-guardrail-shared
          fi
