name: Temporary regenerate v0.2.0 release docs

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: uv sync --frozen --extra docs --extra dev
      - name: Regenerate release contract pages
        run: PYTHONPATH=src uv run python scripts/generate_release_contract_pages.py
      - name: Validate release inventory
        run: PYTHONPATH=src uv run python scripts/generate_release_inventory.py --check
      - name: Commit regenerated release docs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-regenerate-v0.2.0-release-docs.yml
          git add docs/releases
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Regenerate v0.2.0 release documentation"
          git push origin HEAD:main
