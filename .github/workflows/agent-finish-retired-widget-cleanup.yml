name: Agent finish retired widget cleanup

on:
  push:
    branches:
      - agent/remove-unused-guardrail-review-widget

permissions:
  contents: write

jobs:
  finish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/remove-unused-guardrail-review-widget
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --frozen --extra docs --extra dev

      - name: Remove stale retired-widget contracts
        run: |
          python - <<'PY'
          import ast
          import json
          from pathlib import Path

          target = 'widget_review_guardrail_governance'

          audit = Path('docs/reference/_data/callable-surface-audit.json')
          rows = json.loads(audit.read_text(encoding='utf-8'))
          rows = [row for row in rows if row.get('function') != target]
          audit.write_text(json.dumps(rows, indent=2) + '\n', encoding='utf-8')

          metadata_test = Path('tests/unit/test_metadata.py')
          text = metadata_test.read_text(encoding='utf-8')
          text = text.replace("        'widget_review_guardrail_governance',\n", '')
          metadata_test.write_text(text, encoding='utf-8')

          catalogue_test = Path('tests/unit/test_function_catalogue.py')
          text = catalogue_test.read_text(encoding='utf-8')
          text = text.replace('assert len(_catalogue_row_names()) == 26', 'assert len(_catalogue_row_names()) == 25')
          catalogue_test.write_text(text, encoding='utf-8')

          writer_test = Path('tests/unit/test_metadata_writer_ownership.py')
          text = writer_test.read_text(encoding='utf-8')
          tree = ast.parse(text)
          lines = text.splitlines(keepends=True)
          fn = next(node for node in tree.body if isinstance(node, ast.FunctionDef) and node.name == 'test_widget_functions_do_not_write_mixed_guardrail_metadata')
          segment = ''.join(lines[fn.lineno - 1:fn.end_lineno])
          segment = segment.replace('    review_source = _function_source(\n        "widgets/widget_review_guardrail_governance.py",\n        "_guardrail_governance_review_widget_workflow",\n    )\n', '')
          segment = segment.replace('    assert "_write_rule_records" in review_source\n', '')
          segment = segment.replace('    for source in (schema_source, dq_source, review_source):\n', '    for source in (schema_source, dq_source):\n')
          lines[fn.lineno - 1:fn.end_lineno] = [segment]
          text = ''.join(lines)
          if target in text:
              raise SystemExit('stale writer ownership reference remains')
          ast.parse(text)
          writer_test.write_text(text, encoding='utf-8')

          generator = Path('scripts/generate_individual_function_reference_pages.py')
          text = generator.read_text(encoding='utf-8')
          text = text.replace('        "widget_review_guardrail_governance",\n', '')
          text = text.replace('    "widgets.widget_review_guardrail_governance": "widgets.widget_review_guardrail_governance",\n', '')
          text = text.replace('    "widget_review_guardrail_governance": ["public_api_entrypoint", "widget_entrypoint", "public_stable"],\n', '')
          if target in text:
              for lineno, line in enumerate(text.splitlines(), 1):
                  if target in line:
                      print(f'remaining generator reference {lineno}: {line}')
              raise SystemExit('stale retired-widget generator reference remains')
          ast.parse(text)
          generator.write_text(text, encoding='utf-8')
          PY

      - name: Normalize authoritative docs metadata
        run: uv run python scripts/normalize_guided_demo_links.py

      - name: Regenerate metadata reference pages twice
        run: |
          source .venv/bin/activate
          PYTHONPATH=src python - <<'PY'
          from scripts.generate_individual_function_reference_pages import generate_metadata_reference_pages
          generate_metadata_reference_pages()
          PY
          git diff -- docs/reference/metadata.md docs/reference/metadata > /tmp/metadata-first.diff
          PYTHONPATH=src python - <<'PY'
          from scripts.generate_individual_function_reference_pages import generate_metadata_reference_pages
          generate_metadata_reference_pages()
          PY
          git diff -- docs/reference/metadata.md docs/reference/metadata > /tmp/metadata-second.diff
          diff -u /tmp/metadata-first.diff /tmp/metadata-second.diff

      - name: Run previously failing tests
        run: |
          uv run pytest \
            tests/unit/test_function_catalogue.py \
            tests/unit/test_generated_docs_links.py \
            tests/unit/test_metadata.py \
            tests/unit/test_metadata_writer_ownership.py

      - name: Commit focused fixes and generated metadata diff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/agent-finish-retired-widget-cleanup.yml
          git add -u -- \
            .github/workflows/agent-finish-retired-widget-cleanup.yml \
            docs/reference/_data/callable-surface-audit.json \
            docs/reference/metadata.md docs/reference/metadata \
            scripts/generate_individual_function_reference_pages.py \
            scripts/reference_docs_metadata.py \
            tests/unit/test_function_catalogue.py \
            tests/unit/test_metadata.py \
            tests/unit/test_metadata_writer_ownership.py
          git commit -m "test: align retired widget contracts"
          git push origin HEAD:agent/remove-unused-guardrail-review-widget
