name: Temporary observe_table cleanup

on:
  push:
    branches:
      - cleanup-internalize-observe-table

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install locked dependencies
        run: uv sync --frozen --extra docs --extra dev

      - name: Fix public documentation metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          metadata_path = Path("scripts/reference_docs_metadata.py")
          text = metadata_path.read_text(encoding="utf-8")
          original = text

          replacements = {
              "'widget_select_data_contract', 'observe_table', 'check_schema'": "'widget_select_data_contract', 'read_pipeline_prep', 'check_schema'",
              "'related_functions': ['check_schema', 'check_freshness', 'observe_table']": "'related_functions': ['check_schema', 'check_freshness', 'read_pipeline_prep']",
              "'related_functions': ['observe_table', 'check_changes', 'write_pipeline_prep', 'read_lakehouse_table']": "'related_functions': ['check_changes', 'write_pipeline_prep', 'read_lakehouse_table']",
              '"fabricops_kit.pipeline.observe_table.observe_table"': '"fabricops_kit.pipeline.observe_table._observe_table_core"',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count == 0:
                  raise SystemExit(f"Expected metadata text not found: {old}")
              text = text.replace(old, new)

          pattern = re.compile(
              r"\n \{'kind': 'function',\n"
              r"  'module': 'pipeline',\n"
              r"  'function_type': 'callable',\n"
              r"  'summary_override': 'Record compact count and change-value bounds before expensive source work\.',\n"
              r"  'symbol_name': 'observe_table',\n"
              r".*?"
              r"  'related_functions': \['read_warehouse_query', 'read_lakehouse_table', 'check_changes'\]\},",
              re.S,
          )
          text, removed = pattern.subn("", text, count=1)
          if removed != 1:
              raise SystemExit(f"Expected to remove one observe_table PUBLIC_SYMBOL_DOCS entry, removed={removed}")

          if text == original:
              raise SystemExit("No metadata changes were made")
          metadata_path.write_text(text, encoding="utf-8")

          generator_path = Path("scripts/generate_individual_function_reference_pages.py")
          generator = generator_path.read_text(encoding="utf-8")
          old = '"METADATA_SOURCE_OBSERVATION": ["observe_table"],'
          new = '"METADATA_SOURCE_OBSERVATION": ["read_pipeline_prep"],'
          if old not in generator:
              raise SystemExit("Expected METADATA_SOURCE_OBSERVATION related-function mapping not found")
          generator = generator.replace(old, new, 1)
          generator_path.write_text(generator, encoding="utf-8")
          PY

      - name: Regenerate directly affected reference artifacts
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src uv run python scripts/generate_public_function_call_flows_json.py
          PYTHONPATH=src uv run python scripts/generate_individual_function_reference_pages.py
          git diff > /tmp/generator-pass-1.diff
          PYTHONPATH=src uv run python scripts/generate_public_function_call_flows_json.py
          PYTHONPATH=src uv run python scripts/generate_individual_function_reference_pages.py
          git diff > /tmp/generator-pass-2.diff
          cmp /tmp/generator-pass-1.diff /tmp/generator-pass-2.diff

      - name: Validate focused cleanup
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check scripts/reference_docs_metadata.py scripts/generate_individual_function_reference_pages.py src/fabricops_kit/pipeline/observe_table.py src/fabricops_kit/pipeline/read_pipeline_prep.py tests/unit/test_function_catalogue.py tests/unit/test_table_observation.py tests/contract/test_public_docstring_preservation.py
          uv run pytest tests/unit/test_function_catalogue.py tests/unit/test_table_observation.py tests/contract/test_public_docstring_preservation.py
          if grep -n "'symbol_name': 'observe_table'" scripts/reference_docs_metadata.py; then
            echo "observe_table remains in public symbol docs" >&2
            exit 1
          fi
          if grep -n "'observe_table'" scripts/reference_docs_metadata.py | grep TEMPLATE_FLOW_DOCS; then
            echo "observe_table remains in template flow docs" >&2
            exit 1
          fi

      - name: Commit generated synchronization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/reference_docs_metadata.py scripts/generate_individual_function_reference_pages.py docs/reference/_data/public-function-call-flows.json docs/reference/_data/generated-artifacts.json docs/api/reference docs/reference/index.md docs/reference/function-call-graph.md docs/reference/call-graph.md docs/reference/metadata.md
          git diff --cached --name-only
          git commit -m "Synchronize references after observe_table cleanup"
          git push origin HEAD:cleanup-internalize-observe-table
