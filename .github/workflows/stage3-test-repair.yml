name: Stage 3 test repair

on:
  push:
    branches:
      - hotfix/stage3-metadata-reference-contract

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: hotfix/stage3-metadata-reference-contract
          fetch-depth: 0

      - name: Patch stale Stage 3 tests
        run: |
          python - <<'PY'
          from pathlib import Path

          owner = Path('tests/contract/test_public_owner_file_pattern.py')
          text = owner.read_text()
          old = '{"__init__.py", "shared.py", "audit.py", "metadata_schemas.py", "guardrails_shared.py", "notebook_registry.py"}'
          new = '{"__init__.py", "shared.py", "audit.py", "metadata_schemas.py", "guardrails_shared.py", "enrichment_shared.py", "notebook_registry.py"}'
          count = text.count(old)
          if count != 4:
              raise SystemExit(f'Expected 4 shared-helper exclusion sets, found {count}')
          owner.write_text(text.replace(old, new))

          config = Path('tests/unit/test_config.py')
          text = config.read_text()
          old = '''    assert access_fields[:14] == [
        "user_principal",
        "role_name",
        "permission",
        "access_purpose",
        "approval_status",
        "access_scope",
        "table_id",
        "metadata_table_key",
        "metadata_column_key",
        "granted_date",
        "expires_at",
        "approved_by",
        "approved_at",
        "notes",
    ]'''
          new = '''    assert access_fields[:7] == [
        "access_id",
        "user_principal",
        "table_id",
        "environment_name",
        "access_level",
        "access_value",
        "access_state",
    ]'''
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one stale METADATA_DATA_ACCESS schema assertion')
          config.write_text(text.replace(old, new))
          PY

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/stage3-test-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/contract/test_public_owner_file_pattern.py tests/unit/test_config.py .github/workflows/stage3-test-repair.yml
          git commit -m "Fix Stage 3 architecture and access schema tests"
          git push origin HEAD:hotfix/stage3-metadata-reference-contract
