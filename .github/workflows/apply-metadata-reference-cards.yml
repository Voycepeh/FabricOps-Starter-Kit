name: Apply metadata reference cards

on:
  push:
    branches:
      - docs/metadata-reference-cards

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/metadata-reference-cards
          fetch-depth: 0
      - name: Apply metadata reference update
        run: python .github/scripts/apply_metadata_reference_cards.py
      - name: Validate focused output
        run: |
          python -m py_compile scripts/generate_individual_function_reference_pages.py
          grep -q 'class="metadata-table-card"' docs/reference/metadata.md
          grep -q 'METADATA_DATA_CATALOGUE.table_id' docs/reference/metadata.md
          grep -q '1 → N' docs/reference/metadata.md
          if grep -q 'View full schema' docs/reference/metadata.md; then exit 1; fi
          if grep -q '## Data Agreement versus Data Contract' docs/reference/metadata.md; then exit 1; fi
          cp docs/reference/metadata.md /tmp/metadata-before.md
          python - <<'PY'
          from pathlib import Path
          import runpy
          generator = runpy.run_path('scripts/generate_individual_function_reference_pages.py', run_name='metadata_reference_generator')
          metadata = runpy.run_path('scripts/reference_docs_metadata.py')
          Path('docs/reference/metadata.md').write_text(
              generator['render_metadata_reference_index'](
                  metadata['METADATA_TABLE_MODELS'],
                  metadata['METADATA_REFERENCE_ORDER'],
                  metadata['METADATA_TABLE_PURPOSES'],
              ),
              encoding='utf-8',
          )
          PY
          cmp /tmp/metadata-before.md docs/reference/metadata.md
          git diff --check
      - name: Commit final change
        run: |
          rm .github/workflows/apply-metadata-reference-cards.yml
          rm .github/scripts/apply_metadata_reference_cards.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/generate_individual_function_reference_pages.py docs/reference/metadata.md .github/workflows/apply-metadata-reference-cards.yml .github/scripts/apply_metadata_reference_cards.py
          git commit -m 'Improve metadata reference table cards'
          git push origin HEAD:docs/metadata-reference-cards
