name: Fix call graph test lint

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'fix/function-call-graph-root-v2' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/function-call-graph-root-v2
          fetch-depth: 0

      - name: Fix test formatting
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path('tests/unit/test_reference_agent_docs.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '    generator_source = (ROOT / "scripts" / "generate_individual_function_reference_pages.py").read_text(encoding="utf-8")',
              '    generator_path = ROOT / "scripts/generate_individual_function_reference_pages.py"\n    generator_source = generator_path.read_text(encoding="utf-8")',
          )
          text = re.sub(r'\n{4,}', '\n\n\n', text)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit test formatting fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/test_reference_agent_docs.py
          git commit -m "style: fix call graph test formatting"
          git push origin HEAD:fix/function-call-graph-root-v2
