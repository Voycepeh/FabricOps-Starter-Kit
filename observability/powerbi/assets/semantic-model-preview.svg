<path class="r" d="M922 300 L922 235"/><path class="r" d="M1010 190 L1070 190"/><path class="r" d="M1185 350 L1367 235"/><path class="r" d="M1010 410 L1010 500"/><path class="r" d="M1135 560 L1290 560"/><path class="r" d="M1010 620 L1010 715"/><path class="r" d="M1140 775 L1290 775"/><path class="r" d="M1420 715 L1420 670"/>
<g transform="translate(40 145)"><rect class="box" width="150" height="120" rx="6"/><text class="n" x="14" y="27">Pipeline Registry</text><text class="s" x="14" y="49">latest version/status</text><text class="s" x="14" y="67">promotion + notebook</text><text class="s" x="14" y="96">Pipeline Key →</text></g><g transform="translate(40 280)"><rect class="bridge" width="150" height="120" rx="6"/><text class="n" x="14" y="27">Pipeline Activation</text><text class="s" x="14" y="49">decision history</text><text class="s" x="14" y="67">submitted Dry Run</text><text class="s" x="14" y="96">Pipeline Key →</text></g><g transform="translate(40 415)"><rect class="box" width="150" height="120" rx="6"/><text class="n" x="14" y="27">Pipeline Run</text><text class="s" x="14" y="49">bounded history</text><text class="s" x="14" y="67">status + duration</text><text class="s" x="14" y="96">Pipeline Key →</text></g>
<g transform="translate(340 165)"><rect class="core" width="350" height="110" rx="8"/><text class="n" x="18" y="31">Pipeline</text><text class="s" x="18" y="55">one row per workspace_id | pipeline_id</text><text class="s" x="18" y="78">identity dimension across Registry, Activation, and Run</text></g><g transform="translate(340 365)"><rect class="box" width="350" height="120" rx="6"/><text class="n" x="18" y="29">Run Operation</text><text class="s" x="18" y="52">read/write role + mode</text><text class="s" x="18" y="72">selective destination + Contract fields</text><text class="s" x="18" y="94">Run ID · Table Key</text></g>
<g transform="translate(40 560)"><rect class="box" width="170" height="105" rx="6"/><text class="n" x="14" y="27">Run Stage</text><text class="s" x="14" y="50">stage/status/evaluation</text><text class="s" x="14" y="75">Run ID</text></g><g transform="translate(235 560)"><rect class="box" width="170" height="105" rx="6"/><text class="n" x="14" y="27">Run Failure</text><text class="s" x="14" y="50">safe code/type only</text><text class="s" x="14" y="75">Run ID</text></g><g transform="translate(430 560)"><rect class="box" width="205" height="105" rx="6"/><text class="n" x="14" y="27">Guardrail Result</text><text class="s" x="14" y="50">recorded sequential result</text><text class="s" x="14" y="75">Run ID · Table Key</text></g>
<g transform="translate(835 300)"><rect class="core" width="350" height="110" rx="8"/><text class="n" x="18" y="31">Catalogue Table</text><text class="s" x="18" y="55">one row per workspace_id | table_id</text><text class="s" x="18" y="78">physical table identity and catalogue context</text></g><g transform="translate(835 145)"><rect class="box" width="175" height="90" rx="6"/><text class="n" x="14" y="27">Catalogue Column</text><text class="s" x="14" y="52">Table Key · Column Key</text></g><g transform="translate(1070 145)"><rect class="box" width="190" height="90" rx="6"/><text class="n" x="14" y="27">Profiled Column</text><text class="s" x="14" y="52">latest snapshot/column</text></g><g transform="translate(1275 145)"><rect class="box" width="185" height="90" rx="6"/><text class="n" x="14" y="27">Data Access</text><text class="s" x="14" y="52">latest observed snapshot</text></g>
<g transform="translate(835 500)"><rect class="bridge" width="300" height="120" rx="6"/><text class="n" x="15" y="28">Contract Activation</text><text class="s" x="15" y="51">latest exact physical selection</text><text class="s" x="15" y="72">Table Key · Contract Key · Agreement Key</text></g><g transform="translate(1290 500)"><rect class="box" width="170" height="105" rx="6"/><text class="n" x="14" y="27">Data Contract</text><text class="s" x="14" y="50">selected readable fields</text><text class="s" x="14" y="75">Contract Key</text></g><g transform="translate(835 715)"><rect class="box" width="305" height="120" rx="6"/><text class="n" x="15" y="28">Data Agreement</text><text class="s" x="15" y="51">versioned governance context</text><text class="s" x="15" y="74">Agreement Key</text></g><g transform="translate(1290 715)"><rect class="bridge" width="170" height="120" rx="6"/><text class="n" x="14" y="27">Agreement Steward</text><text class="s" x="14" y="50">Provider / Recipient</text><text class="s" x="14" y="73">participation bridge</text></g><g transform="translate(1290 600)"><rect class="box" width="170" height="70" rx="6"/><text class="n" x="14" y="27">Data Steward</text><text class="s" x="14" y="50">name + contact</text></g><text class="s" x="40" y="875">Teal boxes are the two report cores. Amber boxes are explicit bridges/evidence; Steward participation is not asserted as table ownership.</text></svg>
