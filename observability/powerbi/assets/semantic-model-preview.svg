<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="t d"><title id="t">FabricOps Observability semantic model</title><desc id="d">Relationship diagram centered on Pipeline and physical Table identities.</desc><rect width="1500" height="900" fill="#F8FAFC"/><defs><style>.box{fill:#FFF;stroke:#CBD5E1;stroke-width:1.5}.core{fill:#E6FFFB;stroke:#0F766E;stroke-width:2}.bridge{fill:#FFF7ED;stroke:#F59E0B;stroke-width:1.5}.h{font:600 25px 'Segoe UI';fill:#172033}.n{font:600 15px 'Segoe UI';fill:#172033}.s{font:11px 'Segoe UI';fill:#64748B}.r{stroke:#94A3B8;stroke-width:1.5;fill:none}.rb{stroke:#0F766E;stroke-width:2;fill:none}</style><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#94A3B8"/></marker></defs><text class="h" x="35" y="45">FabricOps Observability v1 · semantic model</text><text class="s" x="1460" y="42" text-anchor="end">workspace-aware composite keys retained</text>
<text class="n" x="55" y="92">Engineering / Pipeline core</text><text class="n" x="820" y="92">Governance / Table core</text>
