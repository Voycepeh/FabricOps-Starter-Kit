site_name: FabricOps Starter Kit
repo_url: https://github.com/Voycepeh/FabricOps-Starter-Kit
site_url: https://voycepeh.github.io/FabricOps-Starter-Kit/

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.code.copy
  palette:
    - scheme: default
      primary: custom
      accent: custom

nav:
  - Home: index.md

  - Quick Start:
      - Overview: quick-start.md
      - Install: install.md
      - Create Wheel: setup/create-wheel.md
      - Run in Fabric: setup/run-in-fabric.md

  - How FabricOps Works:
      - Overview: how-fabricops-works/index.md
      - Notebook Templates: how-fabricops-works/notebook-templates.md
      - Metadata Tables: how-fabricops-works/metadata-tables.md
      - Pipeline Guardrails: how-fabricops-works/schema-and-data-drift.md
      - Governance Review: how-fabricops-works/governance-review.md
      - Metadata Dashboard: how-fabricops-works/metadata-dashboard.md

  - Maintainer Guide:
      - Release Management: development/release-management.md
      - Release Traceability: release-info.md
      - Documentation Versioning: development/docs-versioning.md

  - Function Reference:
      - Overview: reference/index.md
      - Template Function Map: reference/template-function-map.md
      - Implementation Modules:
          # AUTO-GENERATED-MODULES-START
          - config: api/modules/config.md
          - data_agreement: api/modules/data_agreement.md
          - governance_review: api/modules/governance_review.md
          - data_profiling: api/modules/data_profiling.md
          - fabric_input_output: api/modules/fabric_input_output.md
          - data_lineage: api/modules/data_lineage.md
          - drift: api/modules/drift.md
          - metadata: api/modules/metadata.md
      # AUTO-GENERATED-MODULES-END

extra:
  version:
    provider: mike
  fabricops_release:
    package_version: !ENV [FABRICOPS_PACKAGE_VERSION, "unknown"]
    doc_version: !ENV [FABRICOPS_DOC_VERSION, "unknown"]
    git_sha: !ENV [FABRICOPS_GIT_SHA, "unknown"]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

hooks:
  - docs/gen_release_info.py

plugins:
  - search
  - gen-files:
      scripts:
        - docs/gen_ref_pages.py
  - literate-nav
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_signature_annotations: false
            separate_signature: true
            members_order: source
            show_root_heading: false
            show_root_toc_entry: false
            show_if_no_docstring: true
            docstring_style: numpy
            docstring_section_style: table
            docstring_options:
              ignore_init_summary: true

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - javascripts/mermaid-init.js
  - javascripts/callable-finder.js

extra_css:
  - stylesheets/api-chips.css
  - stylesheets/layout-wide.css
  - stylesheets/fabric-theme.css
