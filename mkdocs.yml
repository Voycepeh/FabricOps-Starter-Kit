site_name: FabricOps Starter Kit
repo_url: https://github.com/Voycepeh/FabricOps-Starter-Kit
site_url: https://voycepeh.github.io/FabricOps-Starter-Kit/

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.follow
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo

nav:
  - Home: index.md

  - Start Here:
      - Quick Start: quick-start.md
      - Workflow Overview: workflow.md
      - Notebook Structure: notebook-structure.md
      - Deployment & Promotion: deployment-and-promotion.md
      - Install in Fabric: setup/run-in-fabric.md

  - Build a Data Product:
      - Overview: build-a-data-product.md
      - Function Usage Guide: reference/function-usage-guide.md
      - Template Function Map: reference/template-function-map.md
      - Notebook Recipes: recipes/index.md
      - Run Summary & Handover: api/modules/handover.md

  - Governance & AI:
      - Overview: governance-and-ai.md
      - Metadata & Contracts: metadata-and-contracts.md
      - Data Quality: data-quality-rules-system.md
      - Governance Workflow: notebook-structure/04-governance-enrichment.md
      - Drift & Contracts: api/modules/drift.md

  - Developer Reference:
      - Overview: developer-reference.md
      - Callable Function Reference: reference/index.md
      - Modules:
      # AUTO-GENERATED-MODULES-START
          - config: api/modules/config.md
          - data_agreement: api/modules/data_agreement.md
          - business_context: api/modules/business_context.md
          - data_governance: api/modules/data_governance.md
          - data_profiling: api/modules/data_profiling.md
          - data_quality: api/modules/data_quality.md
          - fabric_input_output: api/modules/fabric_input_output.md
          - technical_columns: api/modules/technical_columns.md
          - data_lineage: api/modules/data_lineage.md
          - drift: api/modules/drift.md
          - handover: api/modules/handover.md
          - metadata: api/modules/metadata.md
      # AUTO-GENERATED-MODULES-END
      - Dependency Explorer: reference/call-graph.md
      - Agent Function Manifest: reference/agent-manifest.json

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
  - gen-files:
      scripts:
        - docs/gen_ref_pages.py
  - literate-nav
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_signature_annotations: false
            separate_signature: true
            members_order: source
            show_root_heading: false
            show_root_toc_entry: false
            show_if_no_docstring: true
            docstring_style: numpy
            docstring_section_style: table
            docstring_options:
              ignore_init_summary: true

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - https://unpkg.com/vis-network@9.1.9/dist/vis-network.min.js
  - javascripts/mermaid-init.js
  - javascripts/callable-finder.js
  - javascripts/call-graph.js

extra_css:
  - stylesheets/api-chips.css
