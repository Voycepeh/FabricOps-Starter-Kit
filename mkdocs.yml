site_name: FabricOps Starter Kit
repo_url: https://github.com/Voycepeh/FabricOps-Starter-Kit
site_url: https://voycepeh.github.io/FabricOps-Starter-Kit/

theme:
  name: material
  custom_dir: overrides
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.code.copy
  palette:
    - scheme: default
      primary: custom
      accent: custom

nav:
  - Home: index.md
  - How FabricOps Works: how-fabricops-works.md
  - Function Call Graph: function-call-graph.md
  - Guided Demo:
      - Overview: guided-demo.md
      - Create Wheel: guided-demo/create-wheel.md
      - Setup Fabric Artifacts: guided-demo/setup-fabric-artifacts.md
      - Run Environment Setup: guided-demo/run-environment-setup.md
      - Run IO and Profiling Demo: guided-demo/run-io-and-profiling-demo.md
      - Register Agreement: guided-demo/create-agreement.md
      - Run Example Pipeline Demo and Pipeline: guided-demo/run-pipeline.md
      - Review Governance: guided-demo/review-guardrails.md
      - Explore Metadata: guided-demo/explore-metadata-outputs.md
  - Notebook Templates Implementation Guide: notebook-templates-implementation-guide/index.md
  - Releases:
      - Overview: releases/index.md
      - 0.2.0: releases/0.2.0/index.md
  - List of Metadata Tables:
      - Overview: reference/metadata.md
      - Data Access: reference/metadata/metadata_data_access.md
      - Data Agreement: reference/metadata/metadata_data_agreement.md
      - Data Agreement Evidence: reference/metadata/metadata_data_agreement_evidence.md
      - Data Catalogue: reference/metadata/metadata_data_catalogue.md
      - Data Lineage Table: reference/metadata/metadata_data_lineage_table.md
      - Data Steward: reference/metadata/metadata_data_steward.md
      - Enrichment Rules: reference/metadata/metadata_enrichment_rules.md
      - Guardrail Results: reference/metadata/metadata_guardrail_results.md
      - Guardrail Rules: reference/metadata/metadata_guardrail_rules.md
      - Notebook Registry: reference/metadata/metadata_notebook_registry.md
      - Pipeline Runs: reference/metadata/metadata_pipeline_runs.md
  - List of Functions: reference/index.md
  - List of DQ Rules:
      - Overview: reference/dq-rules/index.md
      - not_null: reference/dq-rules/not-null.md
      - null_rate_below: reference/dq-rules/null-rate-below.md
      - non_empty_string: reference/dq-rules/non-empty-string.md
      - unique: reference/dq-rules/unique.md
      - unique_combination: reference/dq-rules/unique-combination.md
      - accepted_values: reference/dq-rules/accepted-values.md
      - not_in_values: reference/dq-rules/not-in-values.md
      - between: reference/dq-rules/between.md
      - greater_than: reference/dq-rules/greater-than.md
      - greater_than_or_equal: reference/dq-rules/greater-than-or-equal.md
      - less_than: reference/dq-rules/less-than.md
      - less_than_or_equal: reference/dq-rules/less-than-or-equal.md
      - regex_match: reference/dq-rules/regex-match.md
      - date_not_future: reference/dq-rules/date-not-future.md
      - date_between: reference/dq-rules/date-between.md
      - freshness: reference/dq-rules/freshness.md
      - max_age_days: reference/dq-rules/max-age-days.md
      - column_pair_equal: reference/dq-rules/column-pair-equal.md
      - column_a_gte_column_b: reference/dq-rules/column-a-gte-column-b.md
      - column_a_gt_column_b: reference/dq-rules/column-a-gt-column-b.md
      - required_when: reference/dq-rules/required-when.md
      - value_when: reference/dq-rules/value-when.md
      - expression_true: reference/dq-rules/expression-true.md
  - Maintainer References:
      - Public API Contract: reference/public-api-contract.md
      - Public Function Architecture: reference/public-function-architecture.md
      - Release Management: development/release-management.md
      - Release Traceability: release-info.md
      - Documentation Versioning: development/docs-versioning.md
      - Implementation Appendix:
          # AUTO-GENERATED-MODULES-START
          []
      # AUTO-GENERATED-MODULES-END

extra:
  version:
    provider: mike
  fabricops_release:
    package_version: !ENV [FABRICOPS_PACKAGE_VERSION, "unknown"]
    doc_version: !ENV [FABRICOPS_DOC_VERSION, "unknown"]
    git_sha: !ENV [FABRICOPS_GIT_SHA, "unknown"]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

hooks:
  - docs/gen_release_info.py
  - docs/copy_markdown_variants.py
  - docs/breadcrumbs.py

plugins:
  - search
  - gen-files:
      scripts:
        - docs/gen_ref_pages.py
  - literate-nav
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_signature_annotations: false
            separate_signature: true
            members_order: source
            show_root_heading: false
            show_root_toc_entry: false
            show_if_no_docstring: true
            docstring_style: numpy
            docstring_section_style: table
            docstring_options:
              ignore_init_summary: true

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - javascripts/mermaid-init.js
  - javascripts/callable-finder.js
  - javascripts/table-controls.js

extra_css:
  - stylesheets/breadcrumbs.css
  - stylesheets/api-chips.css
  - stylesheets/layout-wide.css
  - stylesheets/fabric-theme.css
  - stylesheets/table-controls.css
