site_name: FabricOps Starter Kit
repo_url: https://github.com/Voycepeh/FabricOps-Starter-Kit
site_url: https://voycepeh.github.io/FabricOps-Starter-Kit/

theme:
  name: material
  custom_dir: overrides
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.code.copy
    - content.tooltips
  palette:
    - scheme: default
      primary: custom
      accent: custom

nav:
  - Home: index.md
  - How FabricOps Works: how-fabricops-works.md
  - Guided Demo:
      - Learning Path: guided-demo.md
      - Step 0A - Prepare Fabric Artifacts: guided-demo/00A-setup-fabric-artifacts.md
      - Step 0B - Set Up Environment: guided-demo/00B-run-environment-setup.md
      - Step 1 - Create Agreement: guided-demo/01-create-agreement.md
      - "Module 2 - Engineer and Run a Pipeline":
          - Overview: guided-demo/02-run-pipeline.md
          - "Unit 1 - Understand the Template": guided-demo/02-run-pipeline/understand-template.md
          - "Unit 2 - Run the Baseline ETL": guided-demo/02-run-pipeline/run-baseline-etl.md
          - "Unit 3 - Configure Sources": guided-demo/02-run-pipeline/configure-sources.md
          - "Unit 4 - Transform and Load": guided-demo/02-run-pipeline/transform-and-load.md
          - "Unit 5 - Processing and Results": guided-demo/02-run-pipeline/processing-and-results.md
      - Step 3 - Review and Author Guardrails: guided-demo/03-enrich-guardrails.md
      - Step 4 - Validate Guardrails: guided-demo/04-run-pipeline-with-guardrails.md
      - Step 5 - Create and Activate Data Contract: guided-demo/05-create-data-contract.md
      - Step 6 - Run Production with Active Contract: guided-demo/06-promote-to-production.md
      - Optional - Data Exploration for consumers: guided-demo/99-explore-via-notebook.md
  - Resources & Reference:
      - Notebook Templates: notebook-templates.md
      - FabricOps Engineering Guide: reference/engineering-cheat-sheet.md
      - Glossary: glossary.md
      - Metadata Tables:
          - Overview: reference/metadata.md
          - Data Steward: reference/metadata/metadata_data_steward.md
          - Data Agreement: reference/metadata/metadata_data_agreement.md
          - Source Observation: reference/metadata/metadata_source_observation.md
          - Data Catalogue: reference/metadata/metadata_data_catalogue.md
          - Data Profiled: reference/metadata/metadata_data_profiled.md
          - Data Profiled Frequency: reference/metadata/metadata_data_profiled_frequency.md
          - Data Lineage: reference/metadata/metadata_data_lineage.md
          - Enrichment: reference/metadata/metadata_enrichment.md
          - Guardrail: reference/metadata/metadata_guardrail.md
          - Guardrail Results: reference/metadata/metadata_guardrail_results.md
          - Guardrail Row Results: reference/metadata/metadata_guardrail_row_results.md
          - Data Contract: reference/metadata/metadata_data_contract.md
          - Data Access: reference/metadata/metadata_data_access.md
      - Functions:
          - Function Reference: reference/index.md
          - Call Flow Dashboard: assets/public-function-call-flows-dashboard.html
          - Function Call Graph: function-call-graph.md
      - DQ Rules:
          - Overview: reference/dq-rules/index.md
          - missing_values: reference/dq-rules/missing-values.md
          - blank_text: reference/dq-rules/blank-text.md
          - unique_values: reference/dq-rules/unique-values.md
          - unique_combination: reference/dq-rules/unique-combination.md
          - allowed_values: reference/dq-rules/allowed-values.md
          - blocked_values: reference/dq-rules/blocked-values.md
          - value_range: reference/dq-rules/value-range.md
          - text_pattern: reference/dq-rules/text-pattern.md
          - required_when: reference/dq-rules/required-when.md
          - conditional_value: reference/dq-rules/conditional-value.md
          - compare_columns: reference/dq-rules/compare-columns.md
  - Releases:
      - Overview: releases/index.md
      - 0.2.0: releases/0.2.0/index.md
      - 0.1.0: releases/0.1.0/index.md
  - Maintainer:
      - Product Definition: maintainer/product-definition.md
      - Release Guide: maintainer/index.md
      - Public API & Architecture: maintainer/public-api-architecture.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

hooks:
  - docs/copy_markdown_variants.py
  - docs/breadcrumbs.py
  - docs/glossary_tooltips.py

plugins:
  - search
  - gen-files:
      scripts:
        - docs/gen_ref_pages.py
  - literate-nav
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_signature_annotations: false
            separate_signature: true
            members_order: source
            show_root_heading: false
            show_root_toc_entry: false
            show_if_no_docstring: true
            docstring_style: numpy
            docstring_section_style: table
            docstring_options:
              ignore_init_summary: true

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - javascripts/mermaid-init.js
  - javascripts/callable-finder.js
  - javascripts/table-controls.js
  - javascripts/engineering-guide-deeplinks.js

extra_css:
  - stylesheets/breadcrumbs.css
  - stylesheets/api-chips.css
  - stylesheets/release-status.css
  - stylesheets/release-pages.css
  - stylesheets/layout-wide.css
  - stylesheets/fabric-theme.css
  - stylesheets/table-controls.css
  - stylesheets/image-borders.css
