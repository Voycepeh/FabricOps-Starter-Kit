site_name: FabricOps Starter Kit
repo_url: https://github.com/Voycepeh/FabricOps-Starter-Kit
site_url: https://voycepeh.github.io/FabricOps-Starter-Kit/

theme:
  name: material
  custom_dir: overrides
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tooltips
  palette:
    - scheme: default
      primary: custom
      accent: custom

nav:
  - Home: index.md
  - How FabricOps Works: how-fabricops-works.md
  - Featured Solutions:
      - Plug-and-Play Data Pipelines with Data Contract Enforcement: solutions/plug-and-play-data-pipelines.md
      - Production Table to Data Agent: solutions/production-table-to-data-agent.md
      - Direct & Indirect PII Discovery & Treatment with Built-in AI Suggestions: solutions/ai-assisted-data-contract-authoring.md
      - Data Quality Rules from Natural Language: solutions/business-rules-to-data-quality.md
      - Scan Effective Data Access: solutions/effective-data-access.md
      - Explore How FabricOps Functions Work Under the Hood: function-call-graph.md
  - Guided Demo:
      - Overview: guided-demo.md
      - "0A - Prepare Fabric Artifacts": guided-demo/00A-prepare-fabric-artifacts.md
      - "0B - Configure Environment and Load Assets": guided-demo/00B-configure-environment-and-load-assets.md
      - "0C - Prepare Demo Data with FabricOps I/O": guided-demo/00C-prepare-demo-data-with-fabricops-io.md
      - "Step 1 - Establish Governance Context": guided-demo/01-establish-governance-context.md
      - "Step 2 - Build a Pipeline": guided-demo/02-build-and-run-etl.md
      - "Step 2A - Full Refresh Demo": guided-demo/02A-full-refresh-demo.md
      - "Step 2B - Incremental Append Demo": guided-demo/02B-build-and-run-incremental-append-etl.md
      - "Step 2C - SCD1 and SCD2 Demo": guided-demo/02C-build-and-run-scd-etl.md
      - "Step 3 - Author and Freeze Data Contract": guided-demo/03-author-and-freeze-data-contract.md
      - "Step 4 - Select and Validate Data Contract": guided-demo/04-validate-frozen-data-contract.md
      - "Step 5 - Activate Data Contract and Promote": guided-demo/05-activate-data-contract-and-promote.md
      - "Step 6 - Run Production and Grant Access": guided-demo/06-run-production.md
      - "Step 7 - Governed Consumption": guided-demo/07-consume-production-data.md
  - Download FabricOps:
      - Releases (Python package): releases/index.md
      - Notebook Templates: https://github.com/Voycepeh/FabricOps-Starter-Kit/tree/main/templates/notebooks
      - Demo Assets: https://github.com/Voycepeh/FabricOps-Starter-Kit/tree/main/templates/DemoData
  - Reference Documentation:
      - Function Reference: reference/index.md
      - Metadata Tables: reference/metadata.md
      - Data Quality Rules: reference/dq-rules/index.md
      - Read & Write Modes: reference/read-and-load-strategies.md
      - Sensitive Data Treatments: reference/sensitive-data-treatments.md
      - PySpark Transformation: reference/pyspark-transformation.md
      - Glossary: glossary.md      
  - Maintainer:
      - Product Definition: maintainer/product-definition.md
      - Release Guide: maintainer/index.md
      - Public API & Architecture: maintainer/public-api-architecture.md
      - Explore How FabricOps Functions Work Under the Hood: function-call-graph.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

hooks:
  - docs/copy_markdown_variants.py
  - docs/breadcrumbs.py
  - docs/glossary_tooltips.py

plugins:
  - search
  - gen-files:
      scripts:
        - docs/gen_ref_pages.py
  - literate-nav
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_signature_annotations: false
            separate_signature: true
            members_order: source
            show_root_heading: false
            show_root_toc_entry: false
            show_if_no_docstring: true
            docstring_style: numpy
            docstring_section_style: table
            docstring_options:
              ignore_init_summary: true
              merge_init_into_class: true
              show_docstring_attributes: true
              show_docstring_description: true
              show_docstring_examples: true
              show_docstring_other_parameters: true
              show_docstring_parameters: true
              show_docstring_raises: true
              show_docstring_receives: true
              show_docstring_returns: true
              show_docstring_warns: true
              show_docstring_yields: true

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - javascripts/mermaid-init.js
  - javascripts/callable-finder.js
  - javascripts/table-controls.js

extra_css:
  - stylesheets/breadcrumbs.css
  - stylesheets/api-chips.css
  - stylesheets/release-status.css
  - stylesheets/release-pages.css
  - stylesheets/layout-wide.css
  - stylesheets/fabric-theme.css
  - stylesheets/featured-solutions.css
  - stylesheets/workflow.css
  - stylesheets/table-controls.css
  - stylesheets/image-borders.css
